<body>
<header>
  <h1>♠ 德州撲克 GTO 練習器</h1>
  <p>翻前範圍 · 勝率預測 · 底池賠率 · CFR 演示 · 論文索引（單檔離線可用）</p>
</header>

<div id="subnav"></div>
<main>
  <section id="t-course"></section>
  <section id="t-learn"></section>
  <section id="t-sim"></section>
  <section id="t-hist"></section>
  <section id="t-pre"></section>
  <section id="t-eq"></section>
  <section id="t-pot"></section>
  <section id="t-calc"></section>
  <section id="t-icm"></section>
  <section id="t-kuhn"></section>
  <section id="t-paper"></section>
  <section id="t-stat"></section>
  <section id="t-install"></section>
</main>

<script>
/* ============ 基礎：牌、牌力評估 ============ */
const RANKS="23456789TJQKA", SUITS="shdc", SYM={s:"♠",h:"♥",d:"♦",c:"♣"};
const $=id=>document.getElementById(id);
const cardStr=c=>RANKS[c%13]+SUITS[(c/13)|0];
function cardHTML(c){const s=SUITS[(c/13)|0];return `<span class="card ${s==='h'||s==='d'?'r':''}">${RANKS[c%13]}${SYM[s]}</span>`}
function cardsHTML(a){return a.map(cardHTML).join('')}
function parseCards(str){
  const t=str.replace(/[\s,]+/g,'');if(t.length%2)return null;const out=[];
  for(let i=0;i<t.length;i+=2){const r=RANKS.indexOf(t[i].toUpperCase()),u=SUITS.indexOf(t[i+1].toLowerCase());if(r<0||u<0)return null;out.push(u*13+r)}
  return new Set(out).size===out.length?out:null;
}
function pack(cat,a){let v=cat;for(let i=0;i<5;i++)v=v*13+(a[i]||0);return v}
function eval7(cs){
  const rc=new Array(13).fill(0),sm=[0,0,0,0],sn=[0,0,0,0];
  for(const c of cs){const r=c%13,s=(c/13)|0;rc[r]++;sm[s]|=1<<r;sn[s]++}
  let mask=0;for(let r=0;r<13;r++)if(rc[r])mask|=1<<r;
  const sh=m=>{for(let h=12;h>=4;h--)if(((m>>(h-4))&31)===31)return h;return (m&0x100F)===0x100F?3:-1};
  const kick=(ex,n)=>{const o=[];for(let r=12;r>=0&&o.length<n;r--)if(rc[r]&&!ex.includes(r))o.push(r);return o};
  let fs=-1;for(let s=0;s<4;s++)if(sn[s]>=5){fs=s;break}
  if(fs>=0){const h=sh(sm[fs]);if(h>=0)return pack(8,[h])}
  const quads=[],trips=[],pairs=[];
  for(let r=12;r>=0;r--){if(rc[r]===4)quads.push(r);else if(rc[r]===3)trips.push(r);else if(rc[r]===2)pairs.push(r)}
  if(quads.length)return pack(7,[quads[0],...kick([quads[0]],1)]);
  if(trips.length&&(trips.length>1||pairs.length)){
    const p=trips.length>1?Math.max(trips[1],pairs.length?pairs[0]:-1):pairs[0];return pack(6,[trips[0],p])}
  if(fs>=0){const rs=[];for(let r=12;r>=0&&rs.length<5;r--)if((sm[fs]>>r)&1)rs.push(r);return pack(5,rs)}
  const h=sh(mask);if(h>=0)return pack(4,[h]);
  if(trips.length)return pack(3,[trips[0],...kick([trips[0]],2)]);
  if(pairs.length>=2)return pack(2,[pairs[0],pairs[1],...kick([pairs[0],pairs[1]],1)]);
  if(pairs.length===1)return pack(1,[pairs[0],...kick([pairs[0]],3)]);
  return pack(0,kick([],5));
}

/* ============ 範圍：解析、展開、蒙地卡羅勝率 ============ */
function lab(a,b,suited){const hi=Math.max(a,b),lo=Math.min(a,b);return RANKS[hi]+RANKS[lo]+(hi===lo?'':suited?'s':'o')}
function handLabel(c1,c2){return lab(c1%13,c2%13,((c1/13)|0)===((c2/13)|0))}
// 語法：77+, A2s+, ATo+, KQs, 55:0.5（冒號後為混合頻率）
function parseRange(str){
  const m=new Map();
  for(let tok of str.split(',').map(s=>s.trim()).filter(Boolean)){
    const x=/^([2-9TJQKA])([2-9TJQKA])([so]?)(\+)?(?::([\d.]+))?$/i.exec(tok);if(!x)continue;
    const a=RANKS.indexOf(x[1].toUpperCase()),b=RANKS.indexOf(x[2].toUpperCase()),f=x[5]?parseFloat(x[5]):1,plus=!!x[4];
    const hi=Math.max(a,b),lo=Math.min(a,b),sfx=x[3].toLowerCase();
    if(hi===lo){for(let r=lo;r<=(plus?12:lo);r++)m.set(lab(r,r,false),f)}
    else for(let r=lo;r<=(plus?hi-1:lo);r++){
      if(sfx!=='o')m.set(lab(hi,r,true),f);if(sfx!=='s')m.set(lab(hi,r,false),f)}
  }
  return m;
}
function expand(map){
  const out=[];
  for(const [l,f] of map){
    if(f<=0)continue;const a=RANKS.indexOf(l[0]),b=RANKS.indexOf(l[1]);
    if(l.length===2){for(let s1=0;s1<4;s1++)for(let s2=s1+1;s2<4;s2++)out.push({a:s1*13+a,b:s2*13+b,w:f})}
    else if(l[2]==='s'){for(let s=0;s<4;s++)out.push({a:s*13+a,b:s*13+b,w:f})}
    else{for(let s1=0;s1<4;s1++)for(let s2=0;s2<4;s2++)if(s1!==s2)out.push({a:s1*13+a,b:s2*13+b,w:f})}
  }
  return out;
}
const ALLMAP=(()=>{const m=new Map();for(let i=12;i>=0;i--)for(let j=i;j>=0;j--){if(i===j)m.set(lab(i,i,false),1);else{m.set(lab(i,j,true),1);m.set(lab(i,j,false),1)}}return m})();
function equity(hero,board,combosAll,iters){
  const dead=new Set([...hero,...board]);
  const combos=combosAll.filter(x=>!dead.has(x.a)&&!dead.has(x.b));
  if(!combos.length)return null;
  const cum=[];let t=0;for(const x of combos){t+=x.w;cum.push(t)}
  const need=5-board.length,base=[];for(let c=0;c<52;c++)if(!dead.has(c))base.push(c);
  let w=0,ti=0,l=0;
  for(let i=0;i<iters;i++){
    const u=Math.random()*t;let lo=0,hi=cum.length-1;
    while(lo<hi){const m=(lo+hi)>>1;if(cum[m]<u)lo=m+1;else hi=m}
    const v=combos[lo],deck=base.filter(c=>c!==v.a&&c!==v.b),bd=board.slice();
    for(let k=0;k<need;k++){const j=k+((Math.random()*(deck.length-k))|0);const tmp=deck[k];deck[k]=deck[j];deck[j]=tmp;bd.push(deck[k])}
    const hs=eval7([...hero,...bd]),vs=eval7([v.a,v.b,...bd]);
    if(hs>vs)w++;else if(hs<vs)l++;else ti++;
  }
  return {win:w/iters,tie:ti/iters,lose:l/iters,eq:(w+ti/2)/iters};
}
function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ 近似 6-max 100bb 開池（RFI）範圍 ============ */
// 注意：為常見公開圖表的近似值，非即時求解器輸出；混合頻率僅示意。
const RFI={
  UTG:"66+,55:0.5,A9s+,A5s,A4s:0.5,KTs+,QTs+,JTs,T9s,98s:0.5,AJo+,KQo:0.5",
  HJ:"44+,A8s+,A5s,A4s,A3s:0.5,K9s+,Q9s+,J9s+,T9s,98s,87s,76s:0.5,ATo+,KJo+,QJo:0.5",

function gridHTML(map,mine){
  let h='<table class="grid">';
  for(let i=0;i<13;i++){h+='<tr>';for(let j=0;j<13;j++){
    const ri=12-i,rj=12-j;const l=i===j?lab(ri,ri,false):i<j?lab(ri,rj,true):lab(rj,ri,false);
    const f=map.get(l)||0;
    const bg=f>0?`rgba(46,166,106,${(0.25+0.75*f).toFixed(2)})`:'#243140';
    h+=`<td style="background:${bg}" class="${l===mine?'me':''}">${l}</td>`}h+='</tr>'}
  return h+'</table>';
}
function borderline(map){
  const arr=[];
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){
    const ri=12-i,rj=12-j,l=i===j?lab(ri,ri,false):i<j?lab(ri,rj,true):lab(rj,ri,false);
    const f=map.get(l)||0;let edge=f>0&&f<1;
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const a=i+di,b=j+dj;if(a<0||b<0||a>12||b>12)continue;
      const x=12-a,y=12-b,ll=a===b?lab(x,x,false):a<b?lab(x,y,true):lab(y,x,false);
      if(((map.get(ll)||0)>0)!==(f>0))edge=true}
    if(edge)arr.push(l)}
  return arr;
}

/* ============ 5. Kuhn Poker 的 CFR（GTO 演示） ============ */
let kuhnInit=false;const KN={};let kUtil=0,kIter=0;
function kStrat(n){let s=[Math.max(n.r[0],0),Math.max(n.r[1],0)];const t=s[0]+s[1];return t>0?[s[0]/t,s[1]/t]:[.5,.5]}
function kcfr(cards,h,p0,p1){
  const pl=h.length%2,opp=1-pl;
  if(h.length>1){
    if(h[h.length-1]==='p'){return h==='pp'?(cards[pl]>cards[opp]?1:-1):1}
    if(h.slice(-2)==='bb')return cards[pl]>cards[opp]?2:-2;
  }
  const key=cards[pl]+h,n=KN[key]||(KN[key]={r:[0,0],s:[0,0]}),st=kStrat(n),u=[0,0];let nu=0;
  for(let a=0;a<2;a++){const nh=h+(a?'b':'p');u[a]=pl===0?-kcfr(cards,nh,p0*st[a],p1):-kcfr(cards,nh,p0,p1*st[a]);nu+=st[a]*u[a]}
  const pr=pl===0?p1:p0,me=pl===0?p0:p1;
  for(let a=0;a<2;a++){n.r[a]+=pr*(u[a]-nu);n.s[a]+=me*st[a]}
  return nu;
}
function kuhnTrain(N){
  for(let i=0;i<N;i++){kUtil+=kcfr(shuffled(3),'',1,1);kIter++}
  renderKuhn();
}
function kAvg(key,a){const n=KN[key];if(!n)return 0;const t=n.s[0]+n.s[1];return t?n.s[a]/t:0.5}
function renderKuhn(){
  const names=['J','Q','K'];
  const rows=[['','玩家 1 先行動：下注頻率',1],['p','玩家 1 先過牌，對手下注後：跟注頻率（pb）',1],['','',0]];
  const spec=[['','P1 首動 — 下注',1],['pb','P1 過牌後遇下注 — 跟注',1],['p','P2 對手過牌 — 下注',1],['b','P2 面對下注 — 跟注',1]];
  let h='';
  for(const [hist,desc] of spec){
    h+=`<tr><td>${desc}</td>`+[0,1,2].map(c=>`<td>${names[c]}: <b>${(kAvg(c+hist,1)*100).toFixed(1)}%</b></td>`).join('')+'</tr>';
  }
  $('t-kuhn').innerHTML=`<div class="panel"><h2>CFR 演示：Kuhn Poker（3 張牌的最小撲克）</h2>
  <div class="mut">反事實後悔最小化（Counterfactual Regret Minimization）是現代撲克 AI 的核心。這裡用它在瀏覽器內即時求解 Kuhn Poker，觀察平均策略如何收斂到納許均衡。</div>
  <p>已訓練 <b>${kIter.toLocaleString()}</b> 次 ｜ 玩家 1 平均收益 <b>${(kUtil/Math.max(kIter,1)).toFixed(4)}</b>（理論值 −1/18 ≈ −0.0556）</p>
  <button class="b" id="k1">再訓練 1 萬次</button><button class="b s" id="k2">重新訓練</button>
  <table class="t"><tr><th>資訊集</th><th>J</th><th>Q</th><th>K</th></tr>${h}</table>
  <div class="res"><b>理論均衡（參數 α ∈ [0, 1/3]）</b><br>
  P1：J 以 α 下注詐唬、Q 永遠過牌、K 以 3α 下注；P1 過牌後面對下注：J 棄牌、Q 以 α+1/3 跟注、K 跟注。<br>
  P2：過牌後 J 以 1/3 詐唬下注、Q 過牌、K 下注；面對下注：J 棄牌、Q 以 1/3 跟注、K 跟注。<br>
  你會看到 K 的下注頻率 ≈ 3 × J 的下注頻率，這正是「價值下注與詐唬維持固定比例」的 GTO 精神。</div></div>`;
  $('k1').onclick=()=>kuhnTrain(10000);
  $('k2').onclick=()=>{for(const k in KN)delete KN[k];kUtil=0;kIter=0;renderKuhn()};
}

function combineMap(old,nw){
  if(!nw||!nw.size)return old;if(!old)return nw;
  const m=new Map();for(const [l,f] of nw){const v=f*(old.get(l)||0);if(v>0)m.set(l,v)}
  return m.size?m:nw;
}
function rankCombos(rg,board){
  const dead=new Set(board);
  return rg.filter(x=>!dead.has(x.a)&&!dead.has(x.b)).map(x=>({a:x.a,b:x.b,w:x.w,s:eval7([x.a,x.b,...board])})).sort((p,q)=>q.s-p.s);
}
function narrowBet(rg,board,keep){
  const arr=rankCombos(rg,board),tot=arr.reduce((s,x)=>s+x.w,0);let acc=0;
  return arr.map(x=>{const top=acc<tot*keep;acc+=x.w;return {a:x.a,b:x.b,w:top?x.w:x.w*0.12}});
}
function narrowCall(rg,board){
  const arr=rankCombos(rg,board),tot=arr.reduce((s,x)=>s+x.w,0);let acc=0;
  return arr.map(x=>{const bottom=acc>=tot*0.7;acc+=x.w;return {a:x.a,b:x.b,w:bottom?x.w*0.15:x.w}});
}
function canRaise(i){
  const p=G.players[i],toCall=Math.min(G.curBet-p.bet,p.stack);

function pfAdvice(i){
  const sa=shortAdvice(i);if(sa)return sa;
  const p=G.players[i],l=handLabel(p.cards[0],p.cards[1]),pos=posName(i),r=G.pf.raises,pc=x=>Math.round(x*100)+'%';
  let acts,size=null,mR=null,mC=null,ctx='';
  if(r===0){
    if(pos==='BB'){acts={f:0,c:1,r:0};ctx='無人加注，大盲免費看牌'}
    else{const rg=rangeFor(pos,G.nAlive),f=rg.get(l)||0;acts={f:1-f,c:0,r:f};size=pos==='SB'?3:2.5;mR=rg;ctx=`${pos} 開池範圍`}
  }else{
    let sc;
    if(r===1){const op=posName(G.pf.opener);sc=FACE[FACEKEY[p6(pos)+'|'+p6(op)]]||(pos==='SB'?GEN.sb:GEN.g1);
      const ip=PRANK[pos]>PRANK[op];size=round2(G.curBet*(ip?3:4));ctx=`面對 ${op} 開池（${ip?'有位置約 3 倍':'沒位置約 4 倍'}）`}
    else if(r===2){sc=GEN.g2;size=round2(G.curBet*2.3);ctx='面對 3-bet'}
    else{sc=GEN.g3;size=999;ctx='面對 4-bet 以上'}
    const a=faceAct(sc,l);acts={f:a.f,c:a.c,r:a.r};const w=wmaps(sc);mR=w.mR;mC=w.mC;
  }
  const text=`${l}（${pos}）${ctx}：加注 ${pc(acts.r)} ／ 跟注${acts.c&&r===0?'（過牌）':''} ${pc(acts.c)} ／ 棄牌 ${pc(acts.f)}`+(size&&acts.r>0?`｜建議加注到 ${size>=999?'全下':size+'bb'}`:'');

  <tr><td>SB / BB</td><td>小盲 / 大盲</td><td>已投入盲注，但翻後最先行動（不利）</td></tr></table>
  <h3>可以做的動作</h3><ul><li><b>棄牌</b>：放棄這手牌。</li><li><b>過牌</b>：沒人下注時，不下注也不用付錢。</li><li><b>跟注</b>：付出和前面一樣的籌碼。</li><li><b>下注 / 加注</b>：主動增加底池。</li><li><b>全下</b>：把剩下的籌碼全部推入。</li></ul>`,
  quiz:[Q('6 人桌翻前，第一個行動的是哪個位置？',['小盲','大盲','UTG（最前位）','按鈕位'],2,'翻前由大盲左手邊的 UTG 先行動。'),
        Q('翻牌之後，誰最後行動、最有優勢？',['按鈕位（BTN）','小盲','UTG','大盲'],0,'翻牌後按鈕位在最後行動，能先看到所有人的動作再決定。'),
        Q('一手牌打到河牌，桌上共有幾張公共牌？',['3 張','4 張','5 張','7 張'],2,'翻牌 3 張 + 轉牌 1 張 + 河牌 1 張 = 5 張。')]},
 {id:'0.2',t:'牌型大小與比大小',prac:[['用勝率計算機看牌型','t-calc']],
  body:()=>{
    const rows=[['同花順','9h8h7h6h5h','同花色的五張連續牌'],['四條','KsKhKdKc2h','四張同點數'],['葫蘆','QsQhQd7c7h','三條加一對'],['同花','AdJd8d5d3d','五張同花色，不連續'],['順子','9s8h7d6c5h','五張連續，不同花色'],['三條','7s7h7dKc2h','三張同點數'],['兩對','JsJhTdTc4h','兩組對子'],['一對','AsAh9d6c2h','一組對子'],['高牌','AsJh9d6c3h','什麼都沒有，比最大的牌']];
    return `<p>由大到小共 9 種牌型：</p><table class="t"><tr><th>牌型</th><th>範例</th><th>說明</th></tr>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td><div class="cards">${ex(r[1])}</div></td><td>${r[2]}</td></tr>`).join('')}</table>
    <h3>幾個重點</h3><ul><li><b>A</b> 可當最大（A-K-Q-J-10）也可當最小（A-2-3-4-5，稱「輪子」，是最小的順子）。</li>
    <li>牌型相同時，先比組成牌型的點數，再比<b>踢腳牌</b>（剩下的最大牌）。例：A♠K♦ 對 A♥Q♦，公共牌有一張 A，兩人都是一對 A，K 的踢腳比 Q 大，所以前者贏。</li>
    <li>花色之間沒有大小；牌型與點數完全一樣時，<b>平分底池</b>。</li>
    <li>你的最佳牌是從 7 張（2 張底牌 + 5 張公共牌）挑出的 <b>5 張</b>，公共牌也可以全部用上。</li></ul>`},
  quiz:[G_('cmp'),G_('cmp'),Q('同花和順子哪個比較大？',['同花','順子','一樣大','要看點數'],0,'牌型排序：同花（第 4 大）大於順子（第 5 大）。')]},
 {id:'0.3',t:'底池、籌碼與 bb 單位',prac:[['用模擬比賽熟悉底池','t-sim']],
  body:()=>`<p>撲克裡的金額通常以<b>大盲（bb）</b>當單位，這樣不管賭注多大，策略都能互相比較。「100bb 深度」代表每人有 100 個大盲的籌碼，是本練習器採用的標準設定。</p>
  <h3>底池怎麼算？</h3><p>把所有人本手牌投入的籌碼加總。例：6 人桌，SB 0.5、BB 1。CO 開池加注到 2.5bb，BTN 跟注 2.5bb，其餘人棄牌（SB 與 BB 的盲注留在底池）。</p>
  <div class="res">底池 = 0.5 + 1 + 2.5 + 2.5 = <b>6.5bb</b></div>
  <h3>有效籌碼</h3><p>兩個人對戰時，真正會被輸贏的上限是兩人中<b>較短的那一個籌碼</b>，稱為有效籌碼。你有 100bb、對手只有 40bb，那有效籌碼就是 40bb。</p>`,
  quiz:[Q('SB 0.5、BB 1。CO 開到 2.5bb，BTN 跟注，SB 與 BB 棄牌。底池是多少？',['5bb','5.5bb','6.5bb','7bb'],2,'0.5（SB）+ 1（BB）+ 2.5（CO）+ 2.5（BTN）= 6.5bb。'),
        Q('為什麼撲克常用 bb 當單位？',['因為比較好看','不同賭注級別的策略能互相比較','規定要這樣','因為 bb 比較大'],1,'策略取決於籌碼相對盲注的比例，用 bb 表示就不受實際金額影響。'),
        Q('你有 100bb、對手只有 40bb，有效籌碼是多少？',['100bb','70bb','40bb','60bb'],2,'有效籌碼取兩人中較短的那一個，因為你最多只會輸贏到對手的籌碼。')]}
]},
{t:'翻前基礎',goal:'懂位置、起手牌強弱、開池範圍與尺碼',lessons:[
 {id:'1.1',t:'位置與範圍：為什麼越後面越寬？',prac:[['翻前範圍練習','t-pre'],['翻前教學','t-learn']],
  body:()=>{
    const rows=POS.map(p=>`<tr><td>${p}</td><td><b>${(expand(RM[p]).reduce((s,x)=>s+x.w,0)/1326*100).toFixed(0)}%</b></td></tr>`).join('');
    return `<p>「範圍」是指你在某個情境下會用哪些起手牌進池。位置越後面，開池範圍越寬，原因有二：</p>
    <ol><li><b>後面還沒行動的人少</b>：UTG 開池要面對後面 5 人，其中任何一個都可能有強牌；BTN 開池只剩兩個盲注位。</li>
    <li><b>翻後有位置優勢</b>：最後行動可以先看對手動作再決定，能多贏、少輸，所以同樣的牌在後位價值更高。</li></ol>
    <h3>本練習器的開池範圍（近似值）</h3><table class="t"><tr><th>位置</th><th>約佔所有起手牌</th></tr>${rows}</table>
    <div class="mut">範圍為常見圖表近似值，供建立直覺，不等同求解器輸出。</div>`},
  quiz:[Q('哪個位置的開池範圍最寬？',['UTG','HJ','CO','BTN'],3,'按鈕位後面只剩兩個盲注，翻後又有位置，所以範圍最寬。'),
        Q('為什麼 UTG 要收緊範圍？',['規則限制','後面還有很多人沒行動，且翻後常沒位置','因為籌碼比較少','因為牌比較小'],1,'後面人多，遇到強牌的機率高；翻後也較難有位置優勢。'),
        Q('「位置優勢」最主要的好處是？',['可以看底牌','能先看到對手的動作再決定','可以多拿一張牌','可以不用付盲注'],1,'最後行動能取得更多資訊，決策更準確。')]},
 {id:'1.2',t:'起手牌分類與強弱',prac:[['翻前範圍練習','t-pre']],
  body:()=>`<p>兩張底牌共有 1326 種組合，但依點數與是否同花，可分為 <b>169 種起手牌</b>：</p>
  <table class="t"><tr><th>類型</th><th>例子</th><th>組合數</th></tr><tr><td>對子</td><td>AA</td><td>6 種</td></tr><tr><td>同花（s）</td><td>AKs</td><td>4 種</td></tr><tr><td>不同花（o）</td><td>AKo</td><td>12 種</td></tr></table>
  <h3>牌力因素</h3><ul><li><b>高牌與對子</b>：直接的勝率來源。</li><li><b>同花</b>：比不同花的同點數牌勝率高約 2–3 個百分點，且能成同花。</li>
  <li><b>連張</b>（如 JTs、87s）：能組順子，翻後「可玩性」高，適合在後位開池。</li>
  <li><b>被支配</b>：K9o 對 KQo，雙方都有 K，但你的 9 比對手的 Q 小，贏的時候少、輸的時候多。所以雜牌的高牌（如 K9o、QTo）在前位常被棄掉。</li></ul>
  <h3>阻擋牌（blocker）</h3><p>手上持有 A，就讓對手更少機會有 AA 或 AK。A5s 因此常被當作詐唬牌：有 A 的阻擋效果，還能成同花與輪子順子。</p>`,
  quiz:[Q('AKs 有幾種組合？',['12','6','4','16'],2,'同花有 4 種花色，所以 AKs 是 4 種；AKo 才是 12 種。'),
        Q('K9o 為什麼比 KQo 差？',['K9o 是同花','K9o 容易被 KQ 之類的牌「支配」','K9o 沒有 K','沒有差別'],1,'同樣有 K 時，對手的踢腳（Q）比你的 9 大，你贏的機率低。'),
        Q('同點數的牌，同花比不同花大概多幾個百分點的勝率？',['0','約 2–3','約 10','約 20'],1,'同花多了成同花的機會，大約多 2–3 個百分點。')]},
 {id:'1.3',t:'開池尺碼與偷盲數學',prac:[['翻前範圍練習','t-pre']],
  body:()=>`<p>第一個進池的人通常<b>加注</b>，而不是只跟盲注（limp）。標準尺碼（100bb）：</p><ul><li>UTG～BTN：<b>2.2–2.5bb</b></li><li>SB：<b>約 3bb</b>（沒位置，加大一點）</li></ul>
  <h3>為什麼 limp 不好？</h3><p>limp 讓後面的人便宜進池，你也失去了「對手棄牌就直接贏」的機會，翻後又常沒位置。</p>
  <h3>偷盲數學</h3><p>你在 BTN 加注到 2.5bb，想贏走底池裡的盲注 1.5bb（SB 0.5 + BB 1）。冒著 2.5bb 的風險贏 1.5bb，<b>只要對手棄牌的機率超過 2.5 ÷ 4 = 62.5%</b>，光靠偷盲就不虧；即使被跟注，你的牌還有勝率和位置優勢可以補。</p>
  <div class="mut">此計算忽略被跟注後的勝率，因此是保守估計。</div>`,
  quiz:[G_('rfi'),G_('rfi'),Q('BTN 加注到 2.5bb，想偷 1.5bb 的盲注。光靠棄牌，對手需棄牌多少才不虧？',['約 40%','約 50%','約 62.5%','約 80%'],2,'風險 2.5、獲利 1.5，打平的棄牌率 = 2.5 ÷ (2.5 + 1.5) = 62.5%。')]}
]},
{t:'機率與賠率',goal:'會數 outs、用口訣估算、算出所需勝率',lessons:[
 {id:'2.1',t:'Outs 與 2/4 口訣',prac:[['勝率預測練習','t-eq']],
  body:()=>`<p><b>Outs</b> 是指能讓你的牌變成「大概率最好牌」的剩餘牌張數。</p>
  <table class="t"><tr><th>聽牌</th><th>Outs</th></tr><tr><td>同花聽牌（差 1 張同花）</td><td>9</td></tr><tr><td>兩頭順子聽牌（OESD）</td><td>8</td></tr><tr><td>卡順（gutshot）</td><td>4</td></tr><tr><td>兩張高牌想配對（over cards）</td><td>6</td></tr><tr><td>同花 + 兩頭順子（強聽牌）</td><td>約 15</td></tr></table>
  <h3>2 與 4 口訣</h3><ul><li><b>翻牌</b>（還有兩張牌）：補中機率 ≈ outs × <b>4</b>%</li><li><b>轉牌</b>（只剩一張）：補中機率 ≈ outs × <b>2</b>%</li></ul>
  <p>例：翻牌同花聽牌 9 outs → 約 36%（精確約 35%）。轉牌 9 outs → 約 18%（精確約 19.6%）。Outs 很多（超過 8）時，×4 會略高估，可再減幾個百分點。</p>
  <div class="mut">outs 也要小心：有些 outs 補中後，仍可能輸給對手更強的牌。</div>`,
  quiz:[Q('同花聽牌（差 1 張成同花）有幾張 outs？',['4','6','8','9'],3,'每種花色 13 張，扣掉你和公共牌已看到的 4 張，剩 9 張。'),
        Q('翻牌拿到兩頭順子聽牌（8 outs），到河牌補中的機率約為？',['16%','約 32%','約 50%','約 8%'],1,'翻牌用 ×4 口訣：8 × 4 = 32%。'),
        Q('轉牌卡順（4 outs），下一張補中的機率約為？',['4%','8%','16%','32%'],1,'轉牌用 ×2 口訣：4 × 2 = 8%（精確約 8.7%）。')]},
 {id:'2.2',t:'底池賠率與所需勝率',prac:[['底池賠率練習','t-pot']],
  body:()=>`<p>面對下注時，你只付出「跟注額」就有機會贏走「底池 + 對方下注 + 你的跟注」。要不虧錢，你的勝率至少要達到：</p>
  <div class="res"><b>所需勝率 = 跟注額 ÷（底池 + 對方下注 + 跟注額）</b></div>
  <p>例：底池 10bb，對手下注 5bb。你要付 5bb，贏的總額是 10 + 5 + 5 = 20bb，所需勝率 = 5 ÷ 20 = <b>25%</b>。</p>
  <h3>常見尺碼速查</h3><table class="t"><tr><th>對手下注</th><th>所需勝率</th></tr><tr><td>1/3 底池</td><td>20%</td></tr><tr><td>1/2 底池</td><td>25%</td></tr><tr><td>2/3 底池</td><td>28.6%</td></tr><tr><td>3/4 底池</td><td>30%</td></tr><tr><td>滿池</td><td>33%</td></tr><tr><td>2 倍底池</td><td>40%</td></tr></table>
  <p>比較你的勝率（或補中機率）和所需勝率：高於它就能跟，低於它就該棄牌（先不考慮隱含賠率）。</p>`,
  quiz:[G_('need'),G_('need'),G_('need')]},
 {id:'2.3',t:'最低防守頻率與詐唬比例',prac:[['底池賠率練習','t-pot'],['CFR 演示','t-kuhn']],
  body:()=>`<p>如果你面對下注卻棄牌太多，對手可以用任何牌下注都賺錢。為了讓對手無法無腦詐唬，你需要「守住」一定比例的牌：</p>
  <div class="res"><b>最低防守頻率（MDF）= 底池 ÷（底池 + 下注）</b></div>
  <p>對手下注 1/2 底池 → MDF = 1 ÷ 1.5 ≈ <b>67%</b>；下注滿池 → MDF = <b>50%</b>。</p>
  <h3>下注方的「平衡詐唬比例」</h3><p>為了讓你跟注或棄牌都無差別，下注方的詐唬牌佔下注範圍的比例是：<b>下注 ÷（底池 + 2×下注）</b>。1/2 底池下注 → 25% 詐唬、75% 價值；滿池下注 → 33% 詐唬、67% 價值（價值：詐唬 = 2 : 1）。</p>
  <div class="mut">這是理論上的均衡概念，實戰中要依對手的傾向調整（第 6 級會學）。</div>`,
  quiz:[Q('底池 100bb，對手下注 100bb（滿池）。你的最低防守頻率約為？',['25%','33%','50%','67%'],2,'MDF = 100 ÷ (100 + 100) = 50%。'),
        Q('對手下注 1/3 底池，你的最低防守頻率約為？',['50%','67%','75%','90%'],2,'MDF = 1 ÷ (1 + 1/3) = 75%。'),
        Q('下注 1/2 底池時，平衡的詐唬牌約佔下注範圍的比例是？',['10%','25%','33%','50%'],1,'0.5 ÷ (1 + 2×0.5) = 25%。')]},
 {id:'2.4',t:'隱含賠率與實現率',prac:[['勝率預測練習','t-eq']],
  body:()=>`<p>前面的所需勝率只看「目前」的底池。但如果你補中後，還能從對手身上贏<b>更多</b>錢，就多了<b>隱含賠率</b>，實際上可以跟得更寬。</p>
  <h3>隱含賠率高的情境</h3><ul><li>籌碼很深（後面還有很多錢可以贏）。</li><li>你補中的牌很隱蔽（例如暗三條、同花聽牌補中但牌面不明顯）。</li><li>對手是愛付錢的類型（跟注站）。</li></ul>
  <h3>反隱含賠率</h3><p>如果你補中仍可能輸給更大的牌（例如較小的同花輸給較大的同花），就要打折扣。</p>
  <h3>實現率</h3><p>勝率是「打到河牌的理論勝率」，但實際上你會被逼棄牌或沒位置被壓制，無法完整「實現」。<b>在位置上、籌碼深的牌</b>實現率高；<b>沒位置的雜牌</b>實現率低，所以同樣的勝率，沒位置要更保守。</p>`,
  quiz:[Q('下列哪個情況隱含賠率最高？',['籌碼很淺','對手不會再付錢','籌碼深且補中的牌很隱蔽','牌面很危險'],2,'籌碼深、牌隱蔽，補中後能贏到更多。'),
        Q('「實現率」較低的是哪種情況？',['有位置、手牌連張同花','沒位置、手牌雜牌','按鈕位拿對子','籌碼很深的同花連張'],1,'沒位置的雜牌容易被逼棄牌，無法完整實現勝率。'),
        Q('決定要不要跟注時，除了所需勝率，還應考慮哪些因素？',['只需看底池大小','隱含賠率、位置、對手類型','只看手牌好壞','不需要考慮'],1,'隱含賠率、位置與對手類型都會影響實際期望值。')]}
]},
{t:'面對加注',goal:'會 3-bet、跟注、BB 防守，並懂得阻擋牌',lessons:[
 {id:'3.1',t:'3-bet：價值牌與詐唬牌',prac:[['面對加注練習','t-learn']],
  body:()=>`<p>有人開池後再加注，叫做 <b>3-bet</b>（大盲算第一次下注，開池是 2-bet）。</p>
  <h3>價值 3-bet</h3><p>用強牌加注，希望被較弱的牌跟注：QQ+、AK 為主。</p>
  <h3>詐唬 3-bet</h3><p>用有潛力但不夠強的牌加注，讓範圍有詐唬牌，對手不能只在你加注時棄牌就無腦打：</p>
  <ul><li><b>A5s、A4s</b>：有 A 的阻擋效果（對手更少有 AA、AK），又有同花與輪子順子的潛力。</li><li>少數同花連張（如 76s）。</li></ul>
  <h3>尺碼</h3><p>有位置約開池的 <b>3 倍</b>；沒位置（SB/BB）約 <b>4 倍</b>，因為翻後沒位置要多收錢。例：BTN 開 2.5bb，BB 3-bet 到約 10bb。</p>`,
  quiz:[Q('下列哪手牌最適合當「詐唬 3-bet」？',['QQ','AKo','A5s','JJ'],2,'A5s 有阻擋效果且有同花、順子潛力，被跟注時也還有勝率。'),
        Q('BTN 開 2.5bb，BB 想 3-bet，常見尺碼約為？',['約 5bb','約 7bb','約 10–11bb','約 30bb'],2,'沒位置約 4 倍開池：2.5 × 4 = 10bb。'),
        Q('為什麼要在 3-bet 範圍中放詐唬牌？',['為了好玩','讓對手不能只靠棄牌就輕易應付你的加注','因為規則要求','讓底池變小'],1,'平衡的範圍讓對手對你的加注難以調整。')]},
 {id:'3.2',t:'跟注還是 3-bet？',prac:[['面對加注練習','t-learn']],
  body:()=>`<p>面對加注時有三個選擇：棄牌、跟注、3-bet。</p>
  <ul><li><b>強牌</b>（QQ+、AK）：3-bet 為主，偶爾跟注。</li><li><b>中等牌</b>（77–TT、AQ、KQs、同花連張）：<b>跟注</b>為主。這些牌常有不錯的勝率，但被 4-bet 時不好辦，所以不一定要 3-bet。</li><li><b>弱牌</b>：棄牌，或偶爾拿來當詐唬 3-bet。</li></ul>
  <h3>位置的影響</h3><ul><li><b>有位置</b>（BTN 面對 CO）：可以跟注更多牌，因為翻後有優勢。</li><li><b>沒位置</b>（SB 面對 BTN）：跟注的實現率差，而且後面還有 BB，所以傾向「3-bet 或棄牌」，很少只跟注。</li></ul>`,
  quiz:[Q('在 BTN 面對 CO 的開池加注，77 通常怎麼打？',['必定 3-bet','主要以跟注為主','必定棄牌','全下'],1,'中等對子在有位置時，跟注看翻牌的價值很高。'),
        Q('SB 面對 BTN 的開池，為什麼很少只跟注？',['規則不允許','沒位置、後面還有 BB，跟注實現率差','SB 籌碼太少','SB 手牌比較好'],1,'沒位置又有 BB 在後，傾向 3-bet 或棄牌。'),
        Q('強牌（如 QQ、AK）面對開池，主要做法是？',['3-bet','必定棄牌','過牌','每次都只跟注'],0,'強牌 3-bet 取價值，是標準打法。')]},
 {id:'3.3',t:'BB 防守與底池賠率',prac:[['面對加注練習','t-learn']],
  body:()=>`<p>大盲已經投入了 1bb，面對開池時價格最便宜，所以防守範圍是所有位置中最寬的。</p>
  <h3>算算看：BB 面對 BTN 開 2.5bb</h3><ul><li>底池 = 2.5（BTN）+ 1（你的 BB）+ 0.5（SB）= <b>4bb</b></li><li>你只需再付 <b>1.5bb</b></li><li>所需勝率 = 1.5 ÷ (4 + 1.5) ≈ <b>27%</b></li></ul>
  <p>27% 的勝率門檻很低，大多數牌都達得到，所以 BB 對 BTN 可以防守 <b>45–55%</b> 左右的牌（本練習器為簡化近似）。</p>
  <h3>對不同位置的調整</h3><p>對手位置越前，開池範圍越緊、越強，你的防守範圍也要隨之收緊：BB 對 UTG 防守的牌明顯少於對 BTN。</p>
  <div class="mut">實際上還要考慮翻後沒位置的實現率，所以不會 100% 防守所有達標的牌。</div>`,
  quiz:[Q('BB 面對 BTN 開 2.5bb（SB 已投 0.5），你跟注的所需勝率約為？',['約 15%','約 27%','約 40%','約 50%'],1,'1.5 ÷ (4 + 1.5) ≈ 27%。'),
        Q('BB 防守範圍通常比其他位置面對開池時如何？',['更窄','一樣','更寬','不能防守'],2,'已投入 1bb，價格最便宜，防守最寬。'),
        Q('BB 面對 UTG 的開池，防守範圍會比面對 BTN 時？',['更寬','更窄','完全相同','不需要考慮'],1,'UTG 的範圍較強，所以要收緊。')]}
]},
{t:'翻後基礎',goal:'學會持續下注、價值下注、聽牌打法與牌面判讀',lessons:[
 {id:'4.1',t:'牌面結構與範圍優勢',prac:[['模擬比賽（從翻牌開始）','t-sim']],
  body:()=>`<h3>牌面分類</h3><ul><li><b>乾燥牌面</b>（如 K♠7♦2♣）：不連張、不同花，牌力不容易改變。</li><li><b>濕潤牌面</b>（如 J♥T♥9♣）：連張、同花聽牌多，牌力容易翻轉。</li><li><b>配對牌面</b>（如 8♠8♦3♣）：有人可能有三條。</li></ul>
  <h3>範圍優勢</h3><p>翻前加注的人，範圍裡有較多 AA、KK、AK 這類強牌，所以在 <b>A、K 高的牌面</b>通常有<b>範圍優勢</b>；而跟注者的範圍有較多中低連張，在<b>低連牌面</b>反而不吃虧。</p>
  <ul><li>有範圍優勢 → 可以<b>高頻率、小尺碼</b>下注。</li><li>沒有範圍優勢 → 多<b>過牌</b>，只用強牌和好聽牌下注。</li></ul>`,
  quiz:[Q('J♥T♥9♣ 屬於哪種牌面？',['乾燥','濕潤（聽牌多）','配對','很安全'],1,'連張、同花聽牌多，牌力容易翻轉。'),
        Q('翻前加注者在 A♠7♦2♣ 這種牌面通常？',['沒有範圍優勢','有範圍優勢，可高頻小注','必定過牌','不能下注'],1,'加注者範圍內有較多 A 與強牌，通常有範圍優勢。'),
        Q('沒有範圍優勢時，比較合理的做法是？',['每次都大注','多過牌，只用強牌與好聽牌下注','全部棄牌','只跟注'],1,'範圍較弱時，要用更少、更有選擇的牌下注。')]},
 {id:'4.2',t:'持續下注（c-bet）',prac:[['模擬比賽（從翻牌開始）','t-sim']],
  body:()=>`<p><b>持續下注（continuation bet, c-bet）</b>是指翻前加注者，在翻牌圈繼續下注。因為你翻前展示了強度，對手多半沒中，所以常能直接贏下底池。</p>
  <h3>基本原則</h3><ul><li><b>乾燥牌面</b>：小尺碼（約 1/3 底池）、高頻率。</li><li><b>濕潤牌面</b>：尺碼較大、頻率較低，用強牌與好聽牌下注，其他多過牌。</li><li><b>多人底池</b>：少 c-bet，因為有人中牌的機率更高。</li><li><b>有位置</b>時 c-bet 的選擇更彈性，沒位置時更需謹慎。</li></ul>
  <h3>檢查：值不值得下注？</h3><p>問自己：我是想讓更差的牌付錢（價值）、想讓更好的牌棄牌（詐唬），還是想保護自己的牌不被免費補牌？三個都不是，就先過牌。</p>`,
  quiz:[Q('在乾燥牌面（K♠7♦2♣）上，翻前加注者常用的 c-bet 是？',['極少下注','高頻率、小尺碼','每次都全下','只用最強牌'],1,'乾燥牌面範圍優勢明顯，小注就能獲利。'),
        Q('多人底池中，c-bet 頻率通常會？',['提高','降低','不變','改成全下'],1,'人越多，有人中牌的機率越高，詐唬成功率低。'),
        Q('下注前，應該先問自己的問題是？',['對手會不會生氣','下注是為了價值、詐唬，還是保護','我是不是很無聊','今天幸不幸運'],1,'每個下注都應有目的：價值、詐唬或保護。')]},
 {id:'4.3',t:'價值下注與尺碼',prac:[['模擬比賽（從翻牌開始）','t-sim']],
  body:()=>`<p><b>價值下注</b>是指拿著好牌下注，希望被<b>更差的牌</b>跟注。</p>
  <h3>選尺碼的核心問題</h3><p>「我能下注多大，而仍然會被更差的牌跟注？」尺碼太大，只有比你強的牌會跟；太小，則錯失價值。</p>
  <ul><li><b>薄價值</b>：頂對好踢腳、中對等，在乾燥牌面河牌下小注（約 1/3–1/2 底池）。</li><li><b>強牌</b>：在濕潤牌面要下大一點，同時避免讓對手便宜看到聽牌。</li><li><b>河牌極化範圍</b>：只剩堅果牌與詐唬牌時，可用大注（滿池以上）。</li></ul>
  <h3>不要自己嚇自己</h3><p>很多新手拿到不錯的牌卻過牌，怕被加注。如果有大量更差的牌會跟你，你下注就是在<b>少賺錢</b>的反面——過牌才是錯失價值。</p>`,
  quiz:[Q('價值下注的目的是？',['讓對手棄牌','讓更差的牌跟注','純粹嚇人','增加變異'],1,'價值下注就是要讓較差的牌付錢。'),
        Q('河牌圈你有頂對好踢腳、牌面乾燥，常見的做法是？',['必定過牌','小到中尺碼薄價值下注','全下','棄牌'],1,'乾燥牌面頂對常能被更差的對子跟注，值得下注。'),
        Q('選價值下注尺碼時，最關鍵的問題是？',['對手長相','最大尺碼下仍會被更差牌跟注','今天有多少籌碼','隨機'],1,'尺碼要讓更差的牌仍願意跟。')]},
 {id:'4.4',t:'聽牌與半詐唬',prac:[['模擬比賽（從翻牌開始）','t-sim']],
  body:()=>`<p><b>半詐唬</b>：用還沒成牌的聽牌下注或加注。它有兩種獲利來源：</p>
  <ol><li><b>棄牌收益</b>：對手棄牌，你直接贏池。</li><li><b>補牌收益</b>：被跟注時，你還有機會補中。</li></ol>
  <h3>什麼聽牌適合半詐唬？</h3><ul><li><b>強聽牌</b>（同花 + 順子，約 12–15 outs）：常常直接加注，因為勝率接近領先牌。</li><li><b>普通聽牌</b>（單純同花聽牌、兩頭順子）：可以下注，也可以過牌跟注。</li><li><b>弱聽牌</b>（卡順）：多半只在對手容易棄牌時才當詐唬。</li></ul>
  <p>另外 <b>有阻擋牌</b>（如手握 A、讓對手更少有堅果）的聽牌更適合當詐唬。</p>`,
  quiz:[Q('半詐唬有哪兩種獲利來源？',['棄牌收益與補牌收益','只有棄牌收益','只有補牌收益','都沒有'],0,'對手棄牌直接贏，被跟注也有機會補中。'),
        Q('同花 + 順子的強聽牌（約 15 outs）通常適合？',['直接棄牌','常常加注（強半詐唬）','永遠過牌','只能跟注'],1,'勝率接近領先牌，加注能同時獲得棄牌收益與補牌收益。'),
        Q('下列哪種聽牌最不適合當半詐唬？',['同花聽牌','兩頭順子聽牌','卡順（4 outs）','同花加順子聽牌'],2,'卡順只有 4 outs，補中機率低，半詐唬的價值也低。')]}
]},
{t:'GTO 核心概念',goal:'理解均衡、混合策略與詐唬價值比，並能入門閱讀論文',lessons:[
 {id:'5.1',t:'什麼是 GTO？',prac:[['CFR 演示','t-kuhn']],
  body:()=>`<p>GTO（Game Theory Optimal，博弈論最佳）的核心是<b>納許均衡</b>：任何一方單獨改變策略，都不會獲得更多收益。換句話說，GTO 策略是「<b>無法被剝削</b>」的。</p>
  <h3>用剪刀石頭布理解</h3><p>最佳策略是三種各 1/3 隨機出。你不能預測，對手也無法針對你。但注意：如果對手只出石頭，GTO 的 1/3 隨機<b>不會</b>贏最多；剝削對手（一直出布）才賺得最多。</p>
  <h3>GTO ≠ 最賺錢</h3><ul><li>GTO：保證不會輸給任何對手（理想上）。</li><li>剝削：針對對手的弱點調整，贏得更多，但也讓自己有被反剝削的風險。</li></ul>
  <p>實戰的建議：<b>以 GTO 當基準，遇到明顯弱點時再偏離</b>。</p>`,
  quiz:[Q('GTO 策略的核心特性是？',['永遠贏最多','無法被剝削','永遠詐唬','只打強牌'],1,'均衡策略讓對手無法透過調整來獲利。'),
        Q('對手明顯一直出石頭時，最賺的做法是？',['堅持 1/3 隨機','一直出布（剝削）','隨便','換遊戲'],1,'剝削能贏得比均衡更多。'),
        Q('實戰建議的使用方式是？',['完全照 GTO，不調整','以 GTO 為基準，遇到明顯弱點再偏離','完全不管 GTO','只看對手長相'],1,'基準加調整，兼顧穩定與獲利。')]},
 {id:'5.2',t:'混合策略與詐唬價值比',prac:[['CFR 演示','t-kuhn']],
  body:()=>`<p>在均衡裡，同一手牌常常「有時加注、有時過牌」，這叫<b>混合策略</b>。原因是：如果你每次都做一樣的事，對手就能針對你調整。</p>
  <h3>無差異</h3><p>均衡的目標是讓對手對「跟注或棄牌」感覺<b>無差異</b>：不管選哪個，期望值都一樣。要做到這點，你的下注範圍要有固定比例的價值牌和詐唬牌：</p>
  <table class="t"><tr><th>下注尺碼</th><th>詐唬佔比</th><th>價值 : 詐唬</th></tr><tr><td>1/3 底池</td><td>20%</td><td>4 : 1</td></tr><tr><td>1/2 底池</td><td>25%</td><td>3 : 1</td></tr><tr><td>滿池</td><td>33%</td><td>2 : 1</td></tr></table>
  <h3>去「CFR 演示」看看</h3><p>在 Kuhn Poker 的訓練結果裡，你會看到：持最強牌 K 的下注頻率，約是持最弱牌 J 的 <b>3 倍</b>——這正是價值牌與詐唬牌維持固定比例的體現。</p>`,
  quiz:[Q('為什麼均衡策略常要「混合」？',['為了好看','讓對手無法針對你調整','因為規則','因為計算機壞掉'],1,'固定的策略會被對手利用。'),
        Q('用滿池下注時，均衡的價值牌與詐唬牌比例約為？',['1 : 1','2 : 1','4 : 1','10 : 1'],1,'滿池時詐唬佔 33%，所以價值 : 詐唬 = 2 : 1。'),
        Q('「無差異」是指？',['對手不在乎','對手面對下注，跟注或棄牌的期望值相同','你不在乎輸贏','兩人籌碼相同'],1,'均衡中，對手的跟注與棄牌期望值相等。')]},
 {id:'5.3',t:'求解器與論文入門',prac:[['論文索引','t-paper']],
  body:()=>`<p>現代撲克 AI 的核心方法是<b>反事實後悔最小化（CFR）</b>：讓程式自我對弈無數次，每次回頭檢討「如果當時換個動作會更好嗎」，並逐漸逼近均衡。</p>
  <h3>求解器輸出怎麼讀？</h3><ul><li><b>頻率</b>：每個動作被選擇的比例（如加注 40%、過牌 60%）。</li><li><b>EV</b>：期望值，通常以 bb 計。</li><li><b>勝率（equity）</b>：對對手範圍的理論勝率。</li></ul>
  <h3>求解器的限制</h3><ul><li>為了能算出結果，會<b>簡化</b>：只允許少數幾種下注尺碼、把類似的牌歸類。</li><li>假設對手也打得完美，面對真人時未必是最佳策略。</li><li>輸出是「平均」策略，不要硬背單一結果，要找出<b>規律與原因</b>。</li></ul>
  <h3>怎麼開始讀論文？</h3><p>先看摘要、圖表與結論，確認論文要解決什麼問題。本練習器的「論文索引」分頁整理了近五年的相關論文，可以從綜述與 CFR 新演算法開始。</p>`,
  quiz:[Q('CFR 的基本精神是？',['隨機亂打','自我對弈並檢討「換個動作會不會更好」','只看牌的大小','永遠詐唬'],1,'CFR 透過反覆自我對弈與後悔值更新逼近均衡。'),
        Q('求解器輸出常見是什麼形式？',['每個動作的頻率與 EV','固定的單一動作','只有輸贏','影片'],0,'輸出是各動作的頻率與期望值。'),
        Q('使用求解器結果時，下列何者較正確？',['完全照抄就好','要找出背後規律，並了解簡化與限制','不需要看','只看一次結果'],1,'求解器有簡化與假設，理解原因比背結果更重要。')]}
]},
{t:'進階與剝削',goal:'會讀 HUD、依對手風格調整，並處理多人底池與籌碼深度',lessons:[
 {id:'6.1',t:'HUD 指標入門',prac:[['模擬比賽（顯示對手風格）','t-sim']],
  body:()=>`<p>HUD（抬頭顯示）是用統計數字推測對手風格。常看三個：</p>
  <table class="t"><tr><th>指標</th><th>意思</th></tr><tr><td><b>V（VPIP）</b></td><td>自願入池率：有多少比例的手牌會主動投錢（跟注或加注）</td></tr><tr><td><b>P（PFR）</b></td><td>翻前加注率</td></tr><tr><td><b>AF</b></td><td>翻後攻擊係數：（下注 + 加注次數）÷ 跟注次數</td></tr></table>
  <h3>經驗法則（6 人桌，僅供參考）</h3><ul><li><b>緊兇</b>：V 約 15–20，P 約 12–18，AF 高。</li><li><b>鬆兇</b>：V 28 以上，P 約 22 以上，AF 高。</li><li><b>跟注站</b>：V 高（30 以上），P 低（10 以下），AF 低（1 以下）。</li></ul>
  <div class="mut">樣本太少時數字會很不準，至少觀察約 20–30 手以上再下判斷。</div>`,
  quiz:[Q('V（VPIP）代表什麼？',['翻後下注率','自願入池率','全下率','棄牌率'],1,'VPIP = 自願投入籌碼進池的手牌比例。'),
        Q('V 很高、P 很低、AF 很低，最可能是哪種對手？',['緊兇','鬆兇','跟注站','標準玩家'],2,'常入池但很少加注、翻後也被動，是典型的跟注站。'),
        Q('為什麼看 HUD 要有足夠的觀察手數？',['沒關係','樣本太少，數字會嚴重誤導','規定','螢幕比較大'],1,'短期隨機波動很大，要有足夠樣本才可靠。')]},
 {id:'6.2',t:'依對手類型調整',prac:[['模擬比賽（顯示對手風格）','t-sim']],

const POS_NOTE={
  UTG:'最前位：後面還有 5 人未行動，範圍最緊；翻後多半沒有位置。',
  HJ:'中位：範圍略寬於 UTG。',
  CO:'按鈕前一位：範圍偏寬，常用來偷盲；翻後只輸給按鈕位。',
  BTN:'按鈕位（莊位）：翻後最後行動，位置優勢最大，開池範圍最寬。',
  SB:'小盲：已投 0.5bb，但翻後最先行動（最不利），面對開池傾向 3-bet 或棄牌。',
  BB:'大盲：已投 1bb，面對開池價格最便宜，防守範圍最寬；但翻後沒有位置。'
};
function eqMulti(hands,board,iters){
  const used=new Set(board);hands.forEach(h=>h.forEach(c=>used.add(c)));
  const base=[];for(let c=0;c<52;c++)if(!used.has(c))base.push(c);
  const need=5-board.length,res=hands.map(()=>0);
  for(let i=0;i<iters;i++){
    const d=base.slice(),bd=board.slice();
    for(let k=0;k<need;k++){const j=k+((Math.random()*(d.length-k))|0);const t=d[k];d[k]=d[j];d[j]=t;bd.push(d[k])}
    let best=-1,w=[];
    hands.forEach((h,x)=>{const sc=eval7([...h,...bd]);if(sc>best){best=sc;w=[x]}else if(sc===best)w.push(x)});
    w.forEach(x=>{res[x]+=1/w.length});
  }
  return res.map(r=>r/iters);
}
function buildReview(){
  const pl=G.players.map((p,k)=>({k,n:p.name,pos:posName(k),cards:p.cards.slice(),fold:p.folded,style:k?SIM.styles[k]:null,
    acts:(G.rec[k]||[]).map(a=>({s:a.s,cat:a.cat,ok:a.ok,text:a.text}))}));
  const eq={};
  for(const s of [0,1,2,3]){
    const idx=G.seen[s>0?s:1];if(!idx||idx.length<2)continue;
    const board=G.full.slice(0,[0,3,4,5][s]);
    eq[s]={idx:idx.slice(),v:eqMulti(idx.map(k=>G.players[k].cards),board,1500)};
  }
  return {pl,eq};
}

// ---- ICM（Malmuth–Harville）----
function icmEq(stacks,payouts){
  const ids=[];stacks.forEach((s,i)=>{if(s>1e-9)ids.push(i)});
  const n=ids.length,res=stacks.map(()=>0);if(!n)return res;
  const s=ids.map(i=>stacks[i]),P=[];for(let k=0;k<n;k++)P.push(payouts[k]||0);
  let paid=0;P.forEach((x,k)=>{if(x>0)paid=k+1});
  const memo=new Map();
  function f(mask,place){
    if(mask===0||place>=paid)return new Array(n).fill(0);
    const key=mask*16+place;if(memo.has(key))return memo.get(key);
    let tot=0;for(let i=0;i<n;i++)if(mask&(1<<i))tot+=s[i];
    const out=new Array(n).fill(0);
    for(let i=0;i<n;i++)if(mask&(1<<i)){
      const p=s[i]/tot;out[i]+=p*P[place];
      const sub=f(mask&~(1<<i),place+1);for(let j=0;j<n;j++)out[j]+=p*sub[j];
    }
    memo.set(key,out);return out;
  }
  const r=f((1<<n)-1,0);ids.forEach((id,k)=>{res[id]=r[k]});return res;
}
// 純函式：你（i）跟注對手（j）全下的 ICM 所需勝率。dead＝其他人留在底池的死錢。
function icmCall(base,i,j,pay,dead){
  const hero=base[i],vil=base[j],E=Math.min(hero,vil);
  const eNow=icmEq(base,pay)[i];
  const w=base.slice();w[i]=hero+E+dead;w[j]=vil-E;
  const l=base.slice();l[i]=hero-E;l[j]=vil+E+dead;
  const eW=icmEq(w,pay)[i],eL=icmEq(l,pay)[i];
  const need=eW-eL>1e-9?(eNow-eL)/(eW-eL):0.5;
  return {need:Math.max(0,Math.min(1,need)),bf:eW-eNow>1e-9?(eNow-eL)/(eW-eNow):1,eNow,eW,eL,chipNeed:E/(2*E+dead)};
}
function icmNeed(i,j){
  const P=G.players,base=P.map(q=>q.dead?0:(q.folded?q.stack:q.stack+q.bet));
  let dead=0;P.forEach((q,k)=>{if(k!==i&&k!==j&&q.folded&&!q.dead)dead+=q.total});
  return icmCall(base,i,j,TN.payouts,dead);
}

// ---- 手牌強弱排序（Chen 公式近似）與全下範圍 ----
function chen(l){
  const r1=RANKS.indexOf(l[0]),r2=RANKS.indexOf(l[1]),hi=Math.max(r1,r2),lo=Math.min(r1,r2),suited=l[2]==='s',pair=l.length===2;
  const pts=r=>r===12?10:r===11?8:r===10?7:r===9?6:(r+2)/2;
  let s=pts(hi);
  if(pair)return Math.ceil(Math.max(5,s*2))+hi*0.01;
  if(suited)s+=2;
  const gap=hi-lo-1;s-=gap===0?0:gap===1?1:gap===2?2:gap===3?4:5;
  if(gap<=1&&hi<10)s+=1;
  return Math.ceil(s)+hi*0.01+lo*0.001+(suited?0.0005:0);
}
let HAND_ORD=null;const PCT_CACHE={};
function handOrder(){if(!HAND_ORD)HAND_ORD=[...ALLMAP.keys()].sort((a,b)=>chen(b)-chen(a));return HAND_ORD}
const lcount=l=>l.length===2?6:l[2]==='s'?4:12;
function pctMap(pct){
  const key=Math.max(1,Math.min(100,Math.round(pct)));if(PCT_CACHE[key])return PCT_CACHE[key];
  const m=new Map(),target=key/100*1326;let cum=0;
  for(const l of handOrder()){if(cum>=target)break;const c=lcount(l),f=Math.min(1,(target-cum)/c);m.set(l,f);cum+=c}
  return PCT_CACHE[key]=m;
}
const SHOVE_BASE={UTG:12,UTG1:13,MP:15,LJ:17,HJ:22,CO:30,BTN:45,SB:55,HU:75,BB:100};
function shovePct(pos,eff){return Math.max(3,Math.min(100,(SHOVE_BASE[pos]||30)*Math.pow(10/Math.max(eff,2),0.9)))}
function effStackBB(i){
  const p=G.players[i];let m=0;G.players.forEach((q,k)=>{if(k!==i&&!q.folded)m=Math.max(m,q.stack+q.bet)});
  return Math.min(p.stack+p.bet,m||p.stack+p.bet);
}

function shortAdvice(i){

  const p=G.players[i],pos=posName(i),l=handLabel(p.cards[0],p.cards[1]),n=G.nAlive;

  if(jam>=0){

    const r=equity(p.cards,[],expand(pctMap(vpct)),700),eq=r?r.eq:0.5;

    const text=`${l}（${pos}）面對 ${vp} 全下（${fmt(v.stack+v.bet)}bb，估計約前 ${vpct}% 的牌）：你的勝率 ≈ ${pc(eq)}｜籌碼期望所需 ${pc(ic.chipNeed)}｜<b>ICM 所需 ${pc(need)}</b>（氣泡因子 ${ic.bf.toFixed(2)}）｜跟注 ${pc(acts.c)} ／ 棄牌 ${pc(acts.f)}`;
    return {acts,size:null,text,eq,mR:null,mC:null};
  }
  if(eff>18)return null;

    const m=pctMap(pct),f=m.get(l)||0;
    return {acts:{r:f,c:0,f:1-f},size:999,mR:m,mC:null,
      text:`${l}（${pos}）有效籌碼 ${fmt(eff)}bb（推或棄牌區）：全下範圍約前 ${Math.round(pct)}%｜${f>0?'在範圍內 → 全下':'不在範圍內 → 棄牌'}｜全下 ${pc(f)} ／ 棄牌 ${pc(1-f)}`};
  }

    text:`${l}（${pos}）有效籌碼 ${fmt(eff)}bb，面對加注：只用最強約 ${Math.round(pct*0.5)}% 的牌再加注全下，其餘棄牌｜全下 ${pc(f)} ／ 棄牌 ${pc(1-f)}`};
}

function post(i,a){const p=G.players[i];a=Math.min(a,p.stack);p.stack-=a;p.bet=a;p.total=a;if(p.stack<=1e-9){p.stack=0;p.allin=true}}

function distribute(){
  const P=G.players,n=P.length,pay=new Array(n).fill(0),tot=P.map(p=>p.total);
  const levels=[...new Set(tot.filter(t=>t>1e-9))].sort((a,b)=>a-b);let prev=0;
  for(const lv of levels){

function seatLayout(n){
  const mob=window.matchMedia&&matchMedia('(max-width:640px)').matches,rx=mob?41:44,ry=mob?40:38,cx=50,cy=47;
  return Array.from({length:n},(_,k)=>{
    const a=(90+360/n*k)*Math.PI/180,x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);
    return {x,y,bx:cx+(x-cx)*0.55,by:cy+(y-cy)*0.55,dx:cx+(x-cx)*0.74+3,dy:cy+(y-cy)*0.74};
  });
}

/* ============ ICM 練習：計算機與「泡沫期跟注全下」題 ============ */
const ICMS={sc:null,answered:false};
const icmStat=()=>{S.icm=S.icm||{n:0,c:0};return S.icm};
function icmGen(){
  const pay=[50,30,20],rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  let last=null;
  for(let t=0;t<30;t++){
    const hero=rnd(10,30),vil=rnd(6,hero),a=rnd(12,40),b=rnd(12,40),base=[hero,vil,a,b],dead=1.5;
    const ic=icmCall(base,0,1,pay,dead),vpct=Math.round(shovePct('BTN',vil)),rg=expand(pctMap(vpct));
    let best=null;
    for(let k=0;k<14;k++){
      const d=shuffled(52),h=[d[0],d[1]],r=equity(h,[],rg,500);if(!r)continue;
      const diff=Math.abs(r.eq-ic.need);if(!best||diff<best.diff)best={h,eq:r.eq,diff};
    }
    if(!best)continue;last={base,dead,pay,vpct,ic,hand:best.h,eq:best.eq};
    if(best.diff<0.1)return last;
  }
  return last;
}
function icmNew(){ICMS.sc=icmGen();ICMS.answered=false;renderIcm()}
function icmAnswer(call){
  if(ICMS.answered)return;ICMS.answered=true;
  const s=ICMS.sc,pc=x=>(x*100).toFixed(1)+'%',diff=s.eq-s.ic.need,close=Math.abs(diff)<0.015;
  const right=diff>=0,ok=close||call===right;
  const st=icmStat();st.n++;if(ok)st.c++;save();
  const chipOK=s.eq>=s.ic.chipNeed;
  $('icm-res').innerHTML=`<div class="res ${ok?'ok':'bad'}"><b>${ok?'✔ 正確':'✘ 錯誤'}</b> — ${close?'非常接近門檻，跟注或棄牌差異很小。':right?'你的勝率高於 ICM 所需勝率，跟注。':'你的勝率低於 ICM 所需勝率，應棄牌。'}<br>
  你的勝率對對手全下範圍（約前 ${s.vpct}%）：<b>${pc(s.eq)}</b><br>
  只看籌碼（籌碼 EV）所需勝率：<b>${pc(s.ic.chipNeed)}</b> → ${chipOK?'籌碼 EV 會跟注':'籌碼 EV 也會棄牌'}<br>
  考慮 ICM 後所需勝率：<b>${pc(s.ic.need)}</b>（氣泡因子 ${s.ic.bf.toFixed(2)}）<br>
  <span class="mut">你目前的 ICM 價值 ${s.ic.eNow.toFixed(1)}；贏了變 ${s.ic.eW.toFixed(1)}（+${(s.ic.eW-s.ic.eNow).toFixed(1)}），輸了變 ${s.ic.eL.toFixed(1)}（−${(s.ic.eNow-s.ic.eL).toFixed(1)}）。輸掉的損失大於贏到的收益，所以要更高的勝率才值得。</span></div>`;
  $('icm-c').disabled=$('icm-f').disabled=true;
}
function icmCalcRun(){
  const parse=s=>s.split(/[\s,，]+/).map(Number).filter(x=>!isNaN(x)&&x>=0);
  const st=parse($('ic-st').value),pay=parse($('ic-pay').value),out=$('ic-out');
  if(st.length<2||st.length>9||!pay.length){out.innerHTML='<div class="res bad">請輸入 2–9 個籌碼數字，以及至少一個獎金數字（用逗號分隔）。</div>';return}
  const eq=icmEq(st,pay),tot=st.reduce((a,b)=>a+b,0),pool=pay.reduce((a,b)=>a+b,0);
  out.innerHTML=`<table class="t"><tr><th>玩家</th><th>籌碼</th><th>籌碼佔比</th><th>ICM 價值</th><th>差異</th></tr>${st.map((s,i)=>{
    const share=s/tot*pool;return `<tr><td>${String.fromCharCode(65+i)}</td><td>${s}</td><td>${(s/tot*100).toFixed(1)}%（若按比例 ${share.toFixed(1)}）</td><td><b>${eq[i].toFixed(1)}</b></td><td style="color:${eq[i]>=share?'#2ea66a':'#d9534f'}">${eq[i]-share>=0?'+':''}${(eq[i]-share).toFixed(1)}</td></tr>`}).join('')}</table>
    <div class="mut">獎金總額 ${pool}；ICM 價值加總 ${eq.reduce((a,b)=>a+b,0).toFixed(1)}。「差異」＝ICM 價值 − 按籌碼比例分獎金；籌碼多的人為負，籌碼少的人為正。</div>`;
}

QGEN.icm=function(){
  const sets=[[5000,3000,2000],[6000,3000,1000],[4000,4000,2000],[7000,2000,1000],[3500,3500,3000],[8000,1500,500]];
  const st=sets[(Math.random()*sets.length)|0],pay=[50,30,20],k=(Math.random()*3)|0,eq=icmEq(st,pay),tot=st.reduce((a,b)=>a+b,0);
  const nm=['A','B','C'],ans=Math.round(eq[k]),share=Math.round(st[k]/tot*100);
  const set=[ans];[share,Math.round(100/3),ans+6,ans-6,ans+3].forEach(x=>{x=Math.max(1,Math.round(x));if(!set.includes(x)&&set.length<4)set.push(x)});
  let z=ans+9;while(set.length<4){if(!set.includes(z))set.push(z);z++}
  return {q:`3 人剩餘，獎金依序 50 / 30 / 20。籌碼：A ${st[0]}、B ${st[1]}、C ${st[2]}。玩家 <b>${nm[k]}</b> 的 ICM 獎金價值約為多少？`,opts:set.map(x=>x+''),a:0,
    why:`ICM 價值：A ${eq[0].toFixed(1)}、B ${eq[1].toFixed(1)}、C ${eq[2].toFixed(1)}（加總 100）。${nm[k]} 的籌碼佔 ${share}%，若按比例分獎金會是 ${share}（因為總額 100），但實際 ICM 價值是 ${eq[k].toFixed(1)}：籌碼多的人被「打折」、籌碼少的人被「加成」。`};
};
QGEN.icmneed=function(){
  const pay=[50,30,20],rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),hero=rnd(12,30),vil=rnd(8,hero),a=rnd(12,40),b=rnd(12,40);
  const base=[hero,vil,a,b],ic=icmCall(base,0,1,pay,1.5),need=Math.round(ic.need*100),chip=Math.round(ic.chipNeed*100);
  const set=[need];[chip,50,need+7,need-7].forEach(x=>{if(x>0&&x<100&&!set.includes(x)&&set.length<4)set.push(x)});let z=need+3;while(set.length<4){if(!set.includes(z))set.push(z);z++}
  return {q:`4 人剩餘、前 3 名有獎金（50 / 30 / 20）。籌碼（bb）：你 ${hero}、對手 ${vil}（全下）、C ${a}、D ${b}；底池另有 1.5bb 死錢。你覆蓋對手並考慮跟注。<b>考慮 ICM 後</b>，至少需要多少勝率？`,
    opts:set.map(x=>x+'%'),a:0,
    why:`只看籌碼的所需勝率約 ${chip}%（${chip}% 是把籌碼當成現金算出來的）。但輸掉會損失 ${(ic.eNow-ic.eL).toFixed(1)} 的獎金價值，贏了只增加 ${(ic.eW-ic.eNow).toFixed(1)}，所以 ICM 所需勝率 = 損失 ÷（損失 + 收益）≈ ${need}%（氣泡因子 ${ic.bf.toFixed(2)}）。`};
};

{t:'後期與名次博弈',goal:'理解決賽桌動態、單挑，以及名次博弈中的風險與均衡',lessons:[
 {id:'10.1',t:'決賽桌與大小籌碼互動',prac:[['打一場錦標賽（模擬比賽）','t-sim']],
  body:()=>`<p>接近獎金階梯時，每個人的決策都會互相影響：</p>
  <ul><li><b>大籌碼</b>是「施壓者」：能對中小籌碼持續全下或大加注，因為對方怕被淘汰。</li>
  <li><b>中籌碼</b>是「被擠壓者」：要避免輸給大籌碼，但也不能完全不動，否則被盲注吃掉。</li>
  <li><b>短籌碼</b>是「等待者或搏命者」：要看自己離下一個獎金階梯有多遠，以及盲注何時會吃掉自己。</li></ul>
  <h3>看階梯（Pay Jump）</h3><p>下一個名次的獎金差越大，越值得「等別人先被淘汰」；差越小，越值得提高籌碼去爭第一。</p>`,
  quiz:[Q('為什麼大籌碼在泡沫期能施壓？',['規則賦予特權','中小籌碼怕被淘汰，不敢跟注','大籌碼不用付盲注','大籌碼牌一定比較好'],1,'對手的氣泡因子高，被迫棄牌更多。'),
        Q('離下一個名次的獎金差距很大時，短籌碼通常傾向？',['立刻亂全下','在合理範圍內等別人先被淘汰','必定跟注','退出比賽'],1,'獎金階梯大時，保住名次更有價值。'),
        Q('中籌碼最常見的困境是？',['沒有牌','被大籌碼擠壓，又怕被盲注吃掉','無法加注','不能全下'],1,'兩邊都有壓力：怕輸給大籌碼，也不能太被動。')]},
 {id:'10.2',t:'單挑（Heads-up）策略',prac:[['打一場錦標賽（模擬比賽）','t-sim']],
  body:()=>`<p>剩最後兩人時：</p>
  <ul><li><b>位置</b>：按鈕位同時是小盲，<b>翻前先行動、翻後最後行動</b>；大盲翻前最後行動、翻後先行動。</li>
  <li><b>範圍很寬</b>：按鈕位開池可達 70–80% 的牌；大盲防守也很寬。只有兩個人，牌平均起來就變弱，所以「很多牌都值得打」。</li>
  <li><b>ICM 變簡單</b>：兩人時獎金 ＝ 第 2 名獎金 +（第 1 名 − 第 2 名）× 籌碼佔比，是<b>線性</b>的，所以此時籌碼 EV 和獎金 EV 一致（氣泡因子約等於 1）。</li></ul>
  <p>也因此，單挑時可以回到「用籌碼期望決策」，不必再為淘汰風險額外保守。</p>`,
  quiz:[Q('單挑時，按鈕位翻前的行動順序是？',['最後行動','最先行動','不行動','看籌碼'],1,'按鈕位同時是小盲，翻前先行動；翻後則最後行動。'),
        Q('為什麼單挑時範圍可以很寬？',['規則允許','只有一個對手，隨機兩張牌的平均強度相對更高','盲注很小','沒有位置'],1,'只需要贏一個人，很多牌都有足夠勝率。'),
        Q('單挑時 ICM 價值對籌碼是？',['凹函數（遞減）','線性','凸函數','無關'],1,'兩人時獎金期望 = 第 2 名獎金 + 籌碼佔比 ×（第 1 名 − 第 2 名），是線性的。')]},
 {id:'10.3',t:'名次博弈論',prac:[['ICM 練習','t-icm'],['打一場錦標賽（模擬比賽）','t-sim']],
  body:()=>`<p>把錦標賽看成一場<b>名次的博弈</b>：獎金固定，你的名次取決於所有人的決策。</p>
  <h3>1. 風險態度來自獎金結構</h3><p>因為獎金期望對籌碼是凹的，等於每個玩家在<b>風險趨避</b>（寧可穩定也不賭）。越接近獎金階梯，越明顯。</p>
  <h3>2. 均衡與剝削</h3><ul><li>兩人短碼的推或棄牌有已知的納許均衡；多人情況複雜得多，均衡不唯一，而且常常有人會被「剝削」。</li>
  <li>如果大家都過度保守，大籌碼把壓力轉成收益；如果大家都過度積極，保守的人反而能賺。</li></ul>
  <h3>3. ICM 的限制</h3><ul><li>假設每個人贏下每手牌的機率只由籌碼決定，<b>忽略位置、技術差距與未來盲注壓力</b>。</li>
  <li>強的玩家實際上能把籌碼轉成更多名次價值，所以 ICM 對技術較好的人可能略微「過度保守」。</li></ul>
  <h3>4. 如何使用</h3><p>把 ICM 當作<b>估算工具</b>：判斷大概該更緊還是更鬆，而不是精確答案。再用對手風格與位置微調。</p>`,
  quiz:[Q('獎金期望對籌碼是凹函數，意味著玩家傾向？',['風險愛好','風險趨避（保守）','不在乎','只看第一名'],1,'凹函數代表輸的代價大於贏的好處，所以偏向保守。'),
        Q('ICM 的主要限制是？',['不能計算','忽略位置、技術差距與盲注壓力','只能算兩人','只能算現金'],1,'ICM 只用籌碼比例估算，沒有考慮其他實戰因素。'),
        Q('多人錦標賽的均衡比起兩人推或棄牌？',['更簡單','更複雜，且不唯一','完全一樣','不存在'],1,'多人加上獎金結構，策略互動複雜很多。')]},
 {id:'10.4',t:'錦標賽決策清單與總整理',prac:[['打一場錦標賽（模擬比賽）','t-sim'],['手牌歷史','t-hist']],
  body:()=>`<p>每次做重要決策前，快速走一遍：</p>
  <ol><li><b>有效籌碼</b>幾 bb？（深碼、中碼、短碼、極短碼）</li><li><b>位置</b>：後面還有幾個人？我有沒有位置？</li>
  <li><b>名次與獎金</b>：還剩幾人？離獎金圈或下一個階梯多遠？</li>
  <li><b>對手籌碼與風格</b>：誰能淘汰我？誰怕被淘汰？</li><li><b>ICM 壓力</b>：氣泡因子大概多高？</li>
  <li><b>期望值</b>：勝率對所需勝率（含 ICM）。</li></ol>
  <h3>練習建議</h3><ul><li>先打幾場 6 人 SNG，再挑戰 9 人 SNG。</li><li>每場結束，開「手牌歷史」複盤你的短碼全下與泡沫期跟注。</li>
  <li>用「ICM 練習」分頁反覆練習泡沫期跟注，把「所需勝率」變成直覺。</li></ul>
  <div class="res warn">本練習器為教學工具，沒有真錢；範圍、獎金結構與 ICM 都是簡化設定，不保證獲利。</div>`,
  quiz:[Q('做錦標賽決策時，第一件要看的是？',['對手的暱稱','有效籌碼是幾 bb','今天運氣','桌面顏色'],1,'籌碼深度決定可用的策略類型。'),
        Q('泡沫期最需要額外考慮的是？',['發牌速度','ICM 壓力（輸掉的獎金代價）','牌桌音效','手牌花色'],1,'氣泡因子讓所需勝率比現金桌更高。'),
        Q('複盤時，最值得回頭看的是？',['每一手的輸贏','短碼全下與泡沫期的關鍵決策','只看贏的手牌','不用複盤'],1,'這些決策對名次與獎金影響最大。')]}
]}
);
const _pracList=pracList;
pracList=function(l){
  if(l<8)return _pracList(l);
  const sh=SIM.sngHist||[],ic=icmStat(),pct=(c,n)=>n?Math.round(c/n*100):0,P=[];
  const paid=x=>x.place<=(x.n===9?3:2);
  if(l===8)P.push({t:`完成 1 場錦標賽（目前 ${sh.length} 場）`,ok:sh.length>=1});
  if(l===9)P.push({t:`ICM 練習：至少 20 題、正確率 ≥ 70%（目前 ${ic.n} 題，${pct(ic.c,ic.n)}%）`,ok:ic.n>=20&&ic.c/ic.n>=.7});
  if(l===10){P.push({t:`打完 3 場以上錦標賽（目前 ${sh.length} 場）`,ok:sh.length>=3});P.push({t:`進入獎金圈至少 1 次（目前 ${sh.filter(paid).length} 次）`,ok:sh.filter(paid).length>=1})}
  return P;
};

const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
let deferredPrompt=null,swState='檢查中';
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;renderInstallBanner();if($('t-install').classList.contains('on'))renderInstall()});

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){

function dismissBanner(){try{localStorage.setItem('pwaDismiss',String(Date.now()))}catch(e){}renderInstallBanner(true)}
function doInstall(){
  if(!deferredPrompt)return show('t-install');
  deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;renderInstallBanner();renderInstall()});
}
function renderInstallBanner(forceHide){
  const el=$('installBanner');if(!el)return;
  let dismissed=false;try{const t=+localStorage.getItem('pwaDismiss');dismissed=t&&Date.now()-t<7*864e5}catch(e){}
  if(forceHide||dismissed||isStandalone()){el.innerHTML='';return}
  let msg,btn;
  if(ENV.inApp){msg='你正在 App 內建瀏覽器（如 LINE / FB）中，無法安裝。請點右上角選單，改用「'+(ENV.ios?'Safari':'Chrome')+'」開啟。';btn='看教學'}
  else if(deferredPrompt){msg='可以把練習器安裝成 App，離線也能用。';btn='安裝 App'}
  else if(ENV.ios){msg='iPhone / iPad：點 Safari 底部的「分享」→「加入主畫面」即可安裝。';btn='看圖文教學'}
  else if(ENV.android){msg='Android：點瀏覽器右上角「⋮」→「安裝應用程式」或「加到主畫面」。';btn='看教學'}
  else{msg='可安裝成桌面 App：點網址列右側的安裝圖示。';btn='看教學'}
  el.innerHTML=`<div class="ibanner"><span>📲 ${msg}</span><span><button class="b" onclick="${deferredPrompt?'doInstall()':"show('t-install')"}">${btn}</button><button class="b s" onclick="dismissBanner()" title="7 天內不再顯示">✕</button></span></div>`;
}

    <div>目前裝置：<b>${devName}</b> ｜ 狀態：${st?'✅ 已以 App 模式執行':'尚未安裝'} ｜ 離線快取：${swState}</div>
    ${location.protocol==='file:'?'<div class="res warn">你現在是用檔案（file://）開啟，瀏覽器不允許安裝。請把 pwa 資料夾部署到 https 網站後，再用網址開啟。</div>':''}

    ${deferredPrompt&&!st?'<button class="b big" onclick="doInstall()">一鍵安裝</button>':''}
    <div class="mut">安裝後會有桌面圖示、全螢幕開啟、離線可用；手牌歷史等資料保存在該裝置，不會上傳。</div></div>
  ${sec('android','🤖','Android（Chrome / Edge / Samsung Internet）',[
    '用 <b>Chrome</b>（或 Edge、Samsung Internet）開啟本頁網址。',
    '若頁面頂端出現「安裝 App」，直接點它；或點右上角 <b>⋮ 選單</b>。',
    '選 <b>「安裝應用程式」</b>（舊版顯示「加到主畫面」）。',
    '在彈出視窗按 <b>「安裝」</b>，桌面或應用程式列表就會出現「GTO 練習」圖示。'],
    'Firefox for Android：選單 →「安裝」。若選單沒有安裝選項，請改用 Chrome。')}
  ${sec('ios','🍎','iPhone / iPad（Safari）',[
    '務必用 <b>Safari</b> 開啟本頁網址（LINE、Facebook 內建瀏覽器不行）。',
    '點底部（iPad 在上方）的 <b>「分享」按鈕</b>（方框加向上箭頭 ⬆）。',
    '往下滑，點 <b>「加入主畫面」</b>。若看不到，先點選單最下方的「編輯動作」把它加進來。',
    '確認名稱後按右上角 <b>「加入」</b>，主畫面就會出現圖示，之後從圖示開啟即為全螢幕 App。'],
    'iOS 16.4 以上，其他瀏覽器（如 Chrome）也可從「分享」選單加入主畫面；iOS 沒有「一鍵安裝」按鈕，只能手動加入。從主畫面開啟的 App，資料較不易被 Safari 清除。')}
  ${sec('desktop','💻','電腦（Chrome / Edge）',[
    '用 Chrome 或 Edge 開啟本頁網址。',
    '點網址列<b>最右側的「安裝」圖示</b>（螢幕加向下箭頭）。',
    '按 <b>「安裝」</b>，之後可從開始功能表或桌面開啟，像一般軟體。'],
    'Safari（macOS Sonoma 以上）：選單「檔案」→「加入 Dock」。')}
  <details class="panel"><summary style="cursor:pointer;font-weight:700">🔧 沒看到安裝選項？</summary>
    <ul style="line-height:1.9"><li>網址必須是 <b>https://</b>（或 localhost）；用 file:// 或 http:// 都不能安裝。</li>

    <li>可用 Chrome 開發者工具 → Lighthouse / Application 面板檢查 PWA 是否合格。</li></ol></details>`;
