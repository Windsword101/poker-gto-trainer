    why:askMdf?`MDF = 底池 ÷（底池 + 下注）= 1 ÷ (1 + ${fr.toFixed(2)}) ≈ ${mdf}%。`:`所需勝率 = 下注 ÷（底池 + 2×下注）= ${fr.toFixed(2)} ÷ (1 + 2×${fr.toFixed(2)}) ≈ ${need}%。`};
};
COURSE.push({t:'情境專題：籌碼深度與尺度',goal:'依籌碼深度調整打法，並從對手的下注尺度推測範圍、做出回應',lessons:[
 {id:'11.1',t:'籌碼深度總覽：長碼、中碼、短碼',prac:[['對戰：選擇起始籌碼深度','t-sim'],['情境練習','t-scn']],
  body:()=>`<p>同一手牌，在不同籌碼深度下的打法可以完全不同。先認識五個區間（以有效籌碼的 bb 數計）：</p>
  <table class="t"><tr><th>深度</th><th>名稱</th><th>策略重點</th></tr>
  <tr><td>150bb 以上</td><td>超長碼</td><td>隱含賠率高：小對子、同花連張價值上升；3-bet 尺碼更大；要能打三條街</td></tr>
  <tr><td>80–120bb</td><td>長碼</td><td>標準的翻前圖表與翻後打法（本練習器的預設）</td></tr>
  <tr><td>40–60bb</td><td>中碼</td><td>隱含賠率下降，小對子、同花連張價值降低；3-bet 底池 SPR 約 2–3，常是一兩條街就決定</td></tr>
  <tr><td>20–40bb</td><td>中短碼</td><td>開池尺碼縮小，3-bet 全下成為選項；翻後 SPR 低，頂對常能打到全下</td></tr>
  <tr><td>15bb 以下</td><td>短碼</td><td>推或棄牌，翻後幾乎沒有操作空間</td></tr></table>
  <h3>SPR 快速估算</h3><p>SPR＝有效籌碼 ÷ 底池。單次加注底池（約 5.5bb）：100bb → SPR ≈ 17；40bb → ≈ 7；20bb → ≈ 3。SPR 越低，越應該「用手牌直接決定要不要投入全部籌碼」。</p>
  <div class="mut">對戰設定（⚙）可選起始籌碼：12 / 25 / 40 / 100 / 200bb，再到「情境練習」做專項練習。</div>`,
  quiz:[Q('有效籌碼 40bb、底池 5.5bb（單次加注），SPR 約為？',['3','7','17','30'],1,'(40 − 2.5) ÷ 5.5 ≈ 6.8，約 7。'),
        Q('哪種深度最重視「小對子、同花連張」這類隱含賠率牌？',['短碼','中短碼','超長碼','都一樣'],2,'籌碼越深，成牌後能多贏的錢越多，隱含賠率越高。'),
        Q('籌碼 12bb 時，翻前通常傾向？',['小加注看翻牌','全下或棄牌','只跟注','一律過牌'],1,'短碼區翻後沒有操作空間，翻前推或棄牌最有效率。')]},
 {id:'11.2',t:'短碼與中短碼打法（10–25bb）',prac:[['情境練習：短碼推或棄牌','t-scn'],['情境練習：面對短碼全下','t-scn']],
  body:()=>`<h3>1. 先看有效籌碼與位置</h3><p>有效籌碼是你和潛在對手中較短的那個。位置越後、籌碼越淺，全下範圍越寬（本練習器 10bb：UTG 約 12%、CO 約 30%、BTN 約 45%、SB 約 55%）。</p>
  <h3>2. 三種選擇</h3><ul><li><b>10–15bb 以下</b>：全下或棄牌（開池全下）。</li>
  <li><b>15–25bb</b>：可以小開池（約 2–2.2bb）後視情況面對 3-bet 全下；或乾脆全下較強的牌。</li>
  <li><b>面對加注</b>：用強牌 3-bet 全下，其餘棄牌；中等牌常常棄牌比跟注好。</li></ul>
  <h3>3. 面對別人的全下</h3><p>用<b>你的勝率對他的範圍</b>與<b>所需勝率</b>比較（跟注額 ÷（底池 + 跟注額））。對手籌碼越淺，他的全下範圍越寬，你就能跟注得越寬；在 100bb 遇到全下，則要假設他幾乎只有最強的牌。</p>
  <div class="res warn">錦標賽泡沫期要再考慮 ICM（第 9 級）；現金桌只看籌碼期望。</div>`,
  quiz:[Q('15bb 的 BTN，前面都棄牌，通常合理的做法是？',['重重加注 4bb','全下範圍內的牌，其餘棄牌','只跟注盲注','全部棄牌'],1,'短碼區用「全下或棄牌」最有效率，BTN 的全下範圍很寬。'),
        Q('對手籌碼越淺，你面對他的全下時？',['要更緊','可以跟注得更寬','不能跟注','不需要考慮'],1,'短碼的全下範圍很寬，你的牌對它的勝率就比較高。'),
        Q('面對 4bb 的加注，你只有 15bb 且持中等牌（如 A9o），較常見的做法是？',['跟注看翻牌','視位置與對手範圍，傾向棄牌或全下，不容易只跟注','加注到 8bb','過牌'],1,'短碼面對加注，跟注會讓翻後 SPR 很低又沒有位置，通常「全下或棄牌」。')]},
 {id:'11.3',t:'長碼與中碼打法（40–100bb）',prac:[['情境練習：長碼翻後下注','t-scn'],['模擬比賽（100bb）','t-sim']],
  body:()=>`<p>長碼（約 100bb）是本練習器翻前圖表的標準情境。重點是<b>有計畫地打完整個牌局</b>。</p>
  <h3>翻前</h3><ul><li>開池 2.2–2.5bb（SB 約 3bb）；3-bet 有位置約 3 倍、沒位置約 4 倍。</li><li>40–60bb：開池可略小、較少用邊緣的投機牌；3-bet 後 SPR 低，強牌可直接打光。</li></ul>
  <h3>翻後：先想好三條街的計畫</h3>
  <ol><li><b>成牌價值牌</b>：計畫打兩到三條街（翻牌小到中注、轉牌加大、河牌視對手跟注範圍收尾）。</li>
  <li><b>聽牌</b>：翻牌半詐唬，轉牌補中就繼續下注，沒補中依賠率與對手反應決定。</li>
  <li><b>弱的成牌</b>：多控制底池，用過牌或小注收取薄價值，不打大底池。</li></ol>
  <h3>尺度選擇（常見做法）</h3><table class="t"><tr><th>情境</th><th>常用尺度</th></tr><tr><td>乾燥牌面持續下注</td><td>約 1/3 底池，高頻率</td></tr><tr><td>濕潤牌面、強牌或好聽牌</td><td>約 2/3 底池，頻率較低</td></tr><tr><td>河牌極化範圍</td><td>3/4 底池到滿池</td></tr></table>`,
  quiz:[Q('長碼（約 100bb）下，乾燥牌面（K♠7♦2♣）上翻前加注者的持續下注，常用？',['滿池大注、低頻率','約 1/3 底池、高頻率','一律過牌','全下'],1,'乾燥牌面範圍優勢明顯，小注高頻率就能獲利。'),
        Q('「有計畫地打三條街」的意思是？',['每條街都全下','在翻牌就想好轉牌、河牌要怎麼打','只打翻牌','隨機決定'],1,'先規劃整手牌的價值與詐唬路線，避免被迫在河牌做難決定。'),
        Q('40–60bb 比 100bb 更不適合的牌是？',['AA','AK','小同花連張（如 65s）','KK'],2,'籌碼淺時隱含賠率變低，投機牌價值下降。')]},
 {id:'11.4',t:'判讀對手的下注尺度',prac:[['情境練習：尺度解讀','t-scn'],['對戰：看提示中的「尺度解讀」','t-sim']],
  body:()=>`<p>對手的下注<b>尺度</b>是最容易取得的資訊之一：它同時決定你<b>需要的勝率</b>與你對他<b>範圍</b>的推測。</p>
  <table class="t"><tr><th>對手下注</th><th>範圍的一般傾向</th><th>你需要的勝率</th><th>最低防守頻率</th></tr>
  <tr><td>約 1/4–1/3 底池</td><td>範圍較寬：薄價值、保護、試探</td><td>20%</td><td>75%</td></tr>
  <tr><td>約 1/2 底池</td><td>標準：價值與詐唬混合</td><td>25%</td><td>67%</td></tr>
  <tr><td>約 2/3–3/4 底池</td><td>偏強、偏極化</td><td>29–30%</td><td>57–60%</td></tr>
  <tr><td>滿池（1 倍）</td><td>高度極化：很強或詐唬</td><td>33%</td><td>50%</td></tr>
  <tr><td>1.5 倍底池（超池）</td><td>極化到只剩堅果級牌與純詐唬</td><td>37.5%</td><td>40%</td></tr></table>
  <h3>極化與合併</h3><ul><li><b>極化（polarized）</b>：下注範圍只有很強的牌和詐唬牌，中等牌通常過牌。大注常是這類範圍。</li>
  <li><b>合併（merged）</b>：連中等強度的牌也下注，範圍較連續。小注常是這類範圍。</li></ul>
  <p>這些是「<b>一般傾向</b>」，不是定律；牌面、位置與對手風格都會改變它。觀察到對手用不同尺度打不同強度的牌（尺度洩漏）時才能剝削，而且要有足夠樣本。</p>
  <div class="mut">對戰的 策略提示在面對下注時，會自動顯示「尺度解讀」，並依尺度縮窄對手的範圍後再算你的勝率。</div>`,
  quiz:[G_('sizeneed'),G_('sizeneed'),Q('對手下注越大，他的範圍通常？',['越寬','越極化（強牌與詐唬）','不變','只剩弱牌'],1,'大注傾向由很強的牌與詐唬組成，中等牌較少用大注。')]},
 {id:'11.5',t:'面對不同尺度的回應流程',prac:[['情境練習：尺度解讀','t-scn']],
  body:()=>`<p>面對下注時，用這個固定流程：</p>
  <ol><li><b>還原比例</b>：對手下注佔底池多少？</li>
  <li><b>算兩個數字</b>：所需勝率與最低防守頻率。</li>
  <li><b>縮窄範圍</b>：小注 → 範圍較寬；大注 → 範圍偏極化、較窄。</li>
  <li><b>算你的勝率</b>：你的手牌對「縮窄後的範圍」有多少？聽牌要用補中率。</li>
  <li><b>決定</b>：勝率明顯高於所需 → 跟注或加注；接近 → 看位置與隱含賠率；明顯低於 → 棄牌。</li></ol>
  <h3>什麼時候加注？</h3><ul><li>對手<b>小注</b>、範圍寬：用強牌價值加注，或用有聽牌的牌半詐唬加注。</li><li>對手<b>大注</b>：加注代表很強，通常只用堅果級牌；多半跟注或棄牌。</li></ul>
  <h3>範例</h3><p>你有中等一對，對手 1/3 底池下注：他的範圍很寬，你的一對勝率通常高於所需的 20%，跟注。若他下注 1.5 倍底池：他的範圍極化，同一手一對的勝率可能掉到所需的 37.5% 以下，棄牌。</p>`,
  quiz:[Q('對手下注 1/3 底池，你持中等一對，通常？',['棄牌','範圍較寬、你的勝率常高於所需，跟注','全下','過牌'],1,'小注範圍寬，你的一對對它仍有不錯的勝率，所需勝率只要約 20%。'),
        Q('對手下注 1.5 倍底池（超池），你持中等一對，常見的處理是？',['一律加注','範圍極化，傾向棄牌','一律全下','一律跟注'],1,'超池代表範圍高度極化，一對的勝率常不足所需的 37.5%。'),
        Q('面對下注時，「縮窄範圍」是在？',['忽略對手的動作','依下注尺度調整你對他範圍的估計','猜他的手牌','換座位'],1,'尺度越大，範圍越極化、越窄，你的勝率要對那個範圍計算。')]}
]});
const _pracList2=pracList;
pracList=function(l){
  if(l!==11)return _pracList2(l);
  const g=k=>{const x=(S.scn||{})[k]||{n:0,c:0};return x},pct=x=>x.n?Math.round(x.c/x.n*100):0,a=g('A'),b=g('B'),c=g('C'),d=g('D');
  return [
    {t:`短碼：推或棄牌＋面對全下 合計至少 30 題、正確率 ≥ 75%（目前 ${a.n+b.n} 題，${pct({n:a.n+b.n,c:a.c+b.c})}%）`,ok:a.n+b.n>=30&&(a.c+b.c)/(a.n+b.n)>=.75},
    {t:`長碼翻後下注：至少 15 題、正確率 ≥ 70%（目前 ${c.n} 題，${pct(c)}%）`,ok:c.n>=15&&c.c/c.n>=.7},
    {t:`尺度解讀：至少 20 題、正確率 ≥ 70%（目前 ${d.n} 題，${pct(d)}%）`,ok:d.n>=20&&d.c/d.n>=.7}
  ];
};

const GOAL=t=>`<div class="goal">🎯 <b>本課目標</b>：${t}</div>`;

COURSE[0]={t:'規則與牌感',goal:'看懂牌局流程、牌型大小、下注規則與基本術語',lessons:[
 {id:'0.1',t:'牌局流程與位置名稱',prac:[['看看牌桌：模擬比賽','t-sim'],['查術語表','t-guide']],
  body:()=>GOAL('說得出一手牌從頭到尾會發生什麼事，並知道每個位置的行動順序。')+`
  <h3>一手牌的流程</h3>
  <table class="t"><tr><th>階段</th><th>公共牌</th><th>發生什麼事</th></tr>
  <tr><td>發底牌</td><td>0 張</td><td>每人拿到 2 張只有自己看得到的牌（底牌）</td></tr>
  <tr><td>翻前（preflop）</td><td>0 張</td><td>第一輪下注</td></tr>
  <tr><td>翻牌（flop）</td><td>3 張</td><td>第二輪下注</td></tr>
  <tr><td>轉牌（turn）</td><td>第 4 張</td><td>第三輪下注</td></tr>
  <tr><td>河牌（river）</td><td>第 5 張</td><td>最後一輪下注</td></tr>
  <tr><td>攤牌（showdown）</td><td>共 5 張</td><td>還沒棄牌的人亮牌，用 2 張底牌 + 5 張公共牌組出最好的 5 張，最大者贏得底池</td></tr></table>
  <p>任何時候只要其他人都棄牌，剩下的最後一人就直接贏得底池，不需要亮牌。</p>
  <h3>盲注與按鈕</h3>
  <p>桌上的「D」標記叫<b>按鈕</b>（莊家位），每打完一手就順時針移到下一位。按鈕左邊的兩位要在發牌前強制下注：<b>小盲（SB，0.5bb）</b>與<b>大盲（BB，1bb）</b>。盲注的作用是「先製造一個底池」，否則大家都在等好牌，牌桌就沒有行動了。</p>
  <h3>6 人桌的位置</h3>
  <table class="t"><tr><th>位置</th><th>說明</th></tr>
  <tr><td><b>UTG</b></td><td>最前位。翻前第一個行動，後面還有 5 人，最不利</td></tr>
  <tr><td><b>HJ</b></td><td>中位</td></tr>
  <tr><td><b>CO</b></td><td>按鈕前一位，偏有利</td></tr>
  <tr><td><b>BTN</b></td><td>按鈕位（莊位）。翻後最後行動，最有利</td></tr>
  <tr><td><b>SB / BB</b></td><td>小盲、大盲。已經投了錢，但翻後最先行動，位置不利</td></tr></table>
  <p>9 人桌在 UTG 和 CO 之間多了 UTG+1、MP、LJ 等位置，原則相同：越前面越早行動、越不利。</p>
  <h3>翻前與翻後的順序不同</h3>
  <ul><li><b>翻前</b>：由大盲左手邊的 UTG 先行動，最後才輪到小盲和大盲。</li>
  <li><b>翻後</b>：由小盲（或按鈕左手邊第一位還在手牌裡的人）先行動，<b>按鈕位最後行動</b>。</li></ul>
  ${EXAM('例：6 人桌，所有人都看到翻牌。翻牌後的行動順序是 SB → BB → UTG → HJ → CO → BTN。')}
  <h3>單挑的特例</h3><p>只剩兩人時，按鈕位同時是小盲：<b>翻前先行動，翻後最後行動</b>。</p>
  ${PIT('以為大盲永遠最後行動（只有翻前是，翻後反而最先行動）；不分位置，用同樣的牌在每個位置進池。')}
  ${SUMM('流程是「底牌 → 翻前 → 翻牌 → 轉牌 → 河牌 → 攤牌」；按鈕每手順時針移一格；翻後按鈕位最後行動，資訊最多。')}`,
  quiz:[Q('6 人桌翻前，第一個行動的是哪個位置？',['小盲','大盲','UTG（最前位）','按鈕位'],2,'翻前由大盲左手邊的 UTG 先行動。'),
        Q('翻牌之後，誰最後行動、最有優勢？',['按鈕位（BTN）','小盲','UTG','大盲'],0,'翻牌後按鈕位在最後行動，能先看到所有人的動作再決定。'),
        Q('一手牌打到河牌，桌上共有幾張公共牌？',['3 張','4 張','5 張','7 張'],2,'翻牌 3 張 + 轉牌 1 張 + 河牌 1 張 = 5 張。'),
        Q('翻牌圈（翻後）通常由誰先行動？',['按鈕位','小盲（或按鈕左手邊第一位還在手牌的人）','UTG','大盲永遠最後'],1,'翻後從按鈕左手邊的第一位開始，按鈕位最後。'),
        Q('只剩兩人單挑時，按鈕位翻前的行動順序是？',['最後行動','最先行動','不用行動','看籌碼多少'],1,'單挑時按鈕位同時是小盲，翻前先行動，翻後最後行動。')]},
 {id:'0.2',t:'牌型大小與比大小',prac:[['用勝率計算機看牌型','t-calc']],
  body:()=>{
    const rows=[['同花順','9h8h7h6h5h','同花色的五張連續牌（最大的 A-K-Q-J-10 叫皇家同花順）'],['四條','KsKhKdKc2h','四張同點數'],['葫蘆','QsQhQd7c7h','三條加一對（先比三條的點數）'],['同花','AdJd8d5d3d','五張同花色，不連續'],['順子','9s8h7d6c5h','五張連續，不同花色'],['三條','7s7h7dKc2h','三張同點數'],['兩對','JsJhTdTc4h','兩組對子'],['一對','AsAh9d6c2h','一組對子'],['高牌','AsJh9d6c3h','什麼都沒有，比最大的牌']];
    return GOAL('背熟 9 種牌型的大小，並能判斷兩手牌誰贏。')+`
    <h3>由大到小共 9 種</h3><table class="t"><tr><th>牌型</th><th>範例</th><th>說明</th></tr>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td><div class="cards">${ex(r[1])}</div></td><td>${r[2]}</td></tr>`).join('')}</table>
    <h3>怎麼比大小？</h3><ol><li>先比<b>牌型</b>，牌型大的贏。</li><li>牌型相同，比組成牌型的<b>點數</b>（例如一對 K 贏一對 Q）。</li><li>還是一樣，比<b>踢腳牌</b>（沒有用在牌型裡、剩下最大的牌）。</li></ol>
    ${EXAM('例：公共牌是 A♣ 9♦ 6♠ 3♥ 2♦。你拿 A♠K♦，對手拿 A♥Q♦。兩人都是「一對 A」，接著比踢腳：你的 K 大於對手的 Q，你贏。')}
    <h3>幾個容易搞錯的規則</h3><ul>
    <li><b>A 可以當最大，也可以當最小</b>：A-K-Q-J-10 是最大的順子，A-2-3-4-5（稱「輪子」）是最小的順子。但順子不能「繞過去」，例如 Q-K-A-2-3 不算順子。</li>
    <li><b>花色沒有大小</b>。牌型和點數完全一樣時，平分底池。</li>
    <li>你的最佳牌是從 7 張（2 張底牌 + 5 張公共牌）挑出的 <b>5 張</b>，也可以全部用公共牌（稱為「公共牌就是最大牌」），這時如果對手沒有更大的牌，就是平分。</li></ul>
    ${PIT('把「順子」和「同花」的大小搞反（同花比順子大）；忽略踢腳牌；以為 A-2-3-4-5 是最大的順子（它其實是最小的）；以為花色有大小。')}
    ${SUMM('9 種牌型：同花順 > 四條 > 葫蘆 > 同花 > 順子 > 三條 > 兩對 > 一對 > 高牌；牌型相同再比點數，再比踢腳；完全一樣就平分。')}`;
  },
  quiz:[G_('cmp'),G_('cmp'),Q('同花和順子哪個比較大？',['同花','順子','一樣大','要看點數'],0,'牌型排序：同花（第 4 大）大於順子（第 5 大）。'),
        Q('A-2-3-4-5 是怎樣的牌？',['最大的順子','最小的順子','不算順子','同花順'],1,'A 可以當 1，A-2-3-4-5 是最小的順子（輪子）。'),
        Q('兩人都是一對 A，你的踢腳是 K、對手是 Q，結果是？',['你贏','對手贏','平分','要比花色'],0,'牌型和點數相同時比踢腳，K 大於 Q。')]},
 {id:'0.3',t:'底池、籌碼與 bb 單位',prac:[['用模擬比賽熟悉底池','t-sim']],
  body:()=>GOAL('會用「大盲（bb）」當單位算底池，並理解什麼是有效籌碼。')+`
  <h3>為什麼用 bb 當單位？</h3>
  <p>撲克裡的金額通常以<b>大盲（bb）</b>來計算，而不是實際金額。這樣不管是 NT$2 的小桌還是 NT$200 的大桌，策略都能互相比較：你有 100bb、對手下注 5bb，在哪一桌的意義都一樣。<b>100bb 深度</b>是本練習器預設的標準情境。</p>
  <h3>底池怎麼算？</h3><p>把所有人在這手牌投入的籌碼加總。</p>
  ${EXAM('例：6 人桌，SB 0.5bb、BB 1bb。CO 開池加注到 2.5bb，BTN 跟注 2.5bb，其餘人棄牌（SB、BB 的盲注留在底池）。<br>底池 = 0.5 + 1 + 2.5 + 2.5 = <b>6.5bb</b>。')}
  <h3>有效籌碼</h3><p>兩個人對戰時，真正會被輸贏的上限是兩人之中<b>較短的籌碼</b>，稱為有效籌碼。你有 100bb、對手只有 40bb，有效籌碼就是 40bb——你最多只會輸贏對手的 40bb。</p>
  <h3>為什麼要在意籌碼深度？</h3><p>籌碼越深，後面可以下注的空間越大，打法越複雜；籌碼越短，越容易直接決定「全下或棄牌」。第 11 級會學不同深度的打法。</p>
  /*EXTRA*/<h3>幾個常見底池，記起來很好用</h3>
<table class="t"><tr><th>情境</th><th>底池</th></tr>
<tr><td>BTN 開池 2.5bb，BB 跟注，SB 棄牌</td><td>2.5 + 2.5 + 0.5 = <b>5.5bb</b></td></tr>
<tr><td>CO 開池 2.5bb，BTN 跟注，SB、BB 棄牌</td><td>2.5 + 2.5 + 0.5 + 1 = <b>6.5bb</b></td></tr>
<tr><td>BTN 開 2.5bb，BB 再加注到 10bb，BTN 跟注</td><td>10 + 10 + 0.5 = <b>20.5bb</b></td></tr></table>
<h3>bb 怎麼換算成實際金額？</h3>
<p>如果盲注是 10/20（大盲 20），那 1bb = 20，100bb = 2,000。換算很簡單：<b>實際金額 ÷ 大盲 = 幾 bb</b>。之後本課程所有數字都用 bb，你可以套用在任何盲注級別。</p>
  ${PIT('只看「這手要付多少錢」而不看底池與籌碼的比例；忘記盲注也算在底池裡。')}
  ${SUMM('用 bb 當單位；底池是所有投入的總和；有效籌碼取兩人中較短的那一個。')}`,
  quiz:[Q('SB 0.5、BB 1。CO 開到 2.5bb，BTN 跟注，SB 與 BB 棄牌。底池是多少？',['5bb','5.5bb','6.5bb','7bb'],2,'0.5（SB）+ 1（BB）+ 2.5（CO）+ 2.5（BTN）= 6.5bb。'),
        Q('為什麼撲克常用 bb 當單位？',['因為比較好看','不同賭注級別的策略能互相比較','規定要這樣','因為 bb 比較大'],1,'策略取決於籌碼相對盲注的比例，用 bb 表示就不受實際金額影響。'),
        Q('你有 100bb、對手只有 40bb，有效籌碼是多少？',['100bb','70bb','40bb','60bb'],2,'有效籌碼取兩人中較短的那一個，因為你最多只會輸贏到對手的籌碼。'),
        Q('底池 10bb，對手下注 5bb，你跟注後底池是多少？',['10bb','15bb','20bb','25bb'],2,'10 + 5（對手）+ 5（你跟注）= 20bb。')]},
 {id:'0.4',t:'下注規則補充',prac:[['查術語表','t-guide'],['看示範牌局','t-demo']],
  body:()=>GOAL('搞懂可以做哪些動作、最小下注與加注、邊池、攤牌順序，以及線上遊戲的基本禮儀。')+`
  <h3>每次輪到你，能做什麼？</h3>
  <table class="t"><tr><th>情況</th><th>可以做的動作</th></tr>
  <tr><td>還沒有人下注</td><td>過牌（不下注也不花錢）、下注</td></tr>
  <tr><td>有人已下注</td><td>棄牌、跟注、加注（不能過牌）</td></tr></table>
  <h3>最小下注與最小加注</h3>
  <ul><li><b>最小下注</b>：至少 1 個大盲。</li>
  <li><b>最小加注</b>：加注的「增量」至少要等於前一次下注或加注的增量。</li></ul>
  ${EXAM('例：翻牌圈沒人下注，甲下注 4bb（增量 4）。乙想加注，最少要加到 8bb（4 + 4）。<br>翻前：BB 是 1bb，CO 開池到 2.5bb（增量 1.5），BTN 想再加注，最少要加到 4bb（2.5 + 1.5）。')}
  <p>如果有人全下的金額不足最小加注（不足額加注），一般規定不會讓前面已行動的人重新獲得加注的機會；各平台細節略有差異，以所玩的平台規則為準。</p>
  <h3>過牌加注（check-raise）</h3><p>先過牌，等對手下注後再加注。完全合法，也是常見的策略動作。</p>
  <h3>全下與邊池</h3>
  <p>全下是把所有籌碼推進去。如果有人籌碼比較少，他只能贏得「他有投入的那一部分」，多出來的部分會形成<b>邊池</b>。</p>
  ${EXAM('甲只有 30，乙、丙各有 100，三人都全下。<br><b>主池</b> = 30 × 3 = 90（甲、乙、丙都能爭）。<b>邊池</b> = (100 − 30) × 2 = 140（只有乙、丙能爭）。<br>所以甲即使牌最大，最多也只能贏 90。')}
  <h3>攤牌順序</h3><p>河牌下注結束後，<b>最後一個主動下注或加注的人先亮牌</b>；如果河牌大家都過牌，就從按鈕左手邊的第一位開始。線上遊戲會自動結算。</p>
  <h3>線上遊戲的基本禮儀</h3>
  <ul><li>不要使用「即時輔助」軟體（RTA）、不要與他人串通，這些在真錢線上撲克中是嚴格禁止的。</li>
  <li><b>本練習器只用來學習和練習</b>，請不要在任何真實對局進行中用它即時查詢或計算。</li>
  <li>棄牌後不能反悔、也不要透露自己的手牌。</li></ul>
  ${PIT('以為有人下注後還能「過牌」；加注金額低於最小加注；忘記邊池讓短籌碼只能贏一部分。')}
  ${SUMM('沒人下注可過牌；有人下注只能棄牌、跟注或加注；最小加注 = 前一次的增量；短籌碼全下會產生邊池；最後的加注者先亮牌。')}`,
  quiz:[Q('翻牌圈沒人下注，甲下注 4bb。乙想加注，最少要加到多少？',['6bb','8bb','10bb','12bb'],1,'前一次下注增量是 4，最小加注到 4 + 4 = 8bb。'),
        Q('甲有 30、乙丙各有 100，三人全下。甲最多能贏多少？',['30','60','90','230'],2,'主池 = 30 × 3 = 90，甲只能爭主池。'),
        Q('河牌下注結束，攤牌時誰先亮牌？',['最大的牌','最後一個主動下注或加注的人','按鈕位','籌碼最少的人'],1,'最後一個主動下注或加注者先亮牌；若都過牌，從按鈕左手邊開始。'),
        Q('有人已下注時，你不能做哪個動作？',['棄牌','跟注','加注','過牌'],3,'面對下注時只能棄牌、跟注或加注，不能過牌。'),
        Q('使用本練習器的正確方式是？',['在真錢牌局中即時查詢','只用於學習與練習，不在真實對局中使用','拿來和對手串通','沒有限制'],1,'即時輔助在真錢線上撲克是禁止的，本工具只供學習。')]}
]};

COURSE[1]={t:'翻前基礎',goal:'懂位置、起手牌強弱、開池範圍與尺碼',lessons:[
 {id:'1.1',t:'位置與範圍：為什麼越後面越寬？',prac:[['翻前範圍練習','t-pre'],['翻前教學','t-learn']],
  body:()=>{
    const P=['UTG','HJ','CO','BTN','SB'],eg={UTG:'中對子以上、A9s 以上的同花 A、KTs/QTs/JTs 這類同花大牌、AJo 以上',HJ:'再加入小對子（44+）、A8s、K9s、QJo 等',CO:'再放寬到所有對子、所有同花 A、更多同花連張與非同花大牌',BTN:'幾乎所有同花、多數連張、K9o 以上的大牌；是範圍最寬的位置',SB:'接近 BTN，但沒有位置，只用「加注或棄牌」，不要平跟'};
    return GOAL('知道為什麼位置越後面可以玩越多牌，並記住各位置大概要玩多少比例的牌。')+`
    <p>「範圍」是指「你在某個情境下，會用哪些起手牌進池」。新手最重要的觀念：<b>位置越前面，越要挑牌；越後面，可以放寬。</b></p>
    <h3>為什麼？兩個原因</h3><ol><li><b>後面還沒行動的人越少，越安全。</b>UTG 後面有 5 個人，任何一個都可能有強牌；BTN 後面只剩兩個盲注。</li>
    <li><b>翻後的位置優勢。</b>最後行動的人可以先看到對手怎麼做，再做決定，同樣的牌打起來比較賺錢。</li></ol>
    ${EXAM('舉例：K♠9♦ 在 UTG 通常棄牌，因為後面 5 個人都可能有比你好的 K（你的 9 會被「支配」）；但在 BTN 常可以開池，因為只需要面對兩個盲注，而且翻後你最後行動。')}
    <h3>本練習器的新手起步範圍（偏保守）</h3>
    <table class="t"><tr><th>位置</th><th>約佔所有起手牌</th><th>大概有哪些牌</th></tr>${P.map(p=>`<tr><td><b>${p}</b></td><td>${pctOf(RM[p]).toFixed(0)}%</td><td>${eg[p]}</td></tr>`).join('')}</table>
    <div class="mut">這是偏保守的練習用圖表，實戰常見的圖表通常會更寬一些（例如前位約 15% 上下）。先打穩，熟練後再逐步放寬；真正的範圍會隨籌碼深度、對手與牌桌狀況調整。</div>
    <h3>三條新手規則</h3><ol><li>前位只玩強牌，後位才放寬。</li><li>第一個進池請<b>加注</b>，不要平跟（limp）。</li><li>不確定的牌，寧可棄牌，不要「看看再說」。</li></ol>
    ${PIT('在 UTG 玩 K9o、Q8s 這種「看起來還不錯」的牌；每個位置都用同一套範圍；覺得棄牌很可惜。')}
    ${SUMM('位置越後面範圍越寬：UTG 最緊、BTN 最寬；範圍表是起點，不是終點。')}`;
  },
  quiz:[Q('哪個位置的開池範圍最寬？',['UTG','HJ','CO','BTN'],3,'按鈕位後面只剩兩個盲注，翻後又有位置，所以範圍最寬。'),
        Q('為什麼 UTG 要收緊範圍？',['規則限制','後面還有很多人沒行動，且翻後常沒位置','因為籌碼比較少','因為牌比較小'],1,'後面人多，遇到強牌的機率高；翻後也較難有位置優勢。'),
        Q('「位置優勢」最主要的好處是？',['可以看底牌','能先看到對手的動作再決定','可以多拿一張牌','可以不用付盲注'],1,'最後行動能取得更多資訊，決策更準確。'),
        Q('K9o 在 BTN 與在 UTG 的處理，通常是？',['都開池','BTN 可開、UTG 棄牌','BTN 棄牌、UTG 開','都棄牌'],1,'後位範圍較寬；前位後面人多，K9o 容易被更好的 K 支配。'),
        Q('新手面對「不確定要不要玩」的牌，較好的原則是？',['先進去看看','寧可棄牌','全下','平跟'],1,'不確定時棄牌能避免大量不必要的損失。')]},
 {id:'1.2',t:'起手牌分類與強弱',prac:[['翻前範圍練習','t-pre']],
  body:()=>GOAL('知道 169 種起手牌怎麼分類，並能判斷一手牌強不強、會不會被「支配」。')+`
  <p>兩張底牌共有 1326 種組合，但依點數和是否同花，可以歸成 <b>169 種起手牌</b>。</p>
  <table class="t"><tr><th>類型</th><th>例子</th><th>組合數</th></tr><tr><td>對子</td><td>AA、77</td><td>6 種</td></tr><tr><td>同花（s）</td><td>AKs、76s</td><td>4 種</td></tr><tr><td>不同花（o）</td><td>AKo、T9o</td><td>12 種</td></tr></table>
  <h3>影響牌力的四個因素</h3>
  <ul><li><b>高牌與對子</b>：直接決定能不能贏。AA、KK、AK 是最強的一群。</li>
  <li><b>同花</b>：比同點數的不同花多約 2–3 個百分點的勝率，還能成同花。</li>
  <li><b>連張</b>（如 JTs、87s）：能組順子，翻後「可玩性」高，適合在後位開池。</li>
  <li><b>被支配</b>：K9o 對 KQo，雙方都有 K，但你的 9 比對手的 Q 小，贏的時候少、輸的時候多。所以「雜牌的高牌」（K9o、QTo）在前位常被棄掉。</li></ul>
  <h3>小對子怎麼看？</h3>
  <p>22–66 這類小對子很難靠對子直接贏，主要價值是<b>翻牌中三條</b>（約 12% 的機率，也就是約八次一次）。所以它們適合在後位、籌碼夠深時進池，指望翻中時能贏一大筆。</p>
  <h3>阻擋牌（blocker）</h3><p>手上持有 A，就讓對手更少機會有 AA 或 AK。A5s 因此常被當作詐唬牌（之後會學：用較弱的牌下注或加注，逼對手棄掉更好的牌）：有 A 的阻擋效果，還能成同花與輪子順子（後面學 3-bet 時會再用到）。</p>
  ${PIT('迷信「有 A 就是好牌」（A5o、A8o 常被 AK、AQ 支配）；為了同花而玩一堆雜牌；用 22–44 這類小對子打大底池。')}
  ${SUMM('169 類 = 對子 + 同花 + 不同花；牌力看高牌、對子、同花、連張；小心被支配；小對子靠翻中三條。')}`,
  quiz:[Q('AKs 有幾種組合？',['12','6','4','16'],2,'同花有 4 種花色，所以 AKs 是 4 種；AKo 才是 12 種。'),
        Q('K9o 為什麼比 KQo 差？',['K9o 是同花','K9o 容易被 KQ 之類的牌「支配」','K9o 沒有 K','沒有差別'],1,'同樣有 K 時，對手的踢腳（Q）比你的 9 大，你贏的機率低。'),
        Q('同點數的牌，同花比不同花大概多幾個百分點的勝率？',['0','約 2–3','約 10','約 20'],1,'同花多了成同花的機會，大約多 2–3 個百分點。'),
        Q('小對子（如 55）翻牌圈中三條的機率大約是？',['約 1%','約 12%','約 40%','約 70%'],1,'約 12%，也就是八次裡中一次左右。'),
        Q('A5s 常被拿來當詐唬牌，主要是因為？',['A5s 是最強的牌','有 A 的阻擋效果，又能成同花與順子','規定要用','牌面很大'],1,'阻擋對手的強牌，並且有成牌的潛力。')]},
 {id:'1.3',t:'開池尺碼與偷盲數學',prac:[['翻前範圍練習','t-pre']],
  body:()=>GOAL('知道第一個進池該怎麼加注、加多大，並理解「偷盲」為什麼賺錢。')+`
  <h3>第一個進池，請加注</h3>
  <p>如果前面的人都棄牌，你想玩這手牌，標準做法是<b>加注（開池）</b>，而不是只跟盲注（平跟、limp）。加注有三個好處：</p>
  <ol><li>取得<b>主動權</b>，翻後可以先下注（在翻牌圈繼續下注，稱為「持續下注」，階段 3 會學）。</li><li>有機會<b>讓盲注直接棄牌</b>，贏下底池。</li><li>把底池做大，牌好時能贏更多。</li></ol>
  <p>平跟的壞處是：後面的人可以便宜進場，你也失去了「對手棄牌就直接贏」的機會，而且翻後常常沒有位置。</p>
  <h3>標準尺碼（100bb 深度）</h3>
  <table class="t"><tr><th>位置</th><th>常見開池尺碼</th></tr><tr><td>UTG ~ BTN</td><td>約 2.2–2.5bb</td></tr><tr><td>SB</td><td>約 3bb（沒位置，加大一點）</td></tr></table>
  <h3>偷盲的數學</h3>
  <p>你在 BTN 加注到 2.5bb，想贏走底池裡的盲注 1.5bb（SB 0.5 + BB 1）。冒著 2.5bb 的風險贏 1.5bb，<b>只要對手棄牌的機率超過 2.5 ÷ (2.5 + 1.5) = 62.5%</b>，光靠偷盲就不虧；就算被跟注，你還有牌力和位置優勢可以補。</p>
  <div class="mut">這個計算忽略被跟注後的勝率，所以是保守估計。</div>
  /*EXTRA*/<h3>三種「前面有人行動」的情況</h3>
<ul><li><b>前面都棄牌</b>：這就是「開池」，用本課的標準尺碼加注。</li>
<li><b>前面有人加注</b>：這不是開池，而是「面對加注」，要用「面對加注」階段的原則（跟注、3-bet 或棄牌）。</li>
<li><b>前面有人平跟</b>：加注要比標準尺碼再大一些（常見做法是約 3bb 再加上每位平跟者 1bb），因為多了「死錢」，也不想讓太多人便宜看牌。</li></ul>
<h3>開池之後</h3><p>你加注後，常見的三種結果：所有人棄牌（直接贏盲注）、被一個人跟注（進入翻後，見「翻後基礎」階段）、被 3-bet（見 4.4）。先想好這三條路，不要開完池才不知道怎麼辦。</p>
  ${PIT('用平跟進池；開池尺碼太大（嚇走該被你贏的人）或每次大小亂變；在前位用後位的範圍開池。')}
  ${SUMM('第一個進池就加注，約 2.2–2.5bb（SB 約 3bb）；偷盲只要對手棄牌約 62.5% 以上就不虧。')}`,
  quiz:[G_('rfi'),G_('rfi'),Q('BTN 加注到 2.5bb，想偷 1.5bb 的盲注。光靠棄牌，對手需棄牌多少才不虧？',['約 40%','約 50%','約 62.5%','約 80%'],2,'風險 2.5、獲利 1.5，打平的棄牌率 = 2.5 ÷ (2.5 + 1.5) = 62.5%。'),
        Q('前面都棄牌，你想玩手上的牌，標準做法是？',['平跟大盲','加注開池','全下','過牌'],1,'第一個進池請加注，取得主動權也能逼對手棄牌。'),
        Q('SB 的開池尺碼通常比其他位置略大，原因是？',['SB 籌碼比較多','SB 翻後沒有位置，加大一些補償','規定如此','SB 牌比較好'],1,'沒位置的劣勢要靠尺碼補回來。')]}
]};

COURSE[2]={t:'機率與賠率',goal:'會數 outs、用口訣估算、算出所需勝率',lessons:[
 {id:'2.1',t:'Outs 與 2/4 口訣',prac:[['勝率預測練習','t-eq']],
  body:()=>GOAL('知道什麼叫 outs，會用「×4、×2」估算補中的機率。')+`
  <p><b>Outs</b> 是指「補到之後，你的牌就會變成（大概率）最好牌」的剩餘牌張數。</p>
  <table class="t"><tr><th>聽牌</th><th>Outs</th><th>翻牌→河牌補中</th><th>只看下一張</th></tr>
  <tr><td>同花聽牌（差 1 張同花）</td><td>9</td><td>約 35%</td><td>約 19.6%</td></tr>
  <tr><td>兩頭順子聽牌（OESD）</td><td>8</td><td>約 31.5%</td><td>約 17.4%</td></tr>
  <tr><td>卡順（gutshot）</td><td>4</td><td>約 16.5%</td><td>約 8.7%</td></tr>
  <tr><td>兩張高牌想配對（over cards）</td><td>6</td><td>約 24%</td><td>約 13%</td></tr></table>
  <h3>2 與 4 口訣</h3>
  <ul><li><b>翻牌</b>（還有兩張牌要發）：補中機率 ≈ outs × <b>4</b>%</li><li><b>轉牌</b>（只剩一張）：補中機率 ≈ outs × <b>2</b>%</li></ul>
  ${EXAM('同花聽牌 9 outs：翻牌 9 × 4 = 36%（精確約 35%）；轉牌 9 × 2 = 18%（精確約 19.6%）。')}
  <h3>面對下注時要小心</h3>
  <p>「×4」是假設你能<b>免費</b>看到兩張牌。實戰裡，對手在翻牌下注後，你往往要再付一次錢才能看河牌。所以<b>面對下注時，用「只看下一張」（×2）比較保守</b>；除非這次下注讓你全下，才能用 ×4。</p>
  <p>另外，outs 很多（超過 8）時，×4 會略微高估，可以再減幾個百分點。</p>
  ${PIT('在翻牌面對下注就用 ×4 算（高估了補中機率）；重複計算 outs；沒想到補中後仍可能輸給對手更好的牌（例如對手有更大的同花）。')}
  ${SUMM('翻牌 ×4、轉牌 ×2；面對下注時只看下一張更保守；先數 outs，再問「補中後我還是最大嗎」。')}`,
  quiz:[Q('同花聽牌（差 1 張成同花）有幾張 outs？',['4','6','8','9'],3,'每種花色 13 張，扣掉你和公共牌已看到的 4 張，剩 9 張。'),
        Q('翻牌拿到兩頭順子聽牌（8 outs），到河牌補中的機率約為？',['16%','約 32%','約 50%','約 8%'],1,'翻牌用 ×4 口訣：8 × 4 = 32%。'),
        Q('轉牌卡順（4 outs），下一張補中的機率約為？',['4%','8%','16%','32%'],1,'轉牌用 ×2 口訣：4 × 2 = 8%（精確約 8.7%）。'),
        Q('翻牌面對下注，較保守的補牌機率算法是？',['用 ×4','只看下一張（×2）','不用算','全部用 50%'],1,'面對下注通常還要再付一次錢才能看河牌，所以只看下一張更保守。'),
        Q('你有同花聽牌，補中後仍然可能輸的原因是？',['同花沒有用','對手可能有更大的同花或更大的牌型','規則不同','不可能輸'],1,'補到不代表一定最大，要考慮對手可能的更強牌。')]},
 {id:'2.2',t:'底池賠率與所需勝率',prac:[['底池賠率練習','t-pot']],
  body:()=>GOAL('會算「跟注需要多少勝率才不虧」，並和你的補中機率比較。')+`
  <p>面對下注時，你只付出「跟注額」，就有機會贏走「底池 + 對方下注 + 你的跟注」。要不虧錢，你的勝率至少要達到：</p>
  <div class="res"><b>所需勝率 = 跟注額 ÷（底池 + 對方下注 + 跟注額）</b></div>
  ${EXAM('底池 10bb，對手下注 5bb，你要付 5bb。贏的總額是 10 + 5 + 5 = 20bb。所需勝率 = 5 ÷ 20 = <b>25%</b>。')}
  <h3>常見尺碼速查</h3><table class="t"><tr><th>對手下注</th><th>所需勝率</th></tr><tr><td>1/3 底池</td><td>20%</td></tr><tr><td>1/2 底池</td><td>25%</td></tr><tr><td>2/3 底池</td><td>28.6%</td></tr><tr><td>3/4 底池</td><td>30%</td></tr><tr><td>滿池</td><td>33%</td></tr><tr><td>2 倍底池</td><td>40%</td></tr></table>
  <h3>怎麼用？</h3>
  <p>比較你的勝率（或補中機率）和所需勝率：<b>高於它就能跟，低於它就該棄牌</b>（先不考慮隱含賠率）。</p>
  ${EXAM('翻牌你有同花聽牌（9 outs），對手下注 1/2 底池。只看下一張：19.6% 小於所需的 25%，單純看賠率不夠，除非你預期補中後還能贏更多（隱含賠率，見 3.3）。')}
  /*EXTRA*/<h3>三步驟套用</h3>
<ol><li><b>還原比例</b>：對手下注占底池多少？（5 into 10 就是 1/2 底池）</li>
<li><b>查速查表</b>：1/2 池需要 25%、2/3 池需要約 29%。</li>
<li><b>比較</b>：你的勝率（或補中機率）夠不夠？</li></ol>
${EXAM(`例 1：翻牌底池 8bb，對手下注 4bb（1/2 池），你拿頂對，估計勝率約 60%。需要 25%，遠超過 → 跟注（甚至考慮加注）。<br>例 2：轉牌你有卡順（4 outs，約 8.7%），對手下注 2/3 池，需要約 29%。差很多 → 棄牌。`)}
<h3>常見誤解</h3><p>「賠率好」不代表「一定要跟」：賠率只告訴你「要多少勝率」，你還要誠實評估自己的牌到底有多少勝率。底池很大但你的牌很弱，仍然是棄牌。</p>
  ${PIT('只看「底池很大」就跟注，沒算需要多少勝率；忘記對手下注後，底池也變大了；用 ×4 去對比所需勝率（高估）。')}
  ${SUMM('所需勝率 = 跟注額 ÷（底池 + 下注 + 跟注）；1/2 池要 25%、滿池要 33%；比較你的勝率就知道跟不跟。')}`,
  quiz:[G_('need'),G_('need'),G_('need'),Q('底池 20bb，對手下注 10bb（1/2 池）。所需勝率是？',['20%','25%','33%','40%'],1,'10 ÷ (20 + 10 + 10) = 25%。')]},
 {id:'2.3',t:'最低防守頻率與詐唬比例',prac:[['底池賠率練習','t-pot']],
  body:()=>GOAL('知道為什麼不能一遇到下注就棄牌，並理解下注方的詐唬比例。')+`
  <p>如果你面對下注總是棄牌太多，對手可以<b>用任何牌（包括垃圾牌）下注都賺錢</b>。為了讓對手無法無腦詐唬，你需要「守住」一定比例的牌：</p>
  <div class="res"><b>最低防守頻率（MDF）= 底池 ÷（底池 + 下注）</b></div>
  <table class="t"><tr><th>對手下注</th><th>MDF（要守住的比例）</th><th>對手的平衡詐唬佔比</th></tr><tr><td>1/3 底池</td><td>75%</td><td>20%</td></tr><tr><td>1/2 底池</td><td>67%</td><td>25%</td></tr><tr><td>滿池</td><td>50%</td><td>33%</td></tr></table>
  <p>下注方的「平衡詐唬比例」＝下注 ÷（底池 + 2×下注）：1/2 底池下注 → 25% 詐唬、75% 價值。這是下注方為了讓你「跟或棄都差不多」而設計的比例。</p>
  <div class="mut">這是理論上的均衡概念。實戰中，對手的類型會讓你做調整（第 6 級會學）；新手先理解「不能過度棄牌」就夠了。</div>
  /*EXTRA*/<h3>實戰中怎麼用？</h3>
<ul><li><b>面對小注不要輕易棄牌</b>：對手下注 1/3 池，你整體要守住約 75% 的牌，只有最弱的 1/4 可以棄。</li>
<li><b>面對大注可以棄更多</b>：滿池下注只需守住 50%。</li>
<li><b>範圍裡「強牌加注、中等牌跟注、最弱的牌棄牌」</b>，這樣整體就能守住足夠的比例。</li></ul>
${EXAM(`想像面對 1/3 池下注的情境出現 100 次，每次你拿到不同的牌：你大約有 75 次應該跟注或加注，只有約 25 次（最弱的牌）可以棄牌。如果你有 60 次棄牌，對手用任何牌下注都賺錢。`)}
  ${PIT('只要對手下注就棄牌，變成大家都能欺負你；把 MDF 當成「每次都要跟」（它只是指整體範圍要守住的比例）。')}
  ${SUMM('對手下注越大，你要守的比例越低（1/3 池守 75%、滿池守 50%）；過度棄牌會被詐唬剝削。')}`,
  quiz:[Q('底池 100bb，對手下注 100bb（滿池）。你的最低防守頻率約為？',['25%','33%','50%','67%'],2,'MDF = 100 ÷ (100 + 100) = 50%。'),
        Q('對手下注 1/3 底池，你的最低防守頻率約為？',['50%','67%','75%','90%'],2,'MDF = 1 ÷ (1 + 1/3) = 75%。'),
        Q('下注 1/2 底池時，平衡的詐唬牌約佔下注範圍的比例是？',['10%','25%','33%','50%'],1,'0.5 ÷ (1 + 2×0.5) = 25%。'),
        Q('如果你每次面對下注都棄牌，會發生什麼事？',['沒事','對手用任何牌下注都賺錢','你一定贏','對手會棄牌'],1,'過度棄牌讓對手的詐唬獲利。')]},
 {id:'2.4',t:'隱含賠率與實現率',prac:[['勝率預測練習','t-eq']],
  body:()=>GOAL('理解「隱含賠率」與「實現率」，知道為什麼有些牌賠率不夠也能跟。')+`
  <p>前面的所需勝率只看「目前」的底池。但如果你補中後，還能從對手身上贏<b>更多</b>錢，就多了<b>隱含賠率</b>，實際上可以跟得更寬。</p>
  <h3>隱含賠率高的情境</h3><ul><li>籌碼很深（後面還有很多錢可以贏）。</li><li>你補中的牌很隱蔽（例如暗三條、同花聽牌補中但牌面不明顯）。</li><li>對手是愛付錢的類型（很少棄牌）。</li></ul>
  <h3>反隱含賠率</h3><p>如果你補中仍可能輸給更大的牌（例如較小的同花輸給較大的同花），補中也不一定賺，要打折扣。</p>
  <h3>實現率</h3><p>勝率是「打到河牌的理論勝率」，但實際上你會被逼棄牌，或沒位置被壓制，無法完整「實現」。<b>在位置上、籌碼深的牌</b>實現率高；<b>沒位置的雜牌</b>實現率低，同樣的勝率，沒位置要更保守。</p>
  /*EXTRA*/<h3>挖三條（set mining）的經驗法則</h3>
<p>拿 22–66 這類小對子跟注開池，主要靠翻牌中三條（約 12%）。因為中了才賺大錢，所以要求「<b>後面的籌碼夠深</b>」：常見經驗法則是有效籌碼約為跟注額的 15 倍以上才划算（各說法略有不同）。籌碼太淺時，即使中三條也贏不到多少。</p>
${EXAM(`你有 77，有位置，對手開池 2.5bb、有效籌碼 100bb（是跟注額 2.5bb 的 40 倍）：隱含賠率很高，可以跟注挖三條。如果有效籌碼只剩 15bb（是跟注額的 6 倍），就不划算。`)}
<h3>什麼時候別靠隱含賠率？</h3><p>當對手很緊（中了也不給你錢）、籌碼很淺、或你沒位置而且容易被擠出時，不要用隱含賠率當藉口。</p>
  ${PIT('把隱含賠率當成「什麼聽牌都能跟」的藉口；沒位置還用邊緣牌防守；忘記對手可能補中更大的牌。')}
  ${SUMM('賠率不夠時，隱含賠率（深籌碼、隱蔽牌、愛付錢的對手）可以補一點；沒位置、雜牌要更保守。')}`,
  quiz:[Q('下列哪個情況隱含賠率最高？',['籌碼很淺','對手不會再付錢','籌碼深且補中的牌很隱蔽','牌面很危險'],2,'籌碼深、牌隱蔽，補中後能贏到更多。'),
        Q('「實現率」較低的是哪種情況？',['有位置、手牌連張同花','沒位置、手牌雜牌','按鈕位拿對子','籌碼很深的同花連張'],1,'沒位置的雜牌容易被逼棄牌，無法完整實現勝率。'),
        Q('決定要不要跟注時，除了所需勝率，還應考慮哪些因素？',['只需看底池大小','隱含賠率、位置、對手類型','只看手牌好壞','不需要考慮'],1,'隱含賠率、位置與對手類型都會影響實際期望值。'),
        Q('籌碼很淺時，隱含賠率會？',['變高','變低','不變','消失但勝率變高'],1,'後面可贏的錢變少，隱含賠率下降。')]}
]};

COURSE[3]={t:'面對加注',goal:'會 3-bet、跟注、BB 防守，並懂得被 3-bet 時怎麼處理',lessons:[
 {id:'3.1',t:'3-bet：價值牌與詐唬牌',prac:[['面對加注練習','t-learn']],
  body:()=>GOAL('知道什麼是 3-bet，會分辨價值 3-bet 與詐唬 3-bet，並知道尺碼。')+`
  <p>有人開池後再加注，叫做 <b>3-bet</b>（大盲算第一次下注、開池是 2-bet、再加注就是 3-bet）。</p>
  <h3>價值 3-bet</h3><p>用強牌加注，希望被較弱的牌跟注：QQ 以上、AK 為主。</p>
  <h3>詐唬 3-bet</h3>
  <p>用有潛力但不夠強的牌加注，讓你的範圍裡有詐唬牌，對手就不能一遇到加注就輕鬆棄牌：</p>
  <ul><li><b>A5s、A4s</b>：有 A 的阻擋效果（對手更少有 AA、AK），又有同花與輪子順子的潛力，被跟注時也還有勝率。</li><li>少數同花連張（如 76s）。</li></ul>
  <h3>尺碼</h3><p>有位置約開池的 <b>3 倍</b>；沒位置（SB/BB）約 <b>4 倍</b>，因為翻後沒位置要多收錢。例：BTN 開 2.5bb，BB 3-bet 到約 10bb。</p>
  /*EXTRA*/<h3>3-bet 前的檢查步驟</h3>
<ol><li><b>對手開池位置</b>：越前面，範圍越強，你的 3-bet 要越緊。</li><li><b>我有沒有位置</b>：沒位置（SB/BB）更傾向 3-bet 或棄牌，很少只跟注。</li>
<li><b>我的牌屬於哪一類</b>：價值、詐唬，還是適合跟注？</li><li><b>尺碼</b>：有位置約 3 倍、沒位置約 4 倍。</li>
<li><b>先想好被 4-bet 怎麼辦</b>：強牌繼續，詐唬牌多半棄牌。</li></ol>
<div class="mut">本練習器的簡化範圍：BB 對 BTN 3-bet 約 4%，SB 對 BTN 約 7.5%（SB 沒位置，更傾向 3-bet 或棄牌）。實戰常見圖表可能更寬一些。</div>
  ${PIT('用「看起來不錯」的牌（如 KJo、A9o）3-bet 詐唬，被跟注後沒有好路線；3-bet 尺碼太小，讓對手輕鬆跟注。')}
  ${SUMM('價值 3-bet：QQ+、AK；詐唬 3-bet：A5s、A4s 等有阻擋牌的牌；有位置 3 倍、沒位置 4 倍。')}`,
  quiz:[Q('下列哪手牌最適合當「詐唬 3-bet」？',['QQ','AKo','A5s','JJ'],2,'A5s 有阻擋效果且有同花、順子潛力，被跟注時也還有勝率。'),
        Q('BTN 開 2.5bb，BB 想 3-bet，常見尺碼約為？',['約 5bb','約 7bb','約 10–11bb','約 30bb'],2,'沒位置約 4 倍開池：2.5 × 4 = 10bb。'),
        Q('為什麼要在 3-bet 範圍中放詐唬牌？',['為了好玩','讓對手不能只靠棄牌就輕易應付你的加注','因為規則要求','讓底池變小'],1,'平衡的範圍讓對手對你的加注難以調整。'),
        Q('有位置時 3-bet 的尺碼通常是開池的？',['約 1.5 倍','約 3 倍','約 8 倍','全下'],1,'有位置約 3 倍，沒位置約 4 倍。')]},
 {id:'3.2',t:'跟注還是 3-bet？',prac:[['面對加注練習','t-learn']],
  body:()=>GOAL('學會依牌力與位置，在棄牌、跟注、3-bet 之間做選擇。')+`
  <p>面對加注時有三個選擇：棄牌、跟注、3-bet。</p>
  <ul><li><b>強牌</b>（QQ 以上、AK）：3-bet 為主，偶爾跟注。</li>
  <li><b>中等牌</b>（77–TT、AQ、KQs、同花連張）：<b>跟注</b>為主。這些牌勝率不錯，但被 4-bet 時不好辦，所以不一定要 3-bet。</li>
  <li><b>弱牌</b>：棄牌，或偶爾拿來當詐唬 3-bet。</li></ul>
  <h3>位置的影響</h3>
  <ul><li><b>有位置</b>（BTN 面對 CO）：可以跟注更多牌，因為翻後你最後行動。</li>
  <li><b>沒位置</b>（SB 面對 BTN）：跟注的「實現率」差，而且後面還有 BB 可能再加注，所以傾向<b>「3-bet 或棄牌」</b>，很少只跟注。</li></ul>
  ${EXAM('你在 BTN 拿 77，CO 開池 2.5bb。77 在這裡通常跟注（有位置、想中三條）。如果換成 SB 拿 77 面對 BTN 開池，沒位置又有 BB 在後，常見處理是 3-bet 或棄牌，只跟注比較吃虧。')}
  /*EXTRA*/<h3>三個典型情境</h3>
<table class="t"><tr><th>情境</th><th>常見處理</th></tr>
<tr><td>BTN 拿 77，CO 開池</td><td>多半跟注（有位置、想中三條）</td></tr>
<tr><td>SB 拿 77，BTN 開池</td><td>多半 3-bet 或棄牌，只跟注比較吃虧</td></tr>
<tr><td>BTN 拿 A5s，CO 開池</td><td>可作詐唬 3-bet（有阻擋牌），也可偶爾跟注</td></tr></table>
<p>加注（3-bet）前，永遠先想好：<b>如果被 4-bet，我要怎麼辦？</b>如果答案是「棄牌」，那這手牌就必須有足夠的棄牌收益（對手常棄牌）才適合當詐唬。</p>
  ${PIT('用中等牌亂 3-bet，被 4-bet 後被迫棄牌；在沒位置時用邊緣牌跟注。')}
  ${SUMM('強牌 3-bet、中等牌跟注、弱牌棄牌；有位置可以多跟，沒位置傾向 3-bet 或棄牌。')}`,
  quiz:[Q('在 BTN 面對 CO 的開池加注，77 通常怎麼打？',['必定 3-bet','主要以跟注為主','必定棄牌','全下'],1,'中等對子在有位置時，跟注看翻牌的價值很高。'),
        Q('SB 面對 BTN 的開池，為什麼很少只跟注？',['規則不允許','沒位置、後面還有 BB，跟注實現率差','SB 籌碼太少','SB 手牌比較好'],1,'沒位置又有 BB 在後，傾向 3-bet 或棄牌。'),
        Q('強牌（如 QQ、AK）面對開池，主要做法是？',['3-bet','必定棄牌','過牌','每次都只跟注'],0,'強牌 3-bet 取價值，是標準打法。'),
        Q('「實現率」差的情況是？',['有位置','沒位置、雜牌','牌很強','籌碼很深'],1,'沒位置的雜牌很難完整實現勝率。')]},
 {id:'3.3',t:'BB 防守與底池賠率',prac:[['面對加注練習','t-learn']],
  body:()=>GOAL('知道為什麼大盲可以防守得最寬，並會算大盲面對開池的所需勝率。')+`
  <p>大盲已經投入了 1bb，面對開池時價格最便宜，所以防守範圍是所有位置中最寬的。</p>
  <h3>算算看：BB 面對 BTN 開 2.5bb</h3><ul><li>底池 = 2.5（BTN）+ 1（你的 BB）+ 0.5（SB）= <b>4bb</b></li><li>你只需再付 <b>1.5bb</b></li><li>所需勝率 = 1.5 ÷ (4 + 1.5) ≈ <b>27%</b></li></ul>
  <p>27% 的勝率門檻很低，所以 BB 對 BTN 可以防守相當多的牌（本練習器為偏保守的簡化版，大約 45%，實戰常見的圖表會更寬）。</p>
  <h3>對不同位置的調整</h3><p>對手位置越前，開池範圍越緊、越強，你的防守範圍也要隨之收緊：BB 對 UTG 防守的牌明顯少於對 BTN。</p>
  <div class="mut">還要考慮翻後沒位置的實現率，所以不會 100% 防守所有賠率達標的牌。</div>
  /*EXTRA*/<h3>本練習器的 BB 對 BTN 跟注範圍（簡化）</h3>
<p>大致包含：22 以上的所有對子、A2s 以上與 K2s 以上的同花牌、許多同花連張（如 54s、64s、75s…）、A2o 以上與一些 K、Q、J、T 的非同花高牌（如 K8o、Q9o、J9o、T8o）。垃圾牌如 72o、83o 仍然棄牌。</p>
<div class="mut">這是偏保守的簡化版（約 45%），實戰常見圖表會更寬。重點不是背範圍，而是理解「BB 價格便宜、所以可以多跟」。</div>
<h3>防守時的思考</h3><ol><li>算所需勝率（約 27%）。</li><li>這手牌翻後好不好打？同花、連張、對子容易做出牌，Ax 同花也不錯。</li><li>對手位置越前，範圍越強，要收緊。</li></ol>
  ${PIT('覺得「已經投了 1bb 所以一定要跟」（沒有算整體賠率；已投入的是沉沒成本）；對任何位置都用同一個防守範圍。')}
  ${SUMM('BB 價格最便宜、防守最寬；對 BTN 防守寬、對 UTG 防守窄；所需勝率約 27%。')}`,
  quiz:[Q('BB 面對 BTN 開 2.5bb（SB 已投 0.5），你跟注的所需勝率約為？',['約 15%','約 27%','約 40%','約 50%'],1,'1.5 ÷ (4 + 1.5) ≈ 27%。'),
        Q('BB 防守範圍通常比其他位置面對開池時如何？',['更窄','一樣','更寬','不能防守'],2,'已投入 1bb，價格最便宜，防守最寬。'),
        Q('BB 面對 UTG 的開池，防守範圍會比面對 BTN 時？',['更寬','更窄','完全相同','不需要考慮'],1,'UTG 的範圍較強，所以要收緊。'),
        Q('「已經投了 1bb，所以要跟」這個想法的問題是？',['沒有問題','忽略了已投入是沉沒成本，應只看後續的賠率','1bb 太多','BB 不能棄牌'],1,'已投入的籌碼不會因為你跟注而回來，要看的是後續的期望值。')]},
 {id:'3.4',t:'被 3-bet 了怎麼辦',prac:[['面對加注練習','t-learn'],['模擬比賽','t-sim']],
  body:()=>GOAL('知道自己開池後被 3-bet 時，該 4-bet、跟注還是棄牌。')+`
  <p>你開池之後，後面的人 3-bet。你的選擇一樣是三個，但原則是：<b>大多數牌要棄牌</b>，因為對手的 3-bet 範圍通常比你的開池範圍強。</p>
  <table class="t"><tr><th>你的牌</th><th>常見處理</th></tr>
  <tr><td>KK、AA、AK（強牌）</td><td>4-bet 取價值（有時 AA、KK 也會跟注誘導）</td></tr>
  <tr><td>QQ、JJ、TT、AQs 等</td><td>通常跟注（有位置時更適合）；沒位置時可考慮 4-bet 或棄牌</td></tr>
  <tr><td>A5s 等有阻擋牌的牌</td><td>少數頻率 4-bet 詐唬，其餘棄牌</td></tr>
  <tr><td>其他（如 KJo、QTs、小對子）</td><td>多半棄牌</td></tr></table>
  <h3>4-bet 尺碼</h3><p>面對 3-bet（例如 10bb），4-bet 常見約 22–25bb。4-bet 後底池很大、籌碼變淺，很多時候已接近全下。</p>
  <h3>面對 4-bet 以上</h3><p>基本上只用最強的牌（AA、KK、AK 這類）繼續，其他棄牌。</p>
  /*EXTRA*/<h3>兩個例子</h3>
${EXAM(`例 1：你在 CO 開 2.5bb，BTN 3-bet 到 7.5bb（有位置，約 3 倍）。你拿 AQs：多半跟注（你沒位置、牌力不錯）或少數頻率 4-bet；你拿 KJo：棄牌。`)}
${EXAM(`例 2：你開池、對手 3-bet、你 4-bet 到約 22bb，對手再全下（5-bet）。這時你只用 AA、KK（和部分 AKs）繼續，其餘棄牌，即使你已經投入很多也一樣。`)}
<h3>事前就要有計畫</h3><p>每次開池之前，就該知道「被 3-bet 時我會 4-bet 哪些牌、跟注哪些牌、棄牌哪些牌」。臨場才想會很容易情緒化。</p>
  ${PIT('開池之後被 3-bet 就覺得「不甘心」而一直跟注；用不夠強的牌 4-bet 再被全下；不分位置地用同一方式面對 3-bet。')}
  ${SUMM('被 3-bet 時多數牌棄牌；強牌 4-bet、中等強牌跟注；4-bet 之後只有最強的牌繼續。')}`,
  quiz:[Q('你在 CO 開池，BTN 3-bet。你拿 KJo，通常？',['4-bet','跟注','棄牌','全下'],2,'KJo 容易被支配，面對 3-bet 多半棄牌。'),
        Q('被 3-bet 時，大多數牌的處理是？',['全部跟注','多數棄牌','全部 4-bet','全部全下'],1,'對手的 3-bet 範圍通常比你的開池範圍強，所以多數牌棄牌。'),
        Q('面對 4-bet 以上，通常用哪些牌繼續？',['任何對子','只有最強的牌（AA、KK、AK 這類）','所有同花','所有 A'],1,'4-bet 範圍很強，只用最強的牌繼續。'),
        Q('下列哪一手有位置、適合「跟注 3-bet」？',['72o','QQ（有位置）','J4o','83s'],1,'中強的對子在有位置時，常用跟注看翻牌。')]}
]};

COURSE[4]={t:'翻後基礎',goal:'學會持續下注、價值下注、聽牌打法與牌面判讀，並避免新手常見錯誤',lessons:[
 {id:'4.1',t:'牌面結構與範圍優勢',prac:[['模擬比賽（從翻牌開始）','t-sim'],['看示範牌局','t-demo']],
  body:()=>GOAL('會判斷牌面是乾燥還是濕潤，並知道誰在這張牌面「範圍優勢」比較大。')+`
  <h3>牌面分類</h3><table class="t"><tr><th>類型</th><th>例子</th><th>特色</th></tr>
  <tr><td><b>乾燥面</b></td><td>K♠ 7♦ 2♣</td><td>不連張、不同花，牌力不容易改變</td></tr>
  <tr><td><b>濕潤面</b></td><td>J♥ T♥ 9♣</td><td>連張、同花聽牌多，牌力容易翻轉</td></tr>
  <tr><td><b>配對面</b></td><td>8♠ 8♦ 3♣</td><td>有人可能有三條，大部分人沒有太多牌力</td></tr></table>
  <h3>範圍優勢</h3>
  <p>翻前加注的人，範圍裡有較多 AA、KK、AK 這類強牌，所以在 <b>A、K 高的牌面</b>通常有「範圍優勢」。而跟注者的範圍有較多中低連張，在<b>低連牌面</b>反而不吃虧。</p>
  <ul><li>有範圍優勢 → 可以<b>高頻率、小尺碼</b>下注。</li><li>沒有範圍優勢 → 多<b>過牌</b>，只用強牌和好聽牌下注。</li></ul>
  /*EXTRA*/<h3>牌面分類練習</h3>
<table class="t"><tr><th>牌面</th><th>類型</th><th>誰比較占優勢？怎麼打？</th></tr>
<tr><td>A♠ 7♦ 2♣</td><td>乾燥、A 高</td><td>翻前加注者（有較多 A）；高頻率小注</td></tr>
<tr><td>9♥ 8♥ 7♣</td><td>濕潤、連張</td><td>跟注者也有很多順子聽牌與成牌；加注者應更謹慎，只用強牌與好聽牌下注</td></tr>
<tr><td>K♦ K♣ 5♠</td><td>配對面</td><td>加注者較有 K；常用小注高頻率</td></tr>
<tr><td>6♠ 5♠ 4♦</td><td>濕潤、低連張</td><td>跟注者範圍有許多 65、54、76 等；加注者沒有優勢，多過牌</td></tr></table>
  ${PIT('不看牌面就一律持續下注；在濕潤、對手容易有聽牌的牌面用小注，讓對手便宜看到下一張。')}
  ${SUMM('先看牌面：乾燥或濕潤？誰的範圍占優勢？再決定下注的頻率與尺碼。')}`,
  quiz:[Q('J♥T♥9♣ 屬於哪種牌面？',['乾燥','濕潤（聽牌多）','配對','很安全'],1,'連張、同花聽牌多，牌力容易翻轉。'),
        Q('翻前加注者在 A♠7♦2♣ 這種牌面通常？',['沒有範圍優勢','有範圍優勢，可高頻小注','必定過牌','不能下注'],1,'加注者範圍內有較多 A 與強牌，通常有範圍優勢。'),
        Q('沒有範圍優勢時，比較合理的做法是？',['每次都大注','多過牌，只用強牌與好聽牌下注','全部棄牌','只跟注'],1,'範圍較弱時，要用更少、更有選擇的牌下注。'),
        Q('K♠7♦2♣ 屬於？',['濕潤面','乾燥面','配對面','同花面'],1,'沒有連張也沒有同花聽牌，是乾燥面。')]},
 {id:'4.2',t:'持續下注（c-bet）',prac:[['模擬比賽（從翻牌開始）','t-sim'],['看示範牌局','t-demo']],
  body:()=>GOAL('知道什麼時候該持續下注、用多大，什麼時候該過牌。')+`
  <p><b>持續下注（continuation bet，c-bet）</b>是指翻前加注者，在翻牌圈繼續下注。因為你在翻前展示了強度，對手多半沒中，所以常能直接贏下底池。</p>
  <h3>基本原則</h3><ul>
  <li><b>乾燥牌面</b>：小尺碼（約 1/3 底池）、高頻率。</li>
  <li><b>濕潤牌面</b>：尺碼較大、頻率較低，用強牌與好聽牌下注，其他多過牌。</li>
  <li><b>多人底池</b>：少 c-bet，因為有人中牌的機率更高。</li>
  <li><b>有位置</b>時 c-bet 的選擇更有彈性，沒位置時更需謹慎。</li></ul>
  <h3>下注前先問三個問題</h3><ol><li>我想讓<b>更差的牌付錢</b>嗎？（價值）</li><li>我想讓<b>更好的牌棄牌</b>嗎？（詐唬）</li><li>我想<b>保護自己的牌</b>不被免費補牌嗎？（保護）</li></ol>
  <p>三個都不是，就先過牌。</p>
  /*EXTRA*/<h3>什麼時候放棄持續下注？</h3>
<ul><li><b>多人底池</b>：有 3 人以上看翻牌，沒有好牌就放棄。</li><li><b>濕潤牌面而你是空氣</b>：對手容易有聽牌或對子，詐唬成功率低。</li><li><b>對手是很愛跟注的類型</b>：詐唬沒用，只用價值牌下注。</li></ul>
<h3>第二槍（轉牌）怎麼決定？</h3>
<ol><li>轉牌卡對我有利嗎？（讓對手的範圍變弱、或我補中了聽牌）</li><li>我的牌還有價值嗎？（頂對、強聽牌）</li><li>我是否有好的理由讓對手棄牌？沒有就控制底池。</li></ol>
  ${PIT('每次翻牌都 c-bet（尤其多人底池與濕潤牌面）；被跟注後轉牌沒有計畫，只會「繼續打」。')}
  ${SUMM('乾燥面小注高頻、濕潤面少而大；多人少打；下注要有目的：價值、詐唬、保護。')}`,
  quiz:[Q('在乾燥牌面（K♠7♦2♣）上，翻前加注者常用的 c-bet 是？',['極少下注','高頻率、小尺碼','每次都全下','只用最強牌'],1,'乾燥牌面範圍優勢明顯，小注就能獲利。'),
        Q('多人底池中，c-bet 頻率通常會？',['提高','降低','不變','改成全下'],1,'人越多，有人中牌的機率越高，詐唬成功率低。'),

 {id:'4.3',t:'價值下注與尺碼',prac:[['模擬比賽（從翻牌開始）','t-sim'],['看示範牌局','t-demo']],
  body:()=>GOAL('知道什麼是價值下注，並學會判斷尺碼。')+`
  <p><b>價值下注</b>是指拿著好牌下注，希望被<b>更差的牌</b>跟注。</p>
  <h3>選尺碼的核心問題</h3><p>「我能下注多大，而仍然會被更差的牌跟注？」尺碼太大，只有比你強的牌會跟；太小，則錯失價值。</p>
  <ul><li><b>薄價值</b>：頂對好踢腳、中對等，在乾燥牌面河牌下小注（約 1/3–1/2 底池）。</li>
  <li><b>強牌</b>：在濕潤牌面要下大一點，同時避免讓對手便宜看到聽牌。</li>
  <li><b>河牌極化範圍</b>：只剩堅果牌與詐唬牌時，可用大注（3/4 底池到滿池）。</li></ul>
  ${EXAM('你有 A♠K♦，公共牌 K♣ 8♦ 3♠ 5♥ 2♦。河牌你有頂對頂踢腳，對手可能有 K 帶小踢腳、8x、小對子。下注約 1/2 底池，就能收到這些牌的價值。')}
  /*EXTRA*/<h3>尺碼速查</h3>
<table class="t"><tr><th>尺碼（占底池）</th><th>適合什麼用途</th></tr>
<tr><td>約 1/3</td><td>乾燥面持續下注、收薄價值</td></tr><tr><td>約 1/2</td><td>標準價值下注，兼顧保護</td></tr>
<tr><td>約 2/3</td><td>濕潤面的強牌、同時防止對手便宜看牌</td></tr><tr><td>3/4 到滿池</td><td>河牌極化範圍（堅果牌或詐唬）</td></tr></table>
<h3>河牌的三個問題</h3><ol><li>有<b>更差的牌</b>會跟注嗎？（有才價值下注）</li><li>有<b>更好的牌</b>會棄牌嗎？（沒有的話，詐唬沒用）</li><li>這個尺碼，更差的牌還願意跟嗎？</li></ol>
  ${PIT('拿到不錯的牌卻因為怕被加注而過牌（錯失價值）；尺碼大到只有更強的牌會跟。如果有大量更差的牌會跟你，下注才是對的。')}

        Q('河牌圈你有頂對好踢腳、牌面乾燥，常見的做法是？',['必定過牌','小到中尺碼薄價值下注','全下','棄牌'],1,'乾燥牌面頂對常能被更差的對子跟注，值得下注。'),
        Q('選價值下注尺碼時，最關鍵的問題是？',['對手長相','最大尺碼下仍會被更差牌跟注','今天有多少籌碼','隨機'],1,'尺碼要讓更差的牌仍願意跟。'),
        Q('拿到不錯的牌卻因為怕被加注而過牌，問題是？',['沒有問題','可能錯失價值','一定會輸','會被罰錢'],1,'如果有大量更差牌會跟，過牌就等於少賺。')]},
 {id:'4.4',t:'聽牌與半詐唬',prac:[['模擬比賽（從翻牌開始）','t-sim']],
  body:()=>GOAL('知道什麼聽牌適合半詐唬，並理解半詐唬的兩種獲利來源。')+`
  <p><b>半詐唬</b>：用還沒成牌的聽牌下注或加注。它有兩種獲利來源：</p>
  <ol><li><b>棄牌收益</b>：對手棄牌，你直接贏池。</li><li><b>補牌收益</b>：被跟注時，你還有機會補中。</li></ol>
  <h3>什麼聽牌適合半詐唬？</h3>
  <ul><li><b>強聽牌</b>（同花 + 順子，約 12–15 outs）：常常直接加注，因為勝率接近領先的牌。</li>
  <li><b>普通聽牌</b>（單純同花聽牌、兩頭順子）：可以下注，也可以過牌跟注。</li>
  <li><b>弱聽牌</b>（卡順）：多半只在對手容易棄牌時才當詐唬。</li></ul>
  <p>另外，<b>有阻擋牌</b>（如手握 A、讓對手更少有堅果）的聽牌更適合當詐唬。</p>
  /*EXTRA*/<h3>半詐唬前的檢查清單</h3>
<ol><li><b>聽牌夠強嗎？</b>（越多 outs 越適合）</li><li><b>對手會棄牌嗎？</b>（愛跟注的對手，棄牌收益很低）</li>
<li><b>我有位置嗎？</b>有位置時，被跟注後也比較好打。</li><li><b>籌碼深度</b>：籌碼淺時，半詐唬加注常直接變成全下，壓力更大。</li><li>被反加注怎麼辦？先想好，賠率夠就跟，不夠就棄牌。</li></ol>
${EXAM(`你有 A♥6♥，翻牌 K♥ 9♥ 4♣：你有同花聽牌（9 outs）加上 A 高牌。對手下注，你加注：如果對手棄牌，你直接贏；如果對手跟注，你仍有約三分之一的機會補中同花。這就是半詐唬兩種獲利來源同時存在。`)}
  ${PIT('聽牌賠率不夠還一直跟注；每次聽牌都詐唬，沒想過對手是不是很會跟注。')}
  ${SUMM('半詐唬 = 棄牌收益 + 補牌收益；強聽牌可加注，弱聽牌多半只看賠率。')}`,
  quiz:[Q('半詐唬有哪兩種獲利來源？',['棄牌收益與補牌收益','只有棄牌收益','只有補牌收益','都沒有'],0,'對手棄牌直接贏，被跟注也有機會補中。'),
        Q('同花 + 順子的強聽牌（約 15 outs）通常適合？',['直接棄牌','常常加注（強半詐唬）','永遠過牌','只能跟注'],1,'勝率接近領先牌，加注能同時獲得棄牌收益與補牌收益。'),

        Q('對手是「很愛跟注」的類型時，半詐唬的棄牌收益會？',['增加','減少','不變','消失但補牌收益增加'],1,'對手很少棄牌，棄牌收益就變少。')]},

}

function dailyGet(){
  const t=new Date().toISOString().slice(0,10);
  try{const j=JSON.parse(localStorage.getItem('gtoDaily')||'null');if(j&&j.d===t)DAILY=j}catch(e){}

/* ---- 2. 名詞：文中點一下看定義 + 每課「本課新名詞」 ---- */
const TERM_LIST=[];
GLOSSARY.forEach(g=>{
  const key=g[0],al=new Set(key.split('／').map(s=>s.trim()).filter(Boolean));
  String(g[1]).split(/[\/\s]+/).forEach(t=>{if(/^[A-Za-z0-9\-\+&]+$/.test(t)&&t.length>=2&&((t===t.toUpperCase()&&/[A-Z]/.test(t))||t.includes('-')||t==='outs'))al.add(t)});
  (({'期望值':['EV'],'勝率':['equity']})[key]||[]).forEach(a=>al.add(a));
  al.forEach(a=>TERM_LIST.push({a,key,en:g[1],d:g[2]}));
});
const TERM_BY_A=new Map(TERM_LIST.map(t=>[t.a,t])),TERM_BY_KEY=new Map(GLOSSARY.map(g=>[g[0],{key:g[0],en:g[1],d:g[2]}]));
const TERM_RE=new RegExp(TERM_LIST.slice().sort((x,y)=>y.a.length-x.a.length).map(t=>t.a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
const isAsc=s=>/^[A-Za-z0-9]/.test(s),isAlnum=c=>!!c&&/[A-Za-z0-9\-]/.test(c);
function findTerms(txt){
  const out=[];TERM_RE.lastIndex=0;let m;
  while((m=TERM_RE.exec(txt))){
    const t=TERM_BY_A.get(m[0]);if(!t)continue;
    if(isAsc(m[0])&&(isAlnum(txt[m.index-1])||isAlnum(txt[m.index+m[0].length])))continue;
    out.push({t,i:m.index,len:m[0].length});
  }
  return out;
}
function annotateTerms(root){
  if(!root)return;
  const seen=new Set(),nodes=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  while(w.nextNode())nodes.push(w.currentNode);
  const skip=el=>el.closest('.opt,.ql,code,.term,a,button,input,textarea,select,.tag,h2,.why,#termpop,.newterms');
  for(const tn of nodes){
    const p=tn.parentElement;if(!p||skip(p))continue;
    const txt=tn.nodeValue,hits=findTerms(txt).filter(h=>{if(seen.has(h.t.key))return false;seen.add(h.t.key);return true});
    if(!hits.length)continue;
    const frag=document.createDocumentFragment();let last=0;
    hits.forEach(h=>{
      frag.appendChild(document.createTextNode(txt.slice(last,h.i)));
      const sp=document.createElement('span');sp.className='term';sp.tabIndex=0;sp.setAttribute('role','button');sp.dataset.k=h.t.key;
      sp.setAttribute('aria-label','名詞解釋：'+h.t.key);sp.textContent=txt.substr(h.i,h.len);frag.appendChild(sp);last=h.i+h.len;
    });
    frag.appendChild(document.createTextNode(txt.slice(last)));tn.parentNode.replaceChild(frag,tn);
  }
}
(function termPopup(){
  const pop=document.createElement('div');pop.id='termpop';pop.setAttribute('role','tooltip');pop.style.display='none';document.body.appendChild(pop);
  function hide(){pop.style.display='none'}
  function show1(el){
    const t=TERM_BY_KEY.get(el.dataset.k);if(!t)return;
    pop.innerHTML='<b>'+t.key+'</b> <span class="mut">'+t.en+'</span><div>'+t.d+'</div><a href="#" onclick="hideTerm();show(\'t-guide\');return false">到速查手冊查看全部術語</a>';
    pop.style.display='block';
    const r=el.getBoundingClientRect(),w=Math.min(300,innerWidth-24);pop.style.width=w+'px';
    let left=Math.max(12,Math.min(innerWidth-w-12,r.left)),top=r.bottom+6;
    if(top+pop.offsetHeight>innerHeight-8)top=Math.max(8,r.top-pop.offsetHeight-6);
    pop.style.left=left+'px';pop.style.top=top+'px';
  }
  window.hideTerm=hide;
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('.term');if(a){e.preventDefault();show1(a)}else if(!(e.target.closest&&e.target.closest('#termpop')))hide()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')hide();
    if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.classList.contains('term')){e.preventDefault();show1(document.activeElement)}
  });
  window.addEventListener('scroll',hide,{passive:true});
})();
let NEWT=null;
function computeNewTerms(){
  NEWT={};const seen=new Set();
  COURSE.forEach(L=>L.lessons.forEach(x=>{
    const tmp=document.createElement('div');tmp.innerHTML=typeof x.body==='function'?x.body():x.body;
    const hits=findTerms(tmp.textContent),order=[];
    hits.forEach(h=>{if(!order.includes(h.t.key))order.push(h.t.key)});
    NEWT[x.id]=order.filter(k=>!seen.has(k));order.forEach(k=>seen.add(k));
  }));
}
function newTermsBox(id){
  if(!NEWT)computeNewTerms();
  const keys=(NEWT[id]||[]);if(!keys.length)return '';
  const shown=keys.slice(0,12);
  return '<div class="newterms"><b>📖 本課會出現的新名詞</b>'+shown.map(k=>{const t=TERM_BY_KEY.get(k);return '<div><b>'+t.key+'</b>'+(/[一-鿿]/.test(t.en)?'':' <span class="mut">'+t.en+'</span>')+'：'+t.d+'</div>'}).join('')+
    (keys.length>shown.length?'<div class="mut">…還有 '+(keys.length-shown.length)+' 個，文中點虛線字詞或查速查手冊。</div>':'<div class="mut">文中的虛線字詞也可以點一下查看定義。</div>')+'</div>';
}

/* ===== 翻前練習：牌桌位置圖 ===== */
const POS_ORDER={6:['UTG','HJ','CO','BTN','SB','BB'],9:['UTG','UTG1','MP','LJ','HJ','CO','BTN','SB','BB']};
const POS_ZH={UTG:'最前位',UTG1:'前位',MP:'中位',LJ:'中前位',HJ:'中後位',CO:'後位',BTN:'按鈕',SB:'小盲',BB:'大盲'};
function posDiagram(n,pos){
  const ord=POS_ORDER[n],h=ord.indexOf(pos);if(h<0)return '';
  const L=seatLayout(n),btn=ord.indexOf('BTN');
  const seats=ord.map((p,i)=>{
    const k=(i-h+n)%n,me=i===h,before=i<h&&p!=='SB'&&p!=='BB'||(i<h),after=i>h;
    const st=`left:${L[k].x.toFixed(1)}%;top:${L[k].y.toFixed(1)}%`;
    const note=me?'輪到你':after?'還沒行動':'已棄牌';
    return `<div class="seat pd ${me?'act':before?'fold':'later'}" style="${st}"><div class="box"><div class="nm"><span class="pos">${p}</span></div><div class="stk" style="font-size:11px;color:${me?'#ffd54a':'#8b9bab'}">${me?'★ 你':POS_ZH[p]}</div></div><div class="la" style="visibility:visible">${note}</div></div>`;
  }).join('');
  const D=L[(btn-h+n)%n];
  const dst=`left:${(50+(D.x-50)*0.74+3).toFixed(1)}%;top:${(47+(D.y-47)*0.74).toFixed(1)}%`;
  return `<div class="tbl${n===9?' t9':''} pdiag" role="img" aria-label="牌桌位置圖：你在 ${pos}，順時針依序行動"><div class="felt"></div>${seats}<div class="dbtn" style="${st0(dst)}">D</div><div class="pdc">順時針行動 ↻</div></div>`;
}
function st0(s){return s}
const _renderPrePos=renderPre;
renderPre=function(){
  _renderPrePos();
  const el=document.getElementById('t-pre'),d=[...el.querySelectorAll('div')].find(x=>/^位置：/.test(x.textContent)&&x.children.length===1&&x.firstElementChild.tagName==='B');
  if(!d)return;
  const n=PRE_N,pos=pre.pos,ord=POS_ORDER[n],h=ord.indexOf(pos);
  const left=ord.slice(h+1).filter(p=>p!=='SB'&&p!=='BB'||true).length;
  d.innerHTML=`位置：<b>${pos}</b>（${POS_ZH[pos]}）— 你後面還有 <b>${left}</b> 位玩家沒行動`+posDiagram(n,pos);
};

/* ===== 範圍表：手機優化（滿版方格、點格看說明、位置按鈕、圖例）===== */
gridHTML=function(map,mine){
  let h='<table class="grid">';
  for(let i=0;i<13;i++){h+='<tr>';for(let j=0;j<13;j++){
    const ri=12-i,rj=12-j;const l=i===j?lab(ri,ri,false):i<j?lab(ri,rj,true):lab(rj,ri,false);
    const f=map.get(l)||0;
    const bg=f>0?`rgba(46,166,106,${(0.25+0.75*f).toFixed(2)})`:'#243140';
    h+=`<td style="background:${bg}" data-l="${l}" data-f="${f}" class="${l===mine?'me':''}">${l.slice(0,2)}<i>${l.slice(2)}</i></td>`}h+='</tr>'}
  return h+`</table><div class="ginfo" aria-live="polite">${mine?'白框＝你的手牌。':''}點任一格，看那手牌在這個範圍的頻率。</div>
  <div class="glg"><span><b style="background:rgba(46,166,106,1)"></b>一定加注</span><span><b style="background:rgba(46,166,106,.5)"></b>有時加注</span><span><b style="background:#243140"></b>棄牌</span></div>`;
};
document.addEventListener('click',e=>{
  const td=e.target.closest&&e.target.closest('table.grid td');if(!td||!td.dataset.l)return;
  const t=td.closest('table.grid'),info=t.nextElementSibling;if(!info||!info.classList.contains('ginfo'))return;
  t.querySelectorAll('td.pick').forEach(x=>x.classList.remove('pick'));td.classList.add('pick');
  const f=+td.dataset.f,l=td.dataset.l,kind=l.length===2?'對子':l.endsWith('s')?'同花':'非同花';
  info.innerHTML=`<b>${l}</b>（${kind}）：${f>=0.995?'<span style="color:#4cff9a">一定加注</span>':f>0?`有時加注，約 <b>${Math.round(f*100)}%</b>`:'<span style="color:#ff8a80">棄牌</span>'}`;
});
const _renderPreChips=renderPre;
renderPre=function(){
  _renderPreChips();
  const sel=document.getElementById('pre-view');if(!sel)return;
  const row=document.createElement('div');row.className='poschips';row.setAttribute('role','group');row.setAttribute('aria-label','選擇位置');
  row.innerHTML=[...sel.options].map(o=>`<button class="b s${o.value===sel.value?' on':''}" data-p="${o.value}">${o.value}</button>`).join('');
  row.onclick=e=>{const b=e.target.closest('button');if(!b)return;sel.value=b.dataset.p;sel.onchange();row.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
  sel.style.display='none';sel.parentNode.insertBefore(row,sel);
};

/* ===== 面對加注練習：位置圖（標出開池者與你）===== */
function faceDiagram(heroPos,oppPos,sz){
  const n=6,ord=POS_ORDER[6],h=ord.indexOf(heroPos),o=ord.indexOf(oppPos);if(h<0||o<0)return '';
  const L=seatLayout(n),btn=ord.indexOf('BTN');
  const seats=ord.map((p,i)=>{
    const k=(i-h+n)%n,me=i===h,op=i===o,after=i>o&&i>h;
    const st=`left:${L[k].x.toFixed(1)}%;top:${L[k].y.toFixed(1)}%`;
    const cls=me?'act':op?'opp':after?'later':'fold';
    const note=me?'輪到你':op?'開池 '+sz:after?'還沒行動':'已棄牌';
    const sub=me?'★ 你':op?'開池者':POS_ZH[p];
    return `<div class="seat pd ${cls}" style="${st}"><div class="box"><div class="nm"><span class="pos">${p}</span></div><div class="stk" style="font-size:11px;color:${me?'#ffd54a':op?'#ff8a80':'#8b9bab'}">${sub}</div></div><div class="la" style="visibility:visible">${note}</div></div>`;
  }).join('');
  const D=L[(btn-h+n)%n];
  const dst=`left:${(50+(D.x-50)*0.74+3).toFixed(1)}%;top:${(47+(D.y-47)*0.74).toFixed(1)}%`;
  return `<div class="tbl pdiag" role="img" aria-label="牌桌位置圖：${oppPos} 開池，你在 ${heroPos}"><div class="felt"></div>${seats}<div class="dbtn" style="${dst}">D</div><div class="pdc">順時針行動 ↻</div></div>`;
}

/* ============ PWA：註冊、安裝提示（Android / iOS / 電腦） ============ */
const UA=navigator.userAgent;
const ENV={
  ios:/iphone|ipad|ipod/i.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
  android:/android/i.test(UA),
  inApp:/Line\/|FBAN|FBAV|Instagram|MicroMessenger|; wv\)/i.test(UA),
  safari:/safari/i.test(UA)&&!/crios|fxios|edgios|opios|chrome|android/i.test(UA)
};
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
let deferredPrompt=null,swState='檢查中';
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;renderInstallBanner();if($('t-install').classList.contains('on'))renderInstall()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;renderInstallBanner();renderInstall()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').then(()=>{swState='已啟用（可離線使用）'}).catch(()=>{swState='註冊失敗'});
}else swState=/^https?:$/.test(location.protocol)?'此瀏覽器不支援':'需透過 https 網址開啟才能啟用';
const hadController=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='SW_UPDATED'&&hadController)showUpdateBanner()});
}
function showUpdateBanner(){
  let b=document.getElementById('updateBanner');
  if(!b){b=document.createElement('div');b.id='updateBanner';b.className='ibanner';b.setAttribute('role','status');document.body.insertBefore(b,document.body.firstChild)}
  b.innerHTML='<span>🔄 有新版本可用，更新後會取得最新內容。</span><span><button class="b" onclick="location.reload()">立即更新</button></span>';
}
function dismissBanner(){try{localStorage.setItem('pwaDismiss',String(Date.now()))}catch(e){}renderInstallBanner(true)}
function doInstall(){
  if(!deferredPrompt)return show('t-install');
  deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;renderInstallBanner();renderInstall()});
}
function renderInstallBanner(forceHide){
  const el=$('installBanner');if(!el)return;
  let dismissed=false;try{const t=+localStorage.getItem('pwaDismiss');dismissed=t&&Date.now()-t<7*864e5}catch(e){}
  if(forceHide||dismissed||isStandalone()){el.innerHTML='';return}
  let msg,btn;
  if(ENV.inApp){msg='你正在 App 內建瀏覽器（如 LINE / FB）中，無法安裝。請點右上角選單，改用「'+(ENV.ios?'Safari':'Chrome')+'」開啟。';btn='看教學'}
  else if(deferredPrompt){msg='可以把練習器安裝成 App，離線也能用。';btn='安裝 App'}
  else if(ENV.ios){msg='iPhone / iPad：點 Safari 底部的「分享」→「加入主畫面」即可安裝。';btn='看圖文教學'}
  else if(ENV.android){msg='Android：點瀏覽器右上角「⋮」→「安裝應用程式」或「加到主畫面」。';btn='看教學'}
  else{msg='可安裝成桌面 App：點網址列右側的安裝圖示。';btn='看教學'}
  el.innerHTML=`<div class="ibanner"><span>📲 ${msg}</span><span><button class="b" onclick="${deferredPrompt?'doInstall()':"show('t-install')"}">${btn}</button><button class="b s" onclick="dismissBanner()" title="7 天內不再顯示">✕</button></span></div>`;
}
function renderInstall(){
  const dev=ENV.ios?'ios':ENV.android?'android':'desktop',devName={ios:'iPhone / iPad',android:'Android',desktop:'電腦'}[dev];
  const st=isStandalone();

    <ol style="line-height:1.9">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>${note?`<div class="mut">${note}</div>`:''}</details>`;
  $('t-install').innerHTML=`<div class="panel"><h2>安裝成 App</h2>
    <div>目前裝置：<b>${devName}</b> ｜ 狀態：${st?'✅ 已以 App 模式執行':'尚未安裝'} ｜ 離線快取：${swState}</div>
    ${location.protocol==='file:'?'<div class="res warn">你現在是用檔案（file://）開啟，瀏覽器不允許安裝。請改用網站網址（https://）開啟後再安裝。</div>':''}
    ${ENV.inApp?'<div class="res warn">偵測到 App 內建瀏覽器（LINE / Facebook / Instagram 等）。這類瀏覽器不支援安裝，請先用 '+(ENV.ios?'Safari':'Chrome')+' 開啟本頁。</div>':''}
    ${deferredPrompt&&!st?'<button class="b big" onclick="doInstall()">一鍵安裝</button>':''}
    <div class="mut">安裝後會有桌面圖示、全螢幕開啟、離線可用；手牌歷史等資料保存在該裝置，不會上傳。</div></div>
  ${sec('android','🤖','Android（Chrome / Edge / Samsung Internet）',[
    '用 <b>Chrome</b>（或 Edge、Samsung Internet）開啟本頁網址。',
    '若頁面頂端出現「安裝 App」，直接點它；或點右上角 <b>⋮ 選單</b>。',
    '選 <b>「安裝應用程式」</b>（舊版顯示「加到主畫面」）。',
    '在彈出視窗按 <b>「安裝」</b>，桌面或應用程式列表就會出現「撲克入門」圖示。'],
    'Firefox for Android：選單 →「安裝」。若選單沒有安裝選項，請改用 Chrome。')}
  ${sec('ios','🍎','iPhone / iPad（Safari）',[
    '務必用 <b>Safari</b> 開啟本頁網址（LINE、Facebook 內建瀏覽器不行）。',
    '點底部（iPad 在上方）的 <b>「分享」按鈕</b>（方框加向上箭頭 ⬆）。',
    '往下滑，點 <b>「加入主畫面」</b>。若看不到，先點選單最下方的「編輯動作」把它加進來。',
    '確認名稱後按右上角 <b>「加入」</b>，主畫面就會出現圖示，之後從圖示開啟即為全螢幕 App。'],
    'iOS 16.4 以上，其他瀏覽器（如 Chrome）也可從「分享」選單加入主畫面；iOS 沒有「一鍵安裝」按鈕，只能手動加入。從主畫面開啟的 App，資料較不易被 Safari 清除。')}
  ${sec('desktop','💻','電腦（Chrome / Edge）',[
    '用 Chrome 或 Edge 開啟本頁網址。',
    '點網址列<b>最右側的「安裝」圖示</b>（螢幕加向下箭頭）。',
    '按 <b>「安裝」</b>，之後可從開始功能表或桌面開啟，像一般軟體。'],
    'Safari（macOS Sonoma 以上）：選單「檔案」→「加入 Dock」。')}
  <details class="panel"><summary style="cursor:pointer;font-weight:700">🔧 沒看到安裝選項？</summary>
    <ul style="line-height:1.9"><li>網址必須是 <b>https://</b>（或 localhost）；用 file:// 或 http:// 都不能安裝。</li>
    <li>在 LINE / FB / IG 內開啟的連結，請改用外部瀏覽器（Safari 或 Chrome）。</li>
    <li>已安裝過的話，瀏覽器不會再顯示安裝選項，請直接從主畫面圖示開啟。</li>
    <li>更新版本：看到「有新版本可用」時按「立即更新」；沒看到的話，關閉 App 後重新開啟一兩次即可。</li>
    <li>刪除 App：長按圖示移除即可（資料會一併清除）。</li></ul></details>`;
}
