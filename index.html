<title>德州撲克入門練習器</title>
<style>
:root{--bg:#0f1720;--panel:#18222e;--line:#2a3846;--tx:#e6edf3;--mut:#8b9bab;--ok:#2ea66a;--bad:#d9534f;--acc:#4aa3ff;--warn:#e0a526}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,"Microsoft JhengHei",sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;color:var(--mut);font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
nav button{background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 8px}
.mut{color:var(--mut);font-size:13px}
button.b,input[type=submit]{background:var(--acc);color:#04121f;border:0;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;margin:4px 6px 4px 0}
button.b.g{background:var(--ok);color:#fff}button.b.r{background:var(--bad);color:#fff}button.b.s{background:#2a3846;color:var(--tx)}
button.b:disabled{opacity:.4;cursor:default}
input[type=text],select,textarea{background:#0f1720;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px;width:100%}
input[type=range]{width:100%}
label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
.cards{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.card{display:inline-block;min-width:42px;text-align:center;background:#f4f4f0;color:#111;border-radius:6px;padding:6px 4px;font-weight:700;font-size:18px;border:1px solid #bbb}
.card.r{color:#c0242b}
.sep{width:14px}
.res{margin-top:10px;padding:10px;border-radius:8px;background:#0f1720;border-left:4px solid var(--acc)}
.res.ok{border-color:var(--ok)}.res.bad{border-color:var(--bad)}.res.warn{border-color:var(--warn)}
table.grid{border-collapse:collapse;margin:8px 0}
table.grid td{width:34px;height:28px;text-align:center;font-size:10px;border:1px solid #0f1720;color:#fff;padding:0}
table.grid td.me{outline:3px solid #fff;outline-offset:-3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.row{grid-template-columns:1fr}table.grid td{width:24px;height:24px;font-size:8px}}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
a{color:var(--acc)}
.tag{display:inline-block;background:#223246;border-radius:10px;padding:1px 8px;font-size:11px;color:var(--mut);margin-right:4px}
.stat{font-size:22px;font-weight:700}
.bar{height:10px;background:#0f1720;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}

/* 牌桌 */
.tbl{position:relative;width:100%;max-width:920px;aspect-ratio:16/10;margin:0 auto 12px}
.felt{position:absolute;inset:7% 6%;border-radius:999px;background:radial-gradient(ellipse at center,#23895a,#0f4a2e 75%);border:12px solid #5a3a1c;box-shadow:inset 0 0 50px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.5)}
.seat{position:absolute;transform:translate(-50%,-50%);width:124px;text-align:center;font-size:12px;z-index:2}
.seat .box{background:#111a24;border:2px solid #2a3846;border-radius:12px;padding:3px 6px;margin-top:2px}
.seat .nm{font-weight:600}.seat .pos{color:var(--acc);font-size:11px}.seat .stk{color:#ffd54a;font-weight:700}
.seat .la{min-height:16px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);border-radius:8px;display:inline-block;padding:0 6px;margin-top:2px}
.seat .la:empty{visibility:hidden}
.seat.act .box{border-color:#ffd54a;box-shadow:0 0 14px #ffd54a}
.seat.fold{opacity:.38}
.seat.win .box{border-color:#4cff9a;box-shadow:0 0 16px #4cff9a}
.winl{color:#4cff9a;font-weight:800;font-size:13px}
.hole{display:flex;justify-content:center;gap:2px}.hole .card{min-width:36px;font-size:16px;padding:4px 2px}
.hn{font-size:11px;color:#ffd54a}
.mc{display:inline-block;width:26px;height:36px;border-radius:4px;font-size:12px;line-height:36px;font-weight:700;background:#f4f4f0;color:#111;border:1px solid #bbb}
.mc.r{color:#c0242b}.mc.bk{background:repeating-linear-gradient(45deg,#2b4a7a,#2b4a7a 4px,#35598f 4px,#35598f 8px);color:transparent;border-color:#1b3050}
.s0{left:50%;top:86%}.s1{left:9%;top:66%}.s2{left:13%;top:20%}.s3{left:50%;top:7%}.s4{left:87%;top:20%}.s5{left:91%;top:66%}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:1px 7px 1px 3px;border-radius:12px;z-index:1}
.bet i,.potl i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#d9534f;border:3px dashed #fff}
.b0{left:50%;top:67%}.b1{left:25%;top:60%}.b2{left:28%;top:33%}.b3{left:50%;top:25%}.b4{left:72%;top:33%}.b5{left:75%;top:60%}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#fff;color:#111;font-weight:800;font-size:12px;text-align:center;line-height:22px;z-index:3;box-shadow:0 1px 4px #000}
.d0{left:61%;top:78%}.d1{left:18%;top:60%}.d2{left:22%;top:30%}.d3{left:59%;top:15%}.d4{left:79%;top:30%}.d5{left:84%;top:58%}
.center{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;z-index:1}
.potl{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.45);padding:2px 12px;border-radius:14px;font-weight:700;margin-bottom:6px}
.board{display:flex;gap:4px;justify-content:center}.board .card{min-width:40px;font-size:17px}
.card.dim{opacity:.45}
.card.ph{background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.25);color:transparent}
.stl{font-size:11px;color:#bfe3cf;margin-top:4px}
.abar{display:flex;gap:8px;flex-wrap:wrap}
.rzbox{margin-top:8px}.qb{display:flex;flex-wrap:wrap;gap:4px}
button.b.big{padding:12px 22px;font-size:16px}
.topbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
@media(max-width:640px){
 .tbl{aspect-ratio:3/4}.felt{inset:8% 3%}
 .seat{width:92px;font-size:10px}.hole .card{min-width:28px;font-size:12px}.mc{width:20px;height:28px;line-height:28px;font-size:10px}
 .board .card{min-width:30px;font-size:13px;padding:5px 1px}
 .s0{left:50%;top:91%}.s1{left:14%;top:72%}.s2{left:14%;top:30%}.s3{left:50%;top:8%}.s4{left:86%;top:30%}.s5{left:86%;top:72%}
 .b0{left:50%;top:76%}.b1{left:31%;top:66%}.b2{left:31%;top:38%}.b3{left:50%;top:21%}.b4{left:69%;top:38%}.b5{left:69%;top:66%}
 .d0{left:63%;top:84%}.d1{left:25%;top:62%}.d2{left:25%;top:36%}.d3{left:61%;top:14%}.d4{left:75%;top:36%}.d5{left:75%;top:62%}
}

/* HUD、即時資訊、動畫 */
.hud{font-size:10px;color:#9fb3c8;line-height:1.2;margin-top:1px}.hud .n{opacity:.7}.hud b{color:#ffd54a}
.infobar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ic{background:#0f1720;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px}
.ic span{display:block;color:var(--mut);font-size:11px}.ic b{font-size:14px}
.ic.good{border-color:var(--ok)}.ic.badc{border-color:var(--bad)}
.tmr{height:6px;background:#0f1720;border-radius:3px;overflow:hidden;margin-bottom:8px}
.tmr i{display:block;height:100%;background:#ffd54a;animation-name:tm;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes tm{from{width:100%}to{width:0}}
@keyframes dealIn{from{transform:translateY(-26px) scale(.7);opacity:0}to{transform:none;opacity:1}}
.card.deal,.mc.deal{animation:dealIn .35s ease-out both}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(.4)}70%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-50%) scale(1)}}
.bet.pop{animation:popIn .3s ease-out}
@keyframes glow{from{box-shadow:0 0 6px #ffd54a}to{box-shadow:0 0 18px #ffd54a}}
.seat.act .box{animation:glow .8s infinite alternate}
@keyframes winB{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.winl{animation:winB .5s ease-out}

/* 分組導覽 */
header{padding:10px 16px}header p{display:none}
nav#nav{display:flex;flex-wrap:nowrap;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;background:var(--bg)}
nav#nav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:5px 4px;font-size:13px;background:transparent;border:1px solid transparent;color:var(--mut)}
nav#nav button .ni{font-size:18px;line-height:1.25}
nav#nav button.on{background:var(--acc);color:#04121f;border-color:var(--acc)}
#subnav{display:none;gap:6px;padding:8px 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
#subnav button{white-space:nowrap;background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:6px 14px;border-radius:16px;font-size:13px;cursor:pointer}
#subnav button.on{background:#223246;border-color:var(--acc);color:var(--acc);font-weight:600}
@media(max-width:640px){
 nav#nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:2px}
 #subnav{position:sticky;top:0;z-index:25;background:var(--bg)}
 main{padding-bottom:88px}
}
/* 課程 */
.lrow{display:flex;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer}.lrow:hover{background:#1d2d40}
.ql{margin:12px 0}.opt{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;color:var(--tx);font-size:14px}
.opt input{margin-right:6px}.opt.ok{border-color:var(--ok);background:rgba(46,166,106,.15)}.opt.no{border-color:var(--bad);background:rgba(217,83,79,.15)}
.why{font-size:13px;color:var(--mut);margin-top:4px}
.lesson h3{font-size:15px;margin:14px 0 6px}.lesson p,.lesson li{line-height:1.7}.lesson ol,.lesson ul{padding-left:22px}
details.adv summary{cursor:pointer;color:var(--acc);margin:6px 0}.adv-body{margin:6px 0}

.topbar2{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.topbar2 select{width:auto}
.t9 .seat{width:104px;font-size:11px}.t9 .hole .card{min-width:28px;font-size:13px;padding:3px 2px}
.t9 .mc{width:20px;height:28px;line-height:28px;font-size:10px}.t9 .hud{display:none}
@media(max-width:640px){
 .t9 .seat{width:76px;font-size:9px}.t9 .hole .card{min-width:21px;font-size:10px;padding:2px 1px}
 .t9 .mc{width:15px;height:21px;line-height:21px;font-size:8px}.t9 .la{font-size:9px}.t9 .bet{font-size:10px}
}

/* 對戰頁：底部操作區、彈出視窗 */
.simtop{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.simtop .row1{display:flex;justify-content:space-between;align-items:center;gap:6px}
.simtop .b{margin:2px 4px 2px 0;padding:7px 12px;font-size:13px}.simtop .ib{padding:7px 10px;margin:2px 0 2px 4px;font-size:15px}
.simtop .st{margin-top:2px;font-size:12px}
.tline{background:#143049;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;margin-bottom:8px;cursor:pointer}
.tdetail{margin:-4px 0 8px;font-size:12px}
.dock{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px}
.abar3{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}.abar3 .b{margin:0;padding:11px 8px;font-size:15px}
.rzbox .b.big{width:100%;margin:6px 0 0}
.dock .res{margin:0 0 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.sheethead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-12px;background:var(--bg);padding:6px 0;margin-bottom:6px;z-index:2}
@media(min-width:821px){.modal{align-items:center}.sheet{border-radius:16px}}
@media(max-width:820px){
 body.simfull{overflow:hidden}
 body.simfull header,body.simfull #subnav,body.simfull #installBanner{display:none}
 body.simfull main{padding:6px 8px 0;margin:0;max-width:none;height:calc(100vh - 66px);height:calc(100dvh - 66px - env(safe-area-inset-bottom))}
 body.simfull #t-sim.on{display:flex;flex-direction:column;height:100%;gap:0;overflow:hidden}
 body.simfull #t-sim .simtop{margin-bottom:4px;padding:5px 8px}
 body.simfull #t-sim .tline{margin-bottom:4px}
 body.simfull #t-sim .tbl{flex:1 1 0;min-height:190px;aspect-ratio:auto;width:100%;max-width:none;margin:0 0 4px}
 body.simfull #t-sim .dock{flex:0 0 auto;max-height:46%;overflow:auto;margin:0 0 4px;padding:8px}
 .hint:not(.open){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
 .hint{font-size:13px;padding:7px 9px}
 .rzbox{display:none}.rzbox.open{display:block}
 .infobar{flex-wrap:nowrap;overflow-x:auto;margin-bottom:6px;padding-bottom:2px}.ic{flex:0 0 auto;padding:3px 8px}.ic b{font-size:13px}
 .felt{inset:6% 3%}
}
@media(max-width:820px) and (max-height:700px){
 .seat{width:80px;font-size:9px}.hole .card{min-width:24px;font-size:11px;padding:2px 1px}.mc{width:16px;height:22px;line-height:22px;font-size:9px}
 .t9 .seat{width:66px}.t9 .hole .card{min-width:18px;font-size:9px}.potl{padding:1px 8px;font-size:12px;margin-bottom:3px}.board .card{min-width:26px;font-size:12px;padding:3px 1px}
}

/* QA 修正 */
:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
input.err,select.err{border-color:var(--bad)!important;outline:1px solid var(--bad)}
.ic span,.tag,.hn,.seat .pos{font-size:12px}
.sheet:focus{outline:none}
#updateBanner{position:sticky;top:0;z-index:90}
@media(max-width:820px){
 button.b,#subnav button{min-height:44px}
 .lrow{min-height:44px;align-items:center}
 .simtop .b{min-height:40px}.simtop .ib{min-width:40px}
 .sheethead .b{min-height:44px;min-width:44px}
 .abar3 .b{min-height:48px}
}
@media(min-width:821px){nav#nav,#subnav{max-width:980px;margin-left:auto;margin-right:auto}}

/* 新手教材樣式 */
.goal,.pit,.sum,.ex{border-radius:8px;padding:9px 12px;margin:10px 0;line-height:1.7;font-size:14px}
.goal{background:#143049;border-left:4px solid var(--acc)}
.pit{background:#3a2a14;border-left:4px solid var(--warn)}
.sum{background:#12301f;border-left:4px solid var(--ok)}
.ex{background:#0f1720;border:1px solid var(--line)}
.sum ul{margin:6px 0 8px;padding-left:20px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;line-height:1.7}
.mcard .b{margin-top:6px}
.when{background:#2a2438;border-left:4px solid #9b7bd6;border-radius:8px;padding:9px 12px;margin:10px 0;line-height:1.7;font-size:14px}
.when ul{margin:6px 0 0;padding-left:20px}
.newterms{background:#0f1720;border:1px dashed var(--acc);border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13.5px;line-height:1.7}
.newterms>div{margin-top:3px}
.term{border-bottom:1px dotted var(--acc);cursor:help;color:inherit}
.term:focus-visible{outline:2px solid #ffd54a}
#termpop{position:fixed;z-index:80;background:#0f1720;border:1px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#termpop a{display:inline-block;margin-top:4px;font-size:12.5px}
.whenbox{background:#1a2733;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:13.5px}
.whenbox>summary{cursor:pointer;font-weight:600}.whenbox ul{margin:6px 0 2px;padding-left:20px;line-height:1.7}
body.simfull #whenbox{display:none!important}
.pdiag{max-width:520px;aspect-ratio:16/10;margin:8px auto 4px}
.pdiag .seat{width:84px;font-size:11px}.t9.pdiag .seat{width:70px;font-size:10px}
.pdiag .seat.later .box{opacity:.7}
.pdiag .seat.act .box{background:#2a2410}
.pdiag .pdc{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);color:#cfe;font-size:12px;opacity:.7;z-index:1}
table.grid{width:100%;max-width:560px;table-layout:fixed;margin:8px auto 4px}
table.grid td{width:auto;height:min(calc((100vw - 66px)/13),42px);font-size:clamp(9px,2.6vw,14px);font-weight:600;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
table.grid td i{font-style:normal;font-size:.72em;opacity:.8}
table.grid td.pick{outline:2px solid #ffd54a;outline-offset:-2px;position:relative;z-index:1}
.ginfo{max-width:560px;margin:4px auto;padding:7px 10px;background:#0f1720;border-radius:8px;font-size:14px;min-height:20px}

<body>
<header>
  <h1>♠ 德州撲克入門練習器</h1>
  <p>翻前範圍 · 勝率預測 · 底池賠率 · CFR 演示 · 論文索引（單檔離線可用）</p>
</header>
<div id="installBanner"></div>
<nav id="nav" aria-label="主選單"></nav>
<div id="subnav" role="navigation" aria-label="次選單"></div>
<main>
  <section id="t-course"></section>
  <section id="t-learn"></section>
  <section id="t-demo"></section>
  <section id="t-guide"></section>
  <section id="t-adv"></section>
  <section id="t-sim"></section>
  <section id="t-hist"></section>
  <section id="t-pre"></section>
  <section id="t-eq"></section>
  <section id="t-pot"></section>
  <section id="t-calc"></section>
  <section id="t-icm"></section>
  <section id="t-scn"></section>
  <section id="t-kuhn"></section>
  <section id="t-paper"></section>
  <section id="t-stat"></section>
  <section id="t-install"></section>
</main>

<script>
/* ============ 基礎：牌、牌力評估 ============ */
const RANKS="23456789TJQKA", SUITS="shdc", SYM={s:"♠",h:"♥",d:"♦",c:"♣"};
const $=id=>document.getElementById(id);
const cardStr=c=>RANKS[c%13]+SUITS[(c/13)|0];
function cardHTML(c){const s=SUITS[(c/13)|0];return `<span class="card ${s==='h'||s==='d'?'r':''}">${RANKS[c%13]}${SYM[s]}</span>`}
function cardsHTML(a){return a.map(cardHTML).join('')}
function parseCards(str){
  const t=str.replace(/[\s,]+/g,'');if(t.length%2)return null;const out=[];
  for(let i=0;i<t.length;i+=2){const r=RANKS.indexOf(t[i].toUpperCase()),u=SUITS.indexOf(t[i+1].toLowerCase());if(r<0||u<0)return null;out.push(u*13+r)}
  return new Set(out).size===out.length?out:null;
}
function pack(cat,a){let v=cat;for(let i=0;i<5;i++)v=v*13+(a[i]||0);return v}
function eval7(cs){
  const rc=new Array(13).fill(0),sm=[0,0,0,0],sn=[0,0,0,0];
  for(const c of cs){const r=c%13,s=(c/13)|0;rc[r]++;sm[s]|=1<<r;sn[s]++}
  let mask=0;for(let r=0;r<13;r++)if(rc[r])mask|=1<<r;
  const sh=m=>{for(let h=12;h>=4;h--)if(((m>>(h-4))&31)===31)return h;return (m&0x100F)===0x100F?3:-1};
  const kick=(ex,n)=>{const o=[];for(let r=12;r>=0&&o.length<n;r--)if(rc[r]&&!ex.includes(r))o.push(r);return o};
  let fs=-1;for(let s=0;s<4;s++)if(sn[s]>=5){fs=s;break}
  if(fs>=0){const h=sh(sm[fs]);if(h>=0)return pack(8,[h])}
  const quads=[],trips=[],pairs=[];
  for(let r=12;r>=0;r--){if(rc[r]===4)quads.push(r);else if(rc[r]===3)trips.push(r);else if(rc[r]===2)pairs.push(r)}
  if(quads.length)return pack(7,[quads[0],...kick([quads[0]],1)]);
  if(trips.length&&(trips.length>1||pairs.length)){
    const p=trips.length>1?Math.max(trips[1],pairs.length?pairs[0]:-1):pairs[0];return pack(6,[trips[0],p])}
  if(fs>=0){const rs=[];for(let r=12;r>=0&&rs.length<5;r--)if((sm[fs]>>r)&1)rs.push(r);return pack(5,rs)}
  const h=sh(mask);if(h>=0)return pack(4,[h]);
  if(trips.length)return pack(3,[trips[0],...kick([trips[0]],2)]);
  if(pairs.length>=2)return pack(2,[pairs[0],pairs[1],...kick([pairs[0],pairs[1]],1)]);
  if(pairs.length===1)return pack(1,[pairs[0],...kick([pairs[0]],3)]);
  return pack(0,kick([],5));
}

/* ============ 範圍：解析、展開、蒙地卡羅勝率 ============ */
function lab(a,b,suited){const hi=Math.max(a,b),lo=Math.min(a,b);return RANKS[hi]+RANKS[lo]+(hi===lo?'':suited?'s':'o')}
function handLabel(c1,c2){return lab(c1%13,c2%13,((c1/13)|0)===((c2/13)|0))}
// 語法：77+, A2s+, ATo+, KQs, 55:0.5（冒號後為混合頻率）
function parseRange(str){
  const m=new Map();
  for(let tok of str.split(',').map(s=>s.trim()).filter(Boolean)){
    const x=/^([2-9TJQKA])([2-9TJQKA])([so]?)(\+)?(?::([\d.]+))?$/i.exec(tok);if(!x)continue;
    const a=RANKS.indexOf(x[1].toUpperCase()),b=RANKS.indexOf(x[2].toUpperCase()),f=x[5]?parseFloat(x[5]):1,plus=!!x[4];
    const hi=Math.max(a,b),lo=Math.min(a,b),sfx=x[3].toLowerCase();
    if(hi===lo){for(let r=lo;r<=(plus?12:lo);r++)m.set(lab(r,r,false),f)}
    else for(let r=lo;r<=(plus?hi-1:lo);r++){
      if(sfx!=='o')m.set(lab(hi,r,true),f);if(sfx!=='s')m.set(lab(hi,r,false),f)}
  }
  return m;
}
function expand(map){
  const out=[];
  for(const [l,f] of map){
    if(f<=0)continue;const a=RANKS.indexOf(l[0]),b=RANKS.indexOf(l[1]);
    if(l.length===2){for(let s1=0;s1<4;s1++)for(let s2=s1+1;s2<4;s2++)out.push({a:s1*13+a,b:s2*13+b,w:f})}
    else if(l[2]==='s'){for(let s=0;s<4;s++)out.push({a:s*13+a,b:s*13+b,w:f})}
    else{for(let s1=0;s1<4;s1++)for(let s2=0;s2<4;s2++)if(s1!==s2)out.push({a:s1*13+a,b:s2*13+b,w:f})}
  }
  return out;
}
const ALLMAP=(()=>{const m=new Map();for(let i=12;i>=0;i--)for(let j=i;j>=0;j--){if(i===j)m.set(lab(i,i,false),1);else{m.set(lab(i,j,true),1);m.set(lab(i,j,false),1)}}return m})();
function equity(hero,board,combosAll,iters){
  const dead=new Set([...hero,...board]);
  const combos=combosAll.filter(x=>!dead.has(x.a)&&!dead.has(x.b));
  if(!combos.length)return null;
  const cum=[];let t=0;for(const x of combos){t+=x.w;cum.push(t)}
  const need=5-board.length,base=[];for(let c=0;c<52;c++)if(!dead.has(c))base.push(c);
  let w=0,ti=0,l=0;
  for(let i=0;i<iters;i++){
    const u=Math.random()*t;let lo=0,hi=cum.length-1;
    while(lo<hi){const m=(lo+hi)>>1;if(cum[m]<u)lo=m+1;else hi=m}
    const v=combos[lo],deck=base.filter(c=>c!==v.a&&c!==v.b),bd=board.slice();
    for(let k=0;k<need;k++){const j=k+((Math.random()*(deck.length-k))|0);const tmp=deck[k];deck[k]=deck[j];deck[j]=tmp;bd.push(deck[k])}
    const hs=eval7([...hero,...bd]),vs=eval7([v.a,v.b,...bd]);
    if(hs>vs)w++;else if(hs<vs)l++;else ti++;
  }
  return {win:w/iters,tie:ti/iters,lose:l/iters,eq:(w+ti/2)/iters};
}
function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ 近似 6-max 100bb 開池（RFI）範圍 ============ */
// 注意：為常見公開圖表的近似值，非即時求解器輸出；混合頻率僅示意。
const RFI={
  UTG:"66+,55:0.5,A9s+,A5s,A4s:0.5,KTs+,QTs+,JTs,T9s,98s:0.5,AJo+,KQo:0.5",
  HJ:"44+,A8s+,A5s,A4s,A3s:0.5,K9s+,Q9s+,J9s+,T9s,98s,87s,76s:0.5,ATo+,KJo+,QJo:0.5",
  CO:"22+,A2s+,K8s+,Q9s+,J9s+,T8s+,97s+,87s,76s,65s,54s:0.5,ATo+,KTo+,QTo+,JTo",
  BTN:"22+,A2s+,K2s+,Q5s+,J7s+,T7s+,96s+,86s+,75s+,65s,54s,A2o+,K9o+,Q9o+,J9o+,T9o,98o:0.5",
  SB:"22+,A2s+,K4s+,Q6s+,J8s+,T8s+,97s+,87s,76s,65s,54s,A2o+,K9o+,Q9o+,J9o+,T9o"
};
const RM={};for(const k in RFI)RM[k]=parseRange(RFI[k]);
const POS=Object.keys(RFI);
const VRANGES={
  "隨機手牌":ALLMAP,
  "UTG 開池範圍":RM.UTG,
  "BTN 開池範圍":RM.BTN,
  "強牌範圍（約前 10%）":parseRange("77+,ATs+,KQs,AJo+,KQo")
};

/* ============ 統計（localStorage，失敗時僅記憶體） ============ */
let S={pre:{n:0,c:0},eq:{n:0,abs:0},pot:{n:0,c:0},face:{n:0,c:0}};
try{const j=JSON.parse(localStorage.getItem('gtoTrainer')||'null');if(j)S=Object.assign(S,j)}catch(e){}
function save(){try{localStorage.setItem('gtoTrainer',JSON.stringify(S))}catch(e){}}

/* ============ 分頁 ============ */
const GROUPS=[
 {k:'learn',icon:'📚',name:'學習',tabs:[['t-course','新手路徑'],['t-learn','翻前教學'],['t-demo','示範牌局'],['t-guide','速查手冊']]},
 {k:'practice',icon:'🎯',name:'練習',tabs:[['t-pre','翻前範圍'],['t-eq','勝率預測'],['t-pot','底池賠率'],['t-calc','計算機']]},
 {k:'play',icon:'♠',name:'對戰',tabs:[['t-sim','模擬比賽']]},
 {k:'adv',icon:'⭐',name:'進階',tabs:[['t-adv','進階課程'],['t-scn','情境練習'],['t-icm','ICM 練習'],['t-kuhn','CFR 演示'],['t-paper','論文索引']]},
 {k:'me',icon:'👤',name:'我的',tabs:[['t-hist','手牌歷史'],['t-stat','統計'],['t-install','安裝 App']]}
];
const GLAST={},nav=$('nav'),subnav=$('subnav');
GROUPS.forEach(g=>{g.tabs=g.tabs.filter(t=>document.getElementById(t[0]))});
GROUPS.forEach(g=>{const b=document.createElement('button');b.dataset.g=g.k;b.innerHTML='<span class="ni">'+g.icon+'</span><span>'+g.name+'</span>';b.onclick=()=>show(GLAST[g.k]||g.tabs[0][0]);nav.appendChild(b)});
function show(id){
  const g=GROUPS.find(x=>x.tabs.some(t=>t[0]===id))||GROUPS[0];GLAST[g.k]=id;
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.g===g.k));
  subnav.innerHTML=g.tabs.length>1?g.tabs.map(([t,n])=>'<button class="'+(t===id?'on':'')+'" onclick="show(\''+t+'\')">'+n+'</button>').join(''):'';
  subnav.style.display=g.tabs.length>1?'flex':'none';
  if(id==='t-course')renderCourse();
  if(id==='t-stat')renderStat();
  if(id==='t-sim'&&!G)newMatch();
  if(id==='t-hist')renderHist();
  if(id==='t-install')renderInstall();
  if(id==='t-icm')renderIcm();
  if(id==='t-scn')renderScn();
  if(id==='t-guide')renderGuide();
  if(id==='t-demo')renderDemo();
  if(id==='t-adv')renderAdv();
  if(id==='t-kuhn'&&!kuhnInit){kuhnInit=true;kuhnTrain(20000)}
  window.scrollTo(0,0);
}

/* ============ 1. 翻前範圍練習 ============ */
let pre={pos:'BTN',hand:null,answered:false};
function gridHTML(map,mine){
  let h='<table class="grid">';
  for(let i=0;i<13;i++){h+='<tr>';for(let j=0;j<13;j++){
    const ri=12-i,rj=12-j;const l=i===j?lab(ri,ri,false):i<j?lab(ri,rj,true):lab(rj,ri,false);
    const f=map.get(l)||0;
    const bg=f>0?`rgba(46,166,106,${(0.25+0.75*f).toFixed(2)})`:'#243140';
    h+=`<td style="background:${bg}" class="${l===mine?'me':''}">${l}</td>`}h+='</tr>'}
  return h+'</table>';
}
function borderline(map){
  const arr=[];
  for(let i=0;i<13;i++)for(let j=0;j<13;j++){
    const ri=12-i,rj=12-j,l=i===j?lab(ri,ri,false):i<j?lab(ri,rj,true):lab(rj,ri,false);
    const f=map.get(l)||0;let edge=f>0&&f<1;
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const a=i+di,b=j+dj;if(a<0||b<0||a>12||b>12)continue;
      const x=12-a,y=12-b,ll=a===b?lab(x,x,false):a<b?lab(x,y,true):lab(y,x,false);
      if(((map.get(ll)||0)>0)!==(f>0))edge=true}
    if(edge)arr.push(l)}
  return arr;
}
function preNew(){
  pre.pos=POS[(Math.random()*POS.length)|0];pre.answered=false;
  let c1,c2;
  if(Math.random()<0.5){
    const bl=borderline(RM[pre.pos]);const l=bl[(Math.random()*bl.length)|0];
    const combos=expand(new Map([[l,1]]));const x=combos[(Math.random()*combos.length)|0];c1=x.a;c2=x.b;
  }else{const d=shuffled(52);c1=d[0];c2=d[1]}
  pre.hand=[c1,c2];renderPre();
}
function preAnswer(raise){
  if(pre.answered)return;pre.answered=true;
  const l=handLabel(...pre.hand),f=RM[pre.pos].get(l)||0;
  const ok=raise?f>0:f<1;S.pre.n++;if(ok)S.pre.c++;save();
  const mix=f>0&&f<1;
  const tx=f===0?'標準答案：棄牌（不在範圍內）':f===1?'標準答案：加注（純策略）':`混合策略：約 ${Math.round(f*100)}% 加注 / ${Math.round((1-f)*100)}% 棄牌，兩者皆可`;
  $('pre-res').innerHTML=`<div class="res ${ok?'ok':'bad'}"><b>${ok?'✔ 正確':'✘ 錯誤'}</b> — ${l}（${pre.pos}）<br>${tx}</div>`+gridHTML(RM[pre.pos],l)+
    `<div class="mut">綠色越深＝加注頻率越高；白框＝你的手牌。右上三角＝同花，左下三角＝不同花，對角線＝對子。</div>`;
  $('pre-next').disabled=false;$('pre-r').disabled=$('pre-f').disabled=true;
}
function renderPre(){
  const el=$('t-pre');
  el.innerHTML=`<div class="panel"><h2>翻前開池（RFI）練習</h2>
  <div class="mut">6 人桌、100bb 有效籌碼，前面所有人都棄牌，輪到你。決定：加注（開池）還是棄牌？範圍為常見圖表近似值，供建立直覺，不等同求解器輸出。</div>
  <div style="margin-top:10px">位置：<b>${pre.pos}</b></div>
  <div class="cards">${cardsHTML(pre.hand)}</div>
  <button class="b g" id="pre-r">加注</button><button class="b r" id="pre-f">棄牌</button><button class="b s" id="pre-next" disabled>下一手牌</button>
  <div id="pre-res" aria-live="polite"></div></div>
  <div class="panel"><h2>檢視各位置範圍</h2><select id="pre-view" aria-label="選擇位置">${POS.map(p=>`<option>${p}</option>`).join('')}</select><div id="pre-grid"></div></div>`;
  $('pre-r').onclick=()=>preAnswer(true);$('pre-f').onclick=()=>preAnswer(false);$('pre-next').onclick=preNew;
  const upd=()=>{const p=$('pre-view').value;const n=expand(RM[p]).reduce((s,x)=>s+x.w,0);$('pre-grid').innerHTML=gridHTML(RM[p],'')+`<div class="mut">約 ${(n/1326*100).toFixed(1)}% 的手牌（加權）。</div>`};
  $('pre-view').onchange=upd;$('pre-view').value=pre.pos;upd();
}

/* ============ 2. 勝率預測 ============ */
let eqs=null;
function randomScenario(boardN){
  const d=shuffled(52);return {hero:[d[0],d[1]],board:d.slice(2,2+boardN)};
}
function eqNew(){
  const bn=[0,3,3,4,5][(Math.random()*5)|0],sc=randomScenario(bn);
  const names=Object.keys(VRANGES);sc.vr=names[(Math.random()*names.length)|0];
  sc.truth=equity(sc.hero,sc.board,expand(VRANGES[sc.vr]),5000);sc.done=false;eqs=sc;renderEq();
}
function eqSubmit(){
  if(eqs.done)return;eqs.done=true;
  const g=+$('eq-g').value,t=eqs.truth.eq*100,err=Math.abs(g-t);
  S.eq.n++;S.eq.abs+=err;save();
  const cls=err<=3?'ok':err<=7?'warn':'bad',q=err<=3?'非常準':err<=7?'尚可':'偏差較大';
  let hint='';
  if(eqs.board.length===3||eqs.board.length===4){hint=`<br>提示：數出你的 outs，翻牌用「outs×4」、轉牌用「outs×2」估算抽牌補中機率（outs 多於 8 時可再減幾個百分點）。`}
  $('eq-res').innerHTML=`<div class="res ${cls}"><b>${q}</b>：你估 ${g}%，實際 ≈ ${t.toFixed(1)}%（誤差 ${err.toFixed(1)} 個百分點）<br>
  勝 ${(eqs.truth.win*100).toFixed(1)}% · 平 ${(eqs.truth.tie*100).toFixed(1)}% · 負 ${(eqs.truth.lose*100).toFixed(1)}%（蒙地卡羅 5000 次，約 ±0.7%）${hint}</div>
  <div class="mut">累計 ${S.eq.n} 題，平均誤差 ${(S.eq.abs/S.eq.n).toFixed(1)} 個百分點。</div>`;
  $('eq-sub').disabled=true;
}
function renderEq(){
  const e=eqs,street=['翻前','','','翻牌','轉牌','河牌'][e.board.length];
  $('t-eq').innerHTML=`<div class="panel"><h2>勝率預測練習</h2>
  <div class="mut">先憑直覺估計你的勝率，再與蒙地卡羅結果比較，訓練機率感。對手範圍已知（從該範圍均勻抽牌，並排除已見的牌）。</div>
  <div style="margin-top:8px">街道：<b>${street}</b> ｜ 對手範圍：<b>${e.vr}</b></div>
  <div class="cards">${cardsHTML(e.hero)}<span class="sep"></span>${e.board.length?cardsHTML(e.board):'<span class="mut">（尚無公共牌）</span>'}</div>
  <label for="eq-g">你的估計勝率（含平分一半）：<b id="eq-v">50</b>%</label>
  <input type="range" id="eq-g" min="0" max="100" value="50" aria-valuetext="估計勝率 50%">
  <button class="b" id="eq-sub">送出估計</button><button class="b s" id="eq-next">下一題</button>
  <div id="eq-res" aria-live="polite"></div></div>`;
  $('eq-g').oninput=()=>{$('eq-v').textContent=$('eq-g').value;$('eq-g').setAttribute('aria-valuetext','估計勝率 '+$('eq-g').value+'%')};
  $('eq-sub').onclick=eqSubmit;$('eq-next').onclick=eqNew;
}

/* ============ 3. 底池賠率 / 跟注或棄牌 ============ */
let pot=null;
function potNew(){
  const bn=Math.random()<0.6?3:4,sc=randomScenario(bn);
  const names=Object.keys(VRANGES).filter(n=>n!=='隨機手牌');sc.vr=names[(Math.random()*names.length)|0];
  const p=[6,8,10,12,16,20,30,40][(Math.random()*8)|0],fr=[0.33,0.5,0.75,1,1.5][(Math.random()*5)|0];
  sc.p=p;sc.b=Math.max(1,Math.round(p*fr));
  sc.truth=equity(sc.hero,sc.board,expand(VRANGES[sc.vr]),8000);sc.done=false;pot=sc;renderPot();

/* ============ 5. Kuhn Poker 的 CFR（GTO 演示） ============ */
let kuhnInit=false;const KN={};let kUtil=0,kIter=0;
function kStrat(n){let s=[Math.max(n.r[0],0),Math.max(n.r[1],0)];const t=s[0]+s[1];return t>0?[s[0]/t,s[1]/t]:[.5,.5]}
function kcfr(cards,h,p0,p1){
  const pl=h.length%2,opp=1-pl;
  if(h.length>1){
    if(h[h.length-1]==='p'){return h==='pp'?(cards[pl]>cards[opp]?1:-1):1}
    if(h.slice(-2)==='bb')return cards[pl]>cards[opp]?2:-2;
  }
  const key=cards[pl]+h,n=KN[key]||(KN[key]={r:[0,0],s:[0,0]}),st=kStrat(n),u=[0,0];let nu=0;
  for(let a=0;a<2;a++){const nh=h+(a?'b':'p');u[a]=pl===0?-kcfr(cards,nh,p0*st[a],p1):-kcfr(cards,nh,p0,p1*st[a]);nu+=st[a]*u[a]}
  const pr=pl===0?p1:p0,me=pl===0?p0:p1;
  for(let a=0;a<2;a++){n.r[a]+=pr*(u[a]-nu);n.s[a]+=me*st[a]}
  return nu;
}
function kuhnTrain(N){
  for(let i=0;i<N;i++){kUtil+=kcfr(shuffled(3),'',1,1);kIter++}
  renderKuhn();
}
function kAvg(key,a){const n=KN[key];if(!n)return 0;const t=n.s[0]+n.s[1];return t?n.s[a]/t:0.5}
function renderKuhn(){
  const names=['J','Q','K'];
  const rows=[['','玩家 1 先行動：下注頻率',1],['p','玩家 1 先過牌，對手下注後：跟注頻率（pb）',1],['','',0]];
  const spec=[['','P1 首動 — 下注',1],['pb','P1 過牌後遇下注 — 跟注',1],['p','P2 對手過牌 — 下注',1],['b','P2 面對下注 — 跟注',1]];
  let h='';
  for(const [hist,desc] of spec){
    h+=`<tr><td>${desc}</td>`+[0,1,2].map(c=>`<td>${names[c]}: <b>${(kAvg(c+hist,1)*100).toFixed(1)}%</b></td>`).join('')+'</tr>';
  }
  $('t-kuhn').innerHTML=`<div class="panel"><h2>CFR 演示：Kuhn Poker（3 張牌的最小撲克）</h2>
  <div class="mut">反事實後悔最小化（Counterfactual Regret Minimization）是現代撲克 AI 的核心。這裡用它在瀏覽器內即時求解 Kuhn Poker，觀察平均策略如何收斂到納許均衡。</div>
  <p>已訓練 <b>${kIter.toLocaleString()}</b> 次 ｜ 玩家 1 平均收益 <b>${(kUtil/Math.max(kIter,1)).toFixed(4)}</b>（理論值 −1/18 ≈ −0.0556）</p>
  <button class="b" id="k1">再訓練 1 萬次</button><button class="b s" id="k2">重新訓練</button>
  <table class="t"><tr><th>資訊集</th><th>J</th><th>Q</th><th>K</th></tr>${h}</table>
  <div class="res"><b>理論均衡（參數 α ∈ [0, 1/3]）</b><br>
  P1：J 以 α 下注詐唬、Q 永遠過牌、K 以 3α 下注；P1 過牌後面對下注：J 棄牌、Q 以 α+1/3 跟注、K 跟注。<br>
  P2：過牌後 J 以 1/3 詐唬下注、Q 過牌、K 下注；面對下注：J 棄牌、Q 以 1/3 跟注、K 跟注。<br>
  你會看到 K 的下注頻率 ≈ 3 × J 的下注頻率，這正是「價值下注與詐唬維持固定比例」的 GTO 精神。</div></div>`;
  $('k1').onclick=()=>kuhnTrain(10000);
  $('k2').onclick=()=>{for(const k in KN)delete KN[k];kUtil=0;kIter=0;renderKuhn()};
}

  const pot=potNow(),toCall=Math.min(G.curBet-p.bet,p.stack);
  const eff=Math.min(p.stack,...opps.map(k=>G.players[k].stack));
  let name;
  if(board.length>=3)name=HAND_NAMES[Math.floor(eval7([...p.cards,...board])/371293)];
  else name=p.cards[0]%13===p.cards[1]%13?'口袋對子':'高牌';
  let eq=1;
  for(const k of opps){
    const rg=G.street===0?expand(G.pfMap[k]&&G.pfMap[k].size?G.pfMap[k]:ALLMAP):G.rng[k];
    const r=equity(p.cards,board,rg,800);eq=Math.min(eq,r?r.eq:.5);
  }
  eq=Math.max(0,eq-0.04*Math.max(0,opps.length-1));
  const info={name,eq,pot,spr:pot>0?eff/pot:0,need:toCall>0?toCall/(pot+toCall):null,toCall,opps:opps.length,street:G.street};
  if(G.street===1||G.street===2){
    const cur=Math.floor(eval7([...p.cards,...board])/371293),used=new Set([...p.cards,...board]);let outs=0,fl=0,st=0;
    for(let c=0;c<52;c++){
      if(used.has(c))continue;const nb=[...board,c],cat=Math.floor(eval7([...p.cards,...nb])/371293),bc=Math.floor(eval7(nb)/371293);
      if(cat>cur&&cat>bc){outs++;if(cat===5||cat===8)fl++;else if(cat===4)st++}
    }

  }

}

      if(a===b&&Math.random()<.85)continue;

      return {q:`公共牌：<div class="cards">${cardsHTML(bd)}</div>玩家 A：<span class="cards" style="display:inline-flex">${cardsHTML(A)}</span>　玩家 B：<span class="cards" style="display:inline-flex">${cardsHTML(B)}</span><br>誰的牌比較大？`,

        why:`A 的最佳五張是「${ca}」，B 是「${cb}」。`+(a===b?'兩人的最佳五張完全相同，所以平分。':'牌型大者勝；牌型相同再比點數與踢腳牌。')};
    }
  },
  need(){
    const p=[6,8,10,12,16,20,30][(Math.random()*7)|0],fr=[1/3,1/2,2/3,3/4,1][(Math.random()*5)|0],b=Math.max(1,Math.round(p*fr));
    const c=Math.round(b/(p+2*b)*100),set=[c];
    for(const x of [b/(p+b)*100,b/p*100/2,p/(p+b)*100]){const r=Math.round(x);if(!set.includes(r))set.push(r)}
    while(set.length<4){let x=set[set.length-1]+7;while(set.includes(x))x++;set.push(x)}
    return {q:`底池 ${p}bb，對手下注 ${b}bb。你要跟注，至少需要多少勝率才不虧？（只看直接賠率）`,opts:set.map(x=>x+'%'),a:0,
      why:`所需勝率 = 跟注額 ÷ (底池 + 對手下注 + 跟注額) = ${b} ÷ (${p} + ${b} + ${b}) = ${b} ÷ ${p+2*b} ≈ ${c}%。`};
  },
  rfi(){
    const pos=POS[(Math.random()*POS.length)|0],m=RM[pos];
    const pure=l=>{const f=m.get(l)||0;return f===0||f===1};
    const bl=borderline(m).filter(pure),all=[...ALLMAP.keys()].filter(pure),pool=bl.length&&Math.random()<.6?bl:all,l=pool[(Math.random()*pool.length)|0];

  }

  quiz:[G_('rfi'),G_('rfi'),Q('BTN 加注到 2.5bb，想偷 1.5bb 的盲注。光靠棄牌，對手需棄牌多少才不虧？',['約 40%','約 50%','約 62.5%','約 80%'],2,'風險 2.5、獲利 1.5，打平的棄牌率 = 2.5 ÷ (2.5 + 1.5) = 62.5%。')]}
]},
{t:'機率與賠率',goal:'會數 outs、用口訣估算、算出所需勝率',lessons:[
 {id:'2.1',t:'Outs 與 2/4 口訣',prac:[['勝率預測練習','t-eq']],
  body:()=>`<p><b>Outs</b> 是指能讓你的牌變成「大概率最好牌」的剩餘牌張數。</p>
  <table class="t"><tr><th>聽牌</th><th>Outs</th></tr><tr><td>同花聽牌（差 1 張同花）</td><td>9</td></tr><tr><td>兩頭順子聽牌（OESD）</td><td>8</td></tr><tr><td>卡順（gutshot）</td><td>4</td></tr><tr><td>兩張高牌想配對（over cards）</td><td>6</td></tr><tr><td>同花 + 兩頭順子（強聽牌）</td><td>約 15</td></tr></table>
  <h3>2 與 4 口訣</h3><ul><li><b>翻牌</b>（還有兩張牌）：補中機率 ≈ outs × <b>4</b>%</li><li><b>轉牌</b>（只剩一張）：補中機率 ≈ outs × <b>2</b>%</li></ul>
  <p>例：翻牌同花聽牌 9 outs → 約 36%（精確約 35%）。轉牌 9 outs → 約 18%（精確約 19.6%）。Outs 很多（超過 8）時，×4 會略高估，可再減幾個百分點。</p>
  <div class="mut">outs 也要小心：有些 outs 補中後，仍可能輸給對手更強的牌。</div>`,
  quiz:[Q('同花聽牌（差 1 張成同花）有幾張 outs？',['4','6','8','9'],3,'每種花色 13 張，扣掉你和公共牌已看到的 4 張，剩 9 張。'),
        Q('翻牌拿到兩頭順子聽牌（8 outs），到河牌補中的機率約為？',['16%','約 32%','約 50%','約 8%'],1,'翻牌用 ×4 口訣：8 × 4 = 32%。'),
        Q('轉牌卡順（4 outs），下一張補中的機率約為？',['4%','8%','16%','32%'],1,'轉牌用 ×2 口訣：4 × 2 = 8%（精確約 8.7%）。')]},
 {id:'2.2',t:'底池賠率與所需勝率',prac:[['底池賠率練習','t-pot']],
  body:()=>`<p>面對下注時，你只付出「跟注額」就有機會贏走「底池 + 對方下注 + 你的跟注」。要不虧錢，你的勝率至少要達到：</p>
  <div class="res"><b>所需勝率 = 跟注額 ÷（底池 + 對方下注 + 跟注額）</b></div>
  <p>例：底池 10bb，對手下注 5bb。你要付 5bb，贏的總額是 10 + 5 + 5 = 20bb，所需勝率 = 5 ÷ 20 = <b>25%</b>。</p>
  <h3>常見尺碼速查</h3><table class="t"><tr><th>對手下注</th><th>所需勝率</th></tr><tr><td>1/3 底池</td><td>20%</td></tr><tr><td>1/2 底池</td><td>25%</td></tr><tr><td>2/3 底池</td><td>28.6%</td></tr><tr><td>3/4 底池</td><td>30%</td></tr><tr><td>滿池</td><td>33%</td></tr><tr><td>2 倍底池</td><td>40%</td></tr></table>
  <p>比較你的勝率（或補中機率）和所需勝率：高於它就能跟，低於它就該棄牌（先不考慮隱含賠率）。</p>`,
  quiz:[G_('need'),G_('need'),G_('need')]},
 {id:'2.3',t:'最低防守頻率與詐唬比例',prac:[['底池賠率練習','t-pot'],['CFR 演示','t-kuhn']],
  body:()=>`<p>如果你面對下注卻棄牌太多，對手可以用任何牌下注都賺錢。為了讓對手無法無腦詐唬，你需要「守住」一定比例的牌：</p>
  <div class="res"><b>最低防守頻率（MDF）= 底池 ÷（底池 + 下注）</b></div>
  <p>對手下注 1/2 底池 → MDF = 1 ÷ 1.5 ≈ <b>67%</b>；下注滿池 → MDF = <b>50%</b>。</p>
  <h3>下注方的「平衡詐唬比例」</h3><p>為了讓你跟注或棄牌都無差別，下注方的詐唬牌佔下注範圍的比例是：<b>下注 ÷（底池 + 2×下注）</b>。1/2 底池下注 → 25% 詐唬、75% 價值；滿池下注 → 33% 詐唬、67% 價值（價值：詐唬 = 2 : 1）。</p>
  <div class="mut">這是理論上的均衡概念，實戰中要依對手的傾向調整（第 6 級會學）。</div>`,
  quiz:[Q('底池 100bb，對手下注 100bb（滿池）。你的最低防守頻率約為？',['25%','33%','50%','67%'],2,'MDF = 100 ÷ (100 + 100) = 50%。'),
        Q('對手下注 1/3 底池，你的最低防守頻率約為？',['50%','67%','75%','90%'],2,'MDF = 1 ÷ (1 + 1/3) = 75%。'),
        Q('下注 1/2 底池時，平衡的詐唬牌約佔下注範圍的比例是？',['10%','25%','33%','50%'],1,'0.5 ÷ (1 + 2×0.5) = 25%。')]},
 {id:'2.4',t:'隱含賠率與實現率',prac:[['勝率預測練習','t-eq']],
  body:()=>`<p>前面的所需勝率只看「目前」的底池。但如果你補中後，還能從對手身上贏<b>更多</b>錢，就多了<b>隱含賠率</b>，實際上可以跟得更寬。</p>
  <h3>隱含賠率高的情境</h3><ul><li>籌碼很深（後面還有很多錢可以贏）。</li><li>你補中的牌很隱蔽（例如暗三條、同花聽牌補中但牌面不明顯）。</li><li>對手是愛付錢的類型（跟注站）。</li></ul>
  <h3>反隱含賠率</h3><p>如果你補中仍可能輸給更大的牌（例如較小的同花輸給較大的同花），就要打折扣。</p>
  <h3>實現率</h3><p>勝率是「打到河牌的理論勝率」，但實際上你會被逼棄牌或沒位置被壓制，無法完整「實現」。<b>在位置上、籌碼深的牌</b>實現率高；<b>沒位置的雜牌</b>實現率低，所以同樣的勝率，沒位置要更保守。</p>`,
  quiz:[Q('下列哪個情況隱含賠率最高？',['籌碼很淺','對手不會再付錢','籌碼深且補中的牌很隱蔽','牌面很危險'],2,'籌碼深、牌隱蔽，補中後能贏到更多。'),
        Q('「實現率」較低的是哪種情況？',['有位置、手牌連張同花','沒位置、手牌雜牌','按鈕位拿對子','籌碼很深的同花連張'],1,'沒位置的雜牌容易被逼棄牌，無法完整實現勝率。'),
        Q('決定要不要跟注時，除了所需勝率，還應考慮哪些因素？',['只需看底池大小','隱含賠率、位置、對手類型','只看手牌好壞','不需要考慮'],1,'隱含賠率、位置與對手類型都會影響實際期望值。')]}
]},
{t:'面對加注',goal:'會 3-bet、跟注、BB 防守，並懂得阻擋牌',lessons:[
 {id:'3.1',t:'3-bet：價值牌與詐唬牌',prac:[['面對加注練習','t-learn']],
  body:()=>`<p>有人開池後再加注，叫做 <b>3-bet</b>（大盲算第一次下注，開池是 2-bet）。</p>
  <h3>價值 3-bet</h3><p>用強牌加注，希望被較弱的牌跟注：QQ+、AK 為主。</p>
  <h3>詐唬 3-bet</h3><p>用有潛力但不夠強的牌加注，讓範圍有詐唬牌，對手不能只在你加注時棄牌就無腦打：</p>
  <ul><li><b>A5s、A4s</b>：有 A 的阻擋效果（對手更少有 AA、AK），又有同花與輪子順子的潛力。</li><li>少數同花連張（如 76s）。</li></ul>
  <h3>尺碼</h3><p>有位置約開池的 <b>3 倍</b>；沒位置（SB/BB）約 <b>4 倍</b>，因為翻後沒位置要多收錢。例：BTN 開 2.5bb，BB 3-bet 到約 10bb。</p>`,
  quiz:[Q('下列哪手牌最適合當「詐唬 3-bet」？',['QQ','AKo','A5s','JJ'],2,'A5s 有阻擋效果且有同花、順子潛力，被跟注時也還有勝率。'),
        Q('BTN 開 2.5bb，BB 想 3-bet，常見尺碼約為？',['約 5bb','約 7bb','約 10–11bb','約 30bb'],2,'沒位置約 4 倍開池：2.5 × 4 = 10bb。'),
        Q('為什麼要在 3-bet 範圍中放詐唬牌？',['為了好玩','讓對手不能只靠棄牌就輕易應付你的加注','因為規則要求','讓底池變小'],1,'平衡的範圍讓對手對你的加注難以調整。')]},
 {id:'3.2',t:'跟注還是 3-bet？',prac:[['面對加注練習','t-learn']],
  body:()=>`<p>面對加注時有三個選擇：棄牌、跟注、3-bet。</p>
  <ul><li><b>強牌</b>（QQ+、AK）：3-bet 為主，偶爾跟注。</li><li><b>中等牌</b>（77–TT、AQ、KQs、同花連張）：<b>跟注</b>為主。這些牌常有不錯的勝率，但被 4-bet 時不好辦，所以不一定要 3-bet。</li><li><b>弱牌</b>：棄牌，或偶爾拿來當詐唬 3-bet。</li></ul>
  <h3>位置的影響</h3><ul><li><b>有位置</b>（BTN 面對 CO）：可以跟注更多牌，因為翻後有優勢。</li><li><b>沒位置</b>（SB 面對 BTN）：跟注的實現率差，而且後面還有 BB，所以傾向「3-bet 或棄牌」，很少只跟注。</li></ul>`,
  quiz:[Q('在 BTN 面對 CO 的開池加注，77 通常怎麼打？',['必定 3-bet','主要以跟注為主','必定棄牌','全下'],1,'中等對子在有位置時，跟注看翻牌的價值很高。'),
        Q('SB 面對 BTN 的開池，為什麼很少只跟注？',['規則不允許','沒位置、後面還有 BB，跟注實現率差','SB 籌碼太少','SB 手牌比較好'],1,'沒位置又有 BB 在後，傾向 3-bet 或棄牌。'),
        Q('強牌（如 QQ、AK）面對開池，主要做法是？',['3-bet','必定棄牌','過牌','每次都只跟注'],0,'強牌 3-bet 取價值，是標準打法。')]},
 {id:'3.3',t:'BB 防守與底池賠率',prac:[['面對加注練習','t-learn']],
  body:()=>`<p>大盲已經投入了 1bb，面對開池時價格最便宜，所以防守範圍是所有位置中最寬的。</p>
  <h3>算算看：BB 面對 BTN 開 2.5bb</h3><ul><li>底池 = 2.5（BTN）+ 1（你的 BB）+ 0.5（SB）= <b>4bb</b></li><li>你只需再付 <b>1.5bb</b></li><li>所需勝率 = 1.5 ÷ (4 + 1.5) ≈ <b>27%</b></li></ul>
  <p>27% 的勝率門檻很低，大多數牌都達得到，所以 BB 對 BTN 可以防守 <b>45–55%</b> 左右的牌（本練習器為簡化近似）。</p>
  <h3>對不同位置的調整</h3><p>對手位置越前，開池範圍越緊、越強，你的防守範圍也要隨之收緊：BB 對 UTG 防守的牌明顯少於對 BTN。</p>
  <div class="mut">實際上還要考慮翻後沒位置的實現率，所以不會 100% 防守所有達標的牌。</div>`,
  quiz:[Q('BB 面對 BTN 開 2.5bb（SB 已投 0.5），你跟注的所需勝率約為？',['約 15%','約 27%','約 40%','約 50%'],1,'1.5 ÷ (4 + 1.5) ≈ 27%。'),
        Q('BB 防守範圍通常比其他位置面對開池時如何？',['更窄','一樣','更寬','不能防守'],2,'已投入 1bb，價格最便宜，防守最寬。'),
        Q('BB 面對 UTG 的開池，防守範圍會比面對 BTN 時？',['更寬','更窄','完全相同','不需要考慮'],1,'UTG 的範圍較強，所以要收緊。')]}
]},
{t:'翻後基礎',goal:'學會持續下注、價值下注、聽牌打法與牌面判讀',lessons:[
 {id:'4.1',t:'牌面結構與範圍優勢',prac:[['模擬比賽（從翻牌開始）','t-sim']],
  body:()=>`<h3>牌面分類</h3><ul><li><b>乾燥牌面</b>（如 K♠7♦2♣）：不連張、不同花，牌力不容易改變。</li><li><b>濕潤牌面</b>（如 J♥T♥9♣）：連張、同花聽牌多，牌力容易翻轉。</li><li><b>配對牌面</b>（如 8♠8♦3♣）：有人可能有三條。</li></ul>
  <h3>範圍優勢</h3><p>翻前加注的人，範圍裡有較多 AA、KK、AK 這類強牌，所以在 <b>A、K 高的牌面</b>通常有<b>範圍優勢</b>；而跟注者的範圍有較多中低連張，在<b>低連牌面</b>反而不吃虧。</p>
  <ul><li>有範圍優勢 → 可以<b>高頻率、小尺碼</b>下注。</li><li>沒有範圍優勢 → 多<b>過牌</b>，只用強牌和好聽牌下注。</li></ul>`,
  quiz:[Q('J♥T♥9♣ 屬於哪種牌面？',['乾燥','濕潤（聽牌多）','配對','很安全'],1,'連張、同花聽牌多，牌力容易翻轉。'),
        Q('翻前加注者在 A♠7♦2♣ 這種牌面通常？',['沒有範圍優勢','有範圍優勢，可高頻小注','必定過牌','不能下注'],1,'加注者範圍內有較多 A 與強牌，通常有範圍優勢。'),
        Q('沒有範圍優勢時，比較合理的做法是？',['每次都大注','多過牌，只用強牌與好聽牌下注','全部棄牌','只跟注'],1,'範圍較弱時，要用更少、更有選擇的牌下注。')]},
 {id:'4.2',t:'持續下注（c-bet）',prac:[['模擬比賽（從翻牌開始）','t-sim']],
  body:()=>`<p><b>持續下注（continuation bet, c-bet）</b>是指翻前加注者，在翻牌圈繼續下注。因為你翻前展示了強度，對手多半沒中，所以常能直接贏下底池。</p>
  <h3>基本原則</h3><ul><li><b>乾燥牌面</b>：小尺碼（約 1/3 底池）、高頻率。</li><li><b>濕潤牌面</b>：尺碼較大、頻率較低，用強牌與好聽牌下注，其他多過牌。</li><li><b>多人底池</b>：少 c-bet，因為有人中牌的機率更高。</li><li><b>有位置</b>時 c-bet 的選擇更彈性，沒位置時更需謹慎。</li></ul>
  <h3>檢查：值不值得下注？</h3><p>問自己：我是想讓更差的牌付錢（價值）、想讓更好的牌棄牌（詐唬），還是想保護自己的牌不被免費補牌？三個都不是，就先過牌。</p>`,
  quiz:[Q('在乾燥牌面（K♠7♦2♣）上，翻前加注者常用的 c-bet 是？',['極少下注','高頻率、小尺碼','每次都全下','只用最強牌'],1,'乾燥牌面範圍優勢明顯，小注就能獲利。'),
        Q('多人底池中，c-bet 頻率通常會？',['提高','降低','不變','改成全下'],1,'人越多，有人中牌的機率越高，詐唬成功率低。'),
        Q('下注前，應該先問自己的問題是？',['對手會不會生氣','下注是為了價值、詐唬，還是保護','我是不是很無聊','今天幸不幸運'],1,'每個下注都應有目的：價值、詐唬或保護。')]},
 {id:'4.3',t:'價值下注與尺碼',prac:[['模擬比賽（從翻牌開始）','t-sim']],
  body:()=>`<p><b>價值下注</b>是指拿著好牌下注，希望被<b>更差的牌</b>跟注。</p>
  <h3>選尺碼的核心問題</h3><p>「我能下注多大，而仍然會被更差的牌跟注？」尺碼太大，只有比你強的牌會跟；太小，則錯失價值。</p>
  <ul><li><b>薄價值</b>：頂對好踢腳、中對等，在乾燥牌面河牌下小注（約 1/3–1/2 底池）。</li><li><b>強牌</b>：在濕潤牌面要下大一點，同時避免讓對手便宜看到聽牌。</li><li><b>河牌極化範圍</b>：只剩堅果牌與詐唬牌時，可用大注（滿池以上）。</li></ul>
  <h3>不要自己嚇自己</h3><p>很多新手拿到不錯的牌卻過牌，怕被加注。如果有大量更差的牌會跟你，你下注就是在<b>少賺錢</b>的反面——過牌才是錯失價值。</p>`,
  quiz:[Q('價值下注的目的是？',['讓對手棄牌','讓更差的牌跟注','純粹嚇人','增加變異'],1,'價值下注就是要讓較差的牌付錢。'),
        Q('河牌圈你有頂對好踢腳、牌面乾燥，常見的做法是？',['必定過牌','小到中尺碼薄價值下注','全下','棄牌'],1,'乾燥牌面頂對常能被更差的對子跟注，值得下注。'),
        Q('選價值下注尺碼時，最關鍵的問題是？',['對手長相','最大尺碼下仍會被更差牌跟注','今天有多少籌碼','隨機'],1,'尺碼要讓更差的牌仍願意跟。')]},
 {id:'4.4',t:'聽牌與半詐唬',prac:[['模擬比賽（從翻牌開始）','t-sim']],
  body:()=>`<p><b>半詐唬</b>：用還沒成牌的聽牌下注或加注。它有兩種獲利來源：</p>
  <ol><li><b>棄牌收益</b>：對手棄牌，你直接贏池。</li><li><b>補牌收益</b>：被跟注時，你還有機會補中。</li></ol>
  <h3>什麼聽牌適合半詐唬？</h3><ul><li><b>強聽牌</b>（同花 + 順子，約 12–15 outs）：常常直接加注，因為勝率接近領先牌。</li><li><b>普通聽牌</b>（單純同花聽牌、兩頭順子）：可以下注，也可以過牌跟注。</li><li><b>弱聽牌</b>（卡順）：多半只在對手容易棄牌時才當詐唬。</li></ul>
  <p>另外 <b>有阻擋牌</b>（如手握 A、讓對手更少有堅果）的聽牌更適合當詐唬。</p>`,
  quiz:[Q('半詐唬有哪兩種獲利來源？',['棄牌收益與補牌收益','只有棄牌收益','只有補牌收益','都沒有'],0,'對手棄牌直接贏，被跟注也有機會補中。'),
        Q('同花 + 順子的強聽牌（約 15 outs）通常適合？',['直接棄牌','常常加注（強半詐唬）','永遠過牌','只能跟注'],1,'勝率接近領先牌，加注能同時獲得棄牌收益與補牌收益。'),
        Q('下列哪種聽牌最不適合當半詐唬？',['同花聽牌','兩頭順子聽牌','卡順（4 outs）','同花加順子聽牌'],2,'卡順只有 4 outs，補中機率低，半詐唬的價值也低。')]}
]},
{t:'GTO 核心概念',goal:'理解均衡、混合策略與詐唬價值比，並能入門閱讀論文',lessons:[
 {id:'5.1',t:'什麼是 GTO？',prac:[['CFR 演示','t-kuhn']],
  body:()=>`<p>GTO（Game Theory Optimal，博弈論最佳）的核心是<b>納許均衡</b>：任何一方單獨改變策略，都不會獲得更多收益。換句話說，GTO 策略是「<b>無法被剝削</b>」的。</p>
  <h3>用剪刀石頭布理解</h3><p>最佳策略是三種各 1/3 隨機出。你不能預測，對手也無法針對你。但注意：如果對手只出石頭，GTO 的 1/3 隨機<b>不會</b>贏最多；剝削對手（一直出布）才賺得最多。</p>
  <h3>GTO ≠ 最賺錢</h3><ul><li>GTO：保證不會輸給任何對手（理想上）。</li><li>剝削：針對對手的弱點調整，贏得更多，但也讓自己有被反剝削的風險。</li></ul>
  <p>實戰的建議：<b>以 GTO 當基準，遇到明顯弱點時再偏離</b>。</p>`,
  quiz:[Q('GTO 策略的核心特性是？',['永遠贏最多','無法被剝削','永遠詐唬','只打強牌'],1,'均衡策略讓對手無法透過調整來獲利。'),
        Q('對手明顯一直出石頭時，最賺的做法是？',['堅持 1/3 隨機','一直出布（剝削）','隨便','換遊戲'],1,'剝削能贏得比均衡更多。'),
        Q('實戰建議的使用方式是？',['完全照 GTO，不調整','以 GTO 為基準，遇到明顯弱點再偏離','完全不管 GTO','只看對手長相'],1,'基準加調整，兼顧穩定與獲利。')]},
 {id:'5.2',t:'混合策略與詐唬價值比',prac:[['CFR 演示','t-kuhn']],
  body:()=>`<p>在均衡裡，同一手牌常常「有時加注、有時過牌」，這叫<b>混合策略</b>。原因是：如果你每次都做一樣的事，對手就能針對你調整。</p>
  <h3>無差異</h3><p>均衡的目標是讓對手對「跟注或棄牌」感覺<b>無差異</b>：不管選哪個，期望值都一樣。要做到這點，你的下注範圍要有固定比例的價值牌和詐唬牌：</p>
  <table class="t"><tr><th>下注尺碼</th><th>詐唬佔比</th><th>價值 : 詐唬</th></tr><tr><td>1/3 底池</td><td>20%</td><td>4 : 1</td></tr><tr><td>1/2 底池</td><td>25%</td><td>3 : 1</td></tr><tr><td>滿池</td><td>33%</td><td>2 : 1</td></tr></table>
  <h3>去「CFR 演示」看看</h3><p>在 Kuhn Poker 的訓練結果裡，你會看到：持最強牌 K 的下注頻率，約是持最弱牌 J 的 <b>3 倍</b>——這正是價值牌與詐唬牌維持固定比例的體現。</p>`,
  quiz:[Q('為什麼均衡策略常要「混合」？',['為了好看','讓對手無法針對你調整','因為規則','因為計算機壞掉'],1,'固定的策略會被對手利用。'),
        Q('用滿池下注時，均衡的價值牌與詐唬牌比例約為？',['1 : 1','2 : 1','4 : 1','10 : 1'],1,'滿池時詐唬佔 33%，所以價值 : 詐唬 = 2 : 1。'),
        Q('「無差異」是指？',['對手不在乎','對手面對下注，跟注或棄牌的期望值相同','你不在乎輸贏','兩人籌碼相同'],1,'均衡中，對手的跟注與棄牌期望值相等。')]},
 {id:'5.3',t:'求解器與論文入門',prac:[['論文索引','t-paper']],
  body:()=>`<p>現代撲克 AI 的核心方法是<b>反事實後悔最小化（CFR）</b>：讓程式自我對弈無數次，每次回頭檢討「如果當時換個動作會更好嗎」，並逐漸逼近均衡。</p>
  <h3>求解器輸出怎麼讀？</h3><ul><li><b>頻率</b>：每個動作被選擇的比例（如加注 40%、過牌 60%）。</li><li><b>EV</b>：期望值，通常以 bb 計。</li><li><b>勝率（equity）</b>：對對手範圍的理論勝率。</li></ul>
  <h3>求解器的限制</h3><ul><li>為了能算出結果，會<b>簡化</b>：只允許少數幾種下注尺碼、把類似的牌歸類。</li><li>假設對手也打得完美，面對真人時未必是最佳策略。</li><li>輸出是「平均」策略，不要硬背單一結果，要找出<b>規律與原因</b>。</li></ul>
  <h3>怎麼開始讀論文？</h3><p>先看摘要、圖表與結論，確認論文要解決什麼問題。本練習器的「論文索引」分頁整理了近五年的相關論文，可以從綜述與 CFR 新演算法開始。</p>`,
  quiz:[Q('CFR 的基本精神是？',['隨機亂打','自我對弈並檢討「換個動作會不會更好」','只看牌的大小','永遠詐唬'],1,'CFR 透過反覆自我對弈與後悔值更新逼近均衡。'),
        Q('求解器輸出常見是什麼形式？',['每個動作的頻率與 EV','固定的單一動作','只有輸贏','影片'],0,'輸出是各動作的頻率與期望值。'),
        Q('使用求解器結果時，下列何者較正確？',['完全照抄就好','要找出背後規律，並了解簡化與限制','不需要看','只看一次結果'],1,'求解器有簡化與假設，理解原因比背結果更重要。')]}
]},

 {id:'6.1',t:'HUD 指標入門',prac:[['模擬比賽（顯示對手風格）','t-sim']],
  body:()=>`<p>HUD（抬頭顯示）是用統計數字推測對手風格。常看三個：</p>

  <h3>經驗法則（6 人桌，僅供參考）</h3><ul><li><b>緊兇</b>：V 約 15–20，P 約 12–18，AF 高。</li><li><b>鬆兇</b>：V 28 以上，P 約 22 以上，AF 高。</li><li><b>跟注站</b>：V 高（30 以上），P 低（10 以下），AF 低（1 以下）。</li></ul>

 {id:'6.2',t:'依對手類型調整',prac:[['模擬比賽（顯示對手風格）','t-sim']],
  body:()=>`<p>知道對手類型後，從 GTO 基準做以下調整：</p>

 {id:'6.3',t:'多人底池與 SPR',prac:[['模擬比賽（即時資訊）','t-sim']],
  body:()=>`<h3>多人底池</h3><ul><li>人越多，有人中牌的機率越高，你的牌<b>實際勝率比對單一對手時低</b>。</li><li><b>少詐唬</b>：要讓所有人都棄牌很困難。</li><li>下注範圍要更強，頂對有時就不夠。</li></ul>

{t:'檢討與實戰管理',goal:'學會複盤、分類錯誤，並建立資金與心態管理習慣',lessons:[
 {id:'7.1',t:'複盤方法',prac:[['手牌歷史','t-hist']],
  body:()=>`<p>進步最快的方法是<b>檢討自己打過的手牌</b>。建議流程：</p>
  <ol><li><b>標記</b>：在「手牌歷史」把想檢討的手牌打星號（輸大池、不確定的決策）。</li><li><b>找決策點</b>：這手牌我在哪一步做了重要選擇？</li><li><b>算賠率</b>：當時的所需勝率與我的勝率是多少？</li><li><b>對照建議</b>：和提示的頻率比較，差在哪裡？</li><li><b>分類錯誤</b>：是過度棄牌、過度跟注、過度加注，還是太被動？</li><li><b>訂目標</b>：下次練習特別注意最常犯的那一類。</li></ol>

 {id:'7.2',t:'資金管理與心態',prac:[['手牌歷史','t-hist']],
  body:()=>`<div class="res warn"><b>重要提醒</b>：本練習器是教學工具，沒有真錢。若你日後在真錢環境遊玩，請只用你能承受損失的錢。</div>
  <h3>資金管理（bankroll）</h3><ul><li>撲克有很大的運氣波動（變異），即使技術好也會連續輸。</li><li>很多玩家用「資金需有 20–40 個買入」作為粗略參考，但這因人、因遊戲而異，沒有標準答案。</li><li>先設定損失上限，避免為了回本而提高賭注。</li></ul>

let CS={done:{}};
try{CS=Object.assign(CS,JSON.parse(localStorage.getItem('gtoCourse')||'{}'))}catch(e){}
const saveCS=()=>{try{localStorage.setItem('gtoCourse',JSON.stringify(CS))}catch(e){}};
let CV={lv:null,ls:null,qs:[],done:false};
const flatLessons=()=>COURSE.flatMap((L,l)=>L.lessons.map((x,i)=>[l,i]));
const nextUndone=()=>flatLessons().find(([l,i])=>!CS.done[COURSE[l].lessons[i].id])||null;
function pracList(l){
  const pct=(c,n)=>n?Math.round(c/n*100):0,P=[];
  const hist=SIM.hist||[];
  if(l===1)P.push({t:`翻前範圍練習：30 題、正確率 ≥ 85%（目前 ${S.pre.n} 題，${pct(S.pre.c,S.pre.n)}%）`,ok:S.pre.n>=30&&S.pre.c/S.pre.n>=.85});
  if(l===2){P.push({t:`勝率預測：至少 20 題，平均誤差 < 5 個百分點（目前 ${S.eq.n} 題，${S.eq.n?(S.eq.abs/S.eq.n).toFixed(1):'—'}）`,ok:S.eq.n>=20&&S.eq.abs/S.eq.n<5});
    P.push({t:`底池賠率：至少 20 題、正確率 ≥ 80%（目前 ${S.pot.n} 題，${pct(S.pot.c,S.pot.n)}%）`,ok:S.pot.n>=20&&S.pot.c/S.pot.n>=.8})}
  if(l===3)P.push({t:`面對加注練習：至少 50 題、正確率 ≥ 80%（目前 ${S.face.n} 題，${pct(S.face.c,S.face.n)}%）`,ok:S.face.n>=50&&S.face.c/S.face.n>=.8});
  if(l===4){const h=hist.slice(-50),d=h.flatMap(r=>r.dec),ok=d.filter(x=>x.ok).length;
    P.push({t:`模擬比賽：打滿 50 手、符合率 ≥ 75%（目前 ${hist.length} 手，最近 ${d.length?pct(ok,d.length):0}%）`,ok:h.length>=50&&d.length&&ok/d.length>=.75})}
  if(l===5)P.push({t:'在「CFR 演示」訓練 20,000 次以上，觀察 K 與 J 的下注頻率比（自我檢查）',ok:null});
  if(l===6)P.push({t:'比賽中打開「顯示對手風格」前，先用 HUD 猜 5 位對手的風格（自我檢查）',ok:null});
  if(l===7)P.push({t:`在手牌歷史標記並複盤 3 手牌（目前已標記 ${hist.filter(r=>r.star).length} 手）`,ok:hist.filter(r=>r.star).length>=3});
  return P;
}

/* ============ 本手檢討：所有人的牌、位置分析、實際勝率 ============ */
const POS_NOTE={
  UTG:'最前位：後面還有 5 人未行動，範圍最緊；翻後多半沒有位置。',
  HJ:'中位：範圍略寬於 UTG。',
  CO:'按鈕前一位：範圍偏寬，常用來偷盲；翻後只輸給按鈕位。',
  BTN:'按鈕位（莊位）：翻後最後行動，位置優勢最大，開池範圍最寬。',
  SB:'小盲：已投 0.5bb，但翻後最先行動（最不利），面對開池傾向 3-bet 或棄牌。',
  BB:'大盲：已投 1bb，面對開池價格最便宜，防守範圍最寬；但翻後沒有位置。'
};
function eqMulti(hands,board,iters){
  const used=new Set(board);hands.forEach(h=>h.forEach(c=>used.add(c)));
  const base=[];for(let c=0;c<52;c++)if(!used.has(c))base.push(c);
  const need=5-board.length,res=hands.map(()=>0);
  for(let i=0;i<iters;i++){
    const d=base.slice(),bd=board.slice();
    for(let k=0;k<need;k++){const j=k+((Math.random()*(d.length-k))|0);const t=d[k];d[k]=d[j];d[j]=t;bd.push(d[k])}
    let best=-1,w=[];
    hands.forEach((h,x)=>{const sc=eval7([...h,...bd]);if(sc>best){best=sc;w=[x]}else if(sc===best)w.push(x)});
    w.forEach(x=>{res[x]+=1/w.length});
  }
  return res.map(r=>r/iters);
}
function buildReview(){
  const pl=G.players.map((p,k)=>({k,n:p.name,pos:posName(k),cards:p.cards.slice(),fold:p.folded,style:k?SIM.styles[k]:null,
    acts:(G.rec[k]||[]).map(a=>({s:a.s,cat:a.cat,ok:a.ok,text:a.text}))}));
  const eq={};
  for(const s of [0,1,2,3]){
    const idx=G.seen[s>0?s:1];if(!idx||idx.length<2)continue;
    const board=G.full.slice(0,[0,3,4,5][s]);
    eq[s]={idx:idx.slice(),v:eqMulti(idx.map(k=>G.players[k].cards),board,1500)};
  }
  return {pl,eq};
}

/* ============ 9 人桌、錦標賽（SNG）、ICM ============ */
// ---- 位置與範圍（9 人桌新增位置；單挑範圍）----
const AFTER_BB={0:[],1:['CO'],2:['HJ','CO'],3:['UTG','HJ','CO'],4:['UTG','LJ','HJ','CO'],5:['UTG','UTG1','LJ','HJ','CO'],6:['UTG','UTG1','MP','LJ','HJ','CO']};
const RFI9={
  UTG:"77+,ATs+,KQs,KJs:0.5,AQo+,AJo:0.3",
  UTG1:"66+,ATs+,KJs+,QJs,JTs:0.5,AQo+,AJo:0.5",
  MP:"55+,A9s+,A5s,KTs+,QTs+,JTs,T9s:0.5,AJo+,KQo",
  LJ:"44+,A8s+,A5s,A4s:0.5,K9s+,Q9s+,J9s+,T9s,98s:0.5,ATo+,KQo,KJo:0.5"
};
const RM9={};for(const k in RFI9)RM9[k]=parseRange(RFI9[k]);
const HU_R=parseRange("22+,A2s+,K2s+,Q2s+,J4s+,T6s+,96s+,85s+,75s+,64s+,54s,A2o+,K2o+,Q4o+,J7o+,T7o+,97o+,87o");
const p6=pos=>({UTG1:'UTG',MP:'UTG',LJ:'HJ'}[pos]||pos);
function rangeFor(pos,n){
  if(n===2&&pos==='BTN')return HU_R;
  if(n>=7&&RM9[pos])return RM9[pos];
  return RM[pos]||RM.CO;
}
function posList(N){return ['BTN','SB','BB',...AFTER_BB[N-3]]}

// ---- ICM（Malmuth–Harville）----
function icmEq(stacks,payouts){
  const ids=[];stacks.forEach((s,i)=>{if(s>1e-9)ids.push(i)});
  const n=ids.length,res=stacks.map(()=>0);if(!n)return res;
  const s=ids.map(i=>stacks[i]),P=[];for(let k=0;k<n;k++)P.push(payouts[k]||0);
  let paid=0;P.forEach((x,k)=>{if(x>0)paid=k+1});
  const memo=new Map();
  function f(mask,place){
    if(mask===0||place>=paid)return new Array(n).fill(0);
    const key=mask*16+place;if(memo.has(key))return memo.get(key);
    let tot=0;for(let i=0;i<n;i++)if(mask&(1<<i))tot+=s[i];
    const out=new Array(n).fill(0);
    for(let i=0;i<n;i++)if(mask&(1<<i)){
      const p=s[i]/tot;out[i]+=p*P[place];
      const sub=f(mask&~(1<<i),place+1);for(let j=0;j<n;j++)out[j]+=p*sub[j];
    }
    memo.set(key,out);return out;
  }
  const r=f((1<<n)-1,0);ids.forEach((id,k)=>{res[id]=r[k]});return res;
}
// 純函式：你（i）跟注對手（j）全下的 ICM 所需勝率。dead＝其他人留在底池的死錢。
function icmCall(base,i,j,pay,dead){
  const hero=base[i],vil=base[j],E=Math.min(hero,vil);
  const eNow=icmEq(base,pay)[i];
  const w=base.slice();w[i]=hero+E+dead;w[j]=vil-E;
  const l=base.slice();l[i]=hero-E;l[j]=vil+E+dead;
  const eW=icmEq(w,pay)[i],eL=icmEq(l,pay)[i];
  const need=eW-eL>1e-9?(eNow-eL)/(eW-eL):0.5;
  return {need:Math.max(0,Math.min(1,need)),bf:eW-eNow>1e-9?(eNow-eL)/(eW-eNow):1,eNow,eW,eL,chipNeed:E/(2*E+dead)};
}
function icmNeed(i,j){
  const P=G.players,base=P.map(q=>q.dead?0:(q.folded?q.stack:q.stack+q.bet));
  let dead=0;P.forEach((q,k)=>{if(k!==i&&k!==j&&q.folded&&!q.dead)dead+=q.total});
  return icmCall(base,i,j,TN.payouts,dead);
}

// ---- 手牌強弱排序（Chen 公式近似）與全下範圍 ----
function chen(l){
  const r1=RANKS.indexOf(l[0]),r2=RANKS.indexOf(l[1]),hi=Math.max(r1,r2),lo=Math.min(r1,r2),suited=l[2]==='s',pair=l.length===2;
  const pts=r=>r===12?10:r===11?8:r===10?7:r===9?6:(r+2)/2;
  let s=pts(hi);
  if(pair)return Math.ceil(Math.max(5,s*2))+hi*0.01;
  if(suited)s+=2;
  const gap=hi-lo-1;s-=gap===0?0:gap===1?1:gap===2?2:gap===3?4:5;
  if(gap<=1&&hi<10)s+=1;
  return Math.ceil(s)+hi*0.01+lo*0.001+(suited?0.0005:0);
}
let HAND_ORD=null;const PCT_CACHE={};
function handOrder(){if(!HAND_ORD)HAND_ORD=[...ALLMAP.keys()].sort((a,b)=>chen(b)-chen(a));return HAND_ORD}
const lcount=l=>l.length===2?6:l[2]==='s'?4:12;
function pctMap(pct){
  const key=Math.max(1,Math.min(100,Math.round(pct)));if(PCT_CACHE[key])return PCT_CACHE[key];
  const m=new Map(),target=key/100*1326;let cum=0;
  for(const l of handOrder()){if(cum>=target)break;const c=lcount(l),f=Math.min(1,(target-cum)/c);m.set(l,f);cum+=c}
  return PCT_CACHE[key]=m;
}
const SHOVE_BASE={UTG:12,UTG1:13,MP:15,LJ:17,HJ:22,CO:30,BTN:45,SB:55,HU:75,BB:100};
function shovePct(pos,eff){return Math.max(3,Math.min(100,(SHOVE_BASE[pos]||30)*Math.pow(10/Math.max(eff,2),0.9)))}
function effStackBB(i){
  const p=G.players[i];let m=0;G.players.forEach((q,k)=>{if(k!==i&&!q.folded)m=Math.max(m,q.stack+q.bet)});
  return Math.min(p.stack+p.bet,m||p.stack+p.bet);
}

// ---- 錦標賽狀態 ----
const BLIND_LEVELS=[[10,20],[15,30],[25,50],[50,100],[75,150],[100,200],[150,300],[200,400],[300,600],[400,800],[500,1000],[700,1400],[1000,2000],[1500,3000],[2000,4000]];
let TN=null;
SIM.sngHist=[];
try{const h=JSON.parse(localStorage.getItem('gtoSng')||'[]');if(Array.isArray(h))SIM.sngHist=h}catch(e){}
function startTournament(){
  const n=SIM.n,pool=n*100,pcts=n===9?[0.5,0.3,0.2]:[0.65,0.35];
  TN={chips:Array(n).fill(1500),level:0,handsInLevel:0,place:[],prize:[],payouts:pcts.map(p=>Math.round(p*pool)),over:false,heroPlace:null,bustedNow:[],logged:false};
}
function tournamentUpdate(){
  const bb=G.bbAmt,start=G.players.map((p,k)=>k).filter(k=>!G.players[k].dead);
  start.forEach(k=>{TN.chips[k]=Math.max(0,G.players[k].stack*bb)});
  const busts=start.filter(k=>TN.chips[k]<=1e-6).sort((a,b)=>G.startStack[a]-G.startStack[b]);
  let place=start.length;
  busts.forEach(k=>{TN.chips[k]=0;TN.place[k]=place;TN.prize[k]=TN.payouts[place-1]||0;place--});
  TN.bustedNow=busts;
  const left=start.length-busts.length;
  if(TN.chips[0]<=1e-6){TN.over=true;TN.heroPlace=TN.place[0]}
  else if(left===1){const w=start.find(k=>TN.chips[k]>1e-6);TN.place[w]=1;TN.prize[w]=TN.payouts[0]||0;TN.over=true;TN.heroPlace=TN.place[0]}
  if(TN.over&&!TN.logged){
    TN.logged=true;
    SIM.sngHist.push({t:Date.now(),n:SIM.n,place:TN.heroPlace,prize:TN.prize[0]||0,hands:SIM.hands});
    try{localStorage.setItem('gtoSng',JSON.stringify(SIM.sngHist.slice(-100)))}catch(e){}
  }
  TN.handsInLevel++;
  if(TN.handsInLevel>=SIM.levelHands&&TN.level<BLIND_LEVELS.length-1){TN.level++;TN.handsInLevel=0}
}

// ---- 短碼「推或棄牌」與全下跟注（含 ICM）建議 ----
function shortAdvice(i){
  if(G.street!==0)return null;
  const p=G.players[i],pos=posName(i),l=handLabel(p.cards[0],p.cards[1]),n=G.nAlive;
  const rp=(n===2&&pos==='BTN')?'HU':pos,eff=effStackBB(i),pc=x=>Math.round(x*100)+'%';
  const toCall=Math.min(G.curBet-p.bet,p.stack);
  const jam=G.players.findIndex((q,k)=>k!==i&&!q.folded&&q.allin&&q.bet>p.bet+1e-9);
  if(jam>=0){
    const v=G.players[jam],vp=posName(jam),vrp=(n===2&&vp==='BTN')?'HU':vp,vpct=Math.round(shovePct(vrp,effStackBB(jam)));
    const r=equity(p.cards,[],expand(pctMap(vpct)),700),eq=r?r.eq:0.5;
    const isT=SIM.mode==='sng'&&!!TN,ic=isT?icmNeed(i,jam):(()=>{const cn=toCall/(potNow()+toCall);return {need:cn,chipNeed:cn,bf:1}})(),need=ic.need,m=eq-need;
    const acts=m>=0.03?{r:0,c:1,f:0}:m>-0.03?{r:0,c:.5,f:.5}:{r:0,c:0,f:1};

    let el=[];for(let k=0;k<n;k++)if(!P[k].folded&&tot[k]>=lv-1e-9)el.push(k);
    if(!el.length){let m=-1;for(let k=0;k<n;k++)if(!P[k].folded&&tot[k]>m)m=tot[k];for(let k=0;k<n;k++)if(!P[k].folded&&tot[k]===m)el.push(k)}

/* ============ ICM 練習：計算機與「泡沫期跟注全下」題 ============ */
const ICMS={sc:null,answered:false};
const icmStat=()=>{S.icm=S.icm||{n:0,c:0};return S.icm};
function icmGen(){
  const pay=[50,30,20],rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  let last=null;
  for(let t=0;t<30;t++){
    const hero=rnd(10,30),vil=rnd(6,hero),a=rnd(12,40),b=rnd(12,40),base=[hero,vil,a,b],dead=1.5;
    const ic=icmCall(base,0,1,pay,dead),vpct=Math.round(shovePct('BTN',vil)),rg=expand(pctMap(vpct));
    let best=null;
    for(let k=0;k<14;k++){
      const d=shuffled(52),h=[d[0],d[1]],r=equity(h,[],rg,500);if(!r)continue;
      const diff=Math.abs(r.eq-ic.need);if(!best||diff<best.diff)best={h,eq:r.eq,diff};
    }
    if(!best)continue;last={base,dead,pay,vpct,ic,hand:best.h,eq:best.eq};
    if(best.diff<0.1)return last;
  }
  return last;
}
function icmNew(){ICMS.sc=icmGen();ICMS.answered=false;renderIcm()}
function icmAnswer(call){
  if(ICMS.answered)return;ICMS.answered=true;
  const s=ICMS.sc,pc=x=>(x*100).toFixed(1)+'%',diff=s.eq-s.ic.need,close=Math.abs(diff)<0.015;
  const right=diff>=0,ok=close||call===right;
  const st=icmStat();st.n++;if(ok)st.c++;save();
  const chipOK=s.eq>=s.ic.chipNeed;
  $('icm-res').innerHTML=`<div class="res ${ok?'ok':'bad'}"><b>${ok?'✔ 正確':'✘ 錯誤'}</b> — ${close?'非常接近門檻，跟注或棄牌差異很小。':right?'你的勝率高於 ICM 所需勝率，跟注。':'你的勝率低於 ICM 所需勝率，應棄牌。'}<br>
  你的勝率對對手全下範圍（約前 ${s.vpct}%）：<b>${pc(s.eq)}</b><br>
  只看籌碼（籌碼 EV）所需勝率：<b>${pc(s.ic.chipNeed)}</b> → ${chipOK?'籌碼 EV 會跟注':'籌碼 EV 也會棄牌'}<br>
  考慮 ICM 後所需勝率：<b>${pc(s.ic.need)}</b>（氣泡因子 ${s.ic.bf.toFixed(2)}）<br>
  <span class="mut">你目前的 ICM 價值 ${s.ic.eNow.toFixed(1)}；贏了變 ${s.ic.eW.toFixed(1)}（+${(s.ic.eW-s.ic.eNow).toFixed(1)}），輸了變 ${s.ic.eL.toFixed(1)}（−${(s.ic.eNow-s.ic.eL).toFixed(1)}）。輸掉的損失大於贏到的收益，所以要更高的勝率才值得。</span></div>`;
  $('icm-c').disabled=$('icm-f').disabled=true;
}
function icmCalcRun(){
  const parse=s=>s.split(/[\s,，]+/).map(Number).filter(x=>!isNaN(x)&&x>=0);
  const st=parse($('ic-st').value),pay=parse($('ic-pay').value),out=$('ic-out');
  if(st.length<2||st.length>9||!pay.length){out.innerHTML='<div class="res bad">請輸入 2–9 個籌碼數字，以及至少一個獎金數字（用逗號分隔）。</div>';return}
  const eq=icmEq(st,pay),tot=st.reduce((a,b)=>a+b,0),pool=pay.reduce((a,b)=>a+b,0);
  out.innerHTML=`<table class="t"><tr><th>玩家</th><th>籌碼</th><th>籌碼佔比</th><th>ICM 價值</th><th>差異</th></tr>${st.map((s,i)=>{
    const share=s/tot*pool;return `<tr><td>${String.fromCharCode(65+i)}</td><td>${s}</td><td>${(s/tot*100).toFixed(1)}%（若按比例 ${share.toFixed(1)}）</td><td><b>${eq[i].toFixed(1)}</b></td><td style="color:${eq[i]>=share?'#2ea66a':'#d9534f'}">${eq[i]-share>=0?'+':''}${(eq[i]-share).toFixed(1)}</td></tr>`}).join('')}</table>
    <div class="mut">獎金總額 ${pool}；ICM 價值加總 ${eq.reduce((a,b)=>a+b,0).toFixed(1)}。「差異」＝ICM 價值 − 按籌碼比例分獎金；籌碼多的人為負，籌碼少的人為正。</div>`;
}
function renderIcm(){
  if(!ICMS.sc)ICMS.sc=icmGen();
  const s=ICMS.sc,st=icmStat(),names=['你','對手（BTN，全下）','玩家 C','玩家 D'],tot=s.base.reduce((a,b)=>a+b,0);
  $('t-icm').innerHTML=`<div class="panel"><h2>ICM 練習：泡沫期要不要跟注全下？</h2>
  <div class="mut">4 人剩餘、前 3 名有獎金（${s.pay.join(' / ')}），你們正在泡沫。對手全下，其餘盲注已棄牌（死錢 ${s.dead}bb），你覆蓋對手。只看籌碼可以跟，但考慮名次獎金後呢？</div>
  <table class="t" style="margin-top:8px"><tr><th>玩家</th><th>籌碼（bb）</th><th>佔比</th></tr>${s.base.map((b,i)=>`<tr><td>${names[i]}</td><td>${b}</td><td>${(b/tot*100).toFixed(0)}%</td></tr>`).join('')}</table>
  <div style="margin-top:8px">你的手牌：</div><div class="cards">${cardsHTML(s.hand)}</div>
  <div class="mut">對手在 BTN、${s.base[1]}bb 全下，依籌碼深度估計他的範圍約前 <b>${s.vpct}%</b> 的牌。</div>
  <button class="b g" id="icm-c" onclick="icmAnswer(true)">跟注</button><button class="b r" id="icm-f" onclick="icmAnswer(false)">棄牌</button><button class="b s" onclick="icmNew()">下一題</button>
  <div id="icm-res" aria-live="polite"></div>
  <div class="mut" style="margin-top:6px">累計 ${st.n} 題，正確率 ${st.n?Math.round(st.c/st.n*100):0}%。範圍為近似值；勝率用蒙地卡羅估算（約 ±2%）。</div></div>
  <div class="panel"><h2>ICM 計算機</h2><div class="mut">輸入剩餘玩家的籌碼與獎金（逗號分隔），計算每人的 ICM 獎金價值。</div>
  <label for="ic-st">籌碼</label><input type="text" id="ic-st" value="5000,3000,2000">
  <label for="ic-pay">獎金（第 1 名、第 2 名…）</label><input type="text" id="ic-pay" value="50,30,20">
  <button class="b" onclick="icmCalcRun()">計算</button><div id="ic-out" aria-live="polite"></div></div>`;
  icmCalcRun();
}

QGEN.icm=function(){
  const sets=[[5000,3000,2000],[6000,3000,1000],[4000,4000,2000],[7000,2000,1000],[3500,3500,3000],[8000,1500,500]];
  const st=sets[(Math.random()*sets.length)|0],pay=[50,30,20],k=(Math.random()*3)|0,eq=icmEq(st,pay),tot=st.reduce((a,b)=>a+b,0);
  const nm=['A','B','C'],ans=Math.round(eq[k]),share=Math.round(st[k]/tot*100);
  const set=[ans];[share,Math.round(100/3),ans+6,ans-6,ans+3].forEach(x=>{x=Math.max(1,Math.round(x));if(!set.includes(x)&&set.length<4)set.push(x)});
  let z=ans+9;while(set.length<4){if(!set.includes(z))set.push(z);z++}
  return {q:`3 人剩餘，獎金依序 50 / 30 / 20。籌碼：A ${st[0]}、B ${st[1]}、C ${st[2]}。玩家 <b>${nm[k]}</b> 的 ICM 獎金價值約為多少？`,opts:set.map(x=>x+''),a:0,
    why:`ICM 價值：A ${eq[0].toFixed(1)}、B ${eq[1].toFixed(1)}、C ${eq[2].toFixed(1)}（加總 100）。${nm[k]} 的籌碼佔 ${share}%，若按比例分獎金會是 ${share}（因為總額 100），但實際 ICM 價值是 ${eq[k].toFixed(1)}：籌碼多的人被「打折」、籌碼少的人被「加成」。`};
};
QGEN.icmneed=function(){
  const pay=[50,30,20],rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),hero=rnd(12,30),vil=rnd(8,hero),a=rnd(12,40),b=rnd(12,40);
  const base=[hero,vil,a,b],ic=icmCall(base,0,1,pay,1.5),need=Math.round(ic.need*100),chip=Math.round(ic.chipNeed*100);
  const set=[need];[chip,50,need+7,need-7].forEach(x=>{if(x>0&&x<100&&!set.includes(x)&&set.length<4)set.push(x)});let z=need+3;while(set.length<4){if(!set.includes(z))set.push(z);z++}
  return {q:`4 人剩餘、前 3 名有獎金（50 / 30 / 20）。籌碼（bb）：你 ${hero}、對手 ${vil}（全下）、C ${a}、D ${b}；底池另有 1.5bb 死錢。你覆蓋對手並考慮跟注。<b>考慮 ICM 後</b>，至少需要多少勝率？`,
    opts:set.map(x=>x+'%'),a:0,
    why:`只看籌碼的所需勝率約 ${chip}%（${chip}% 是把籌碼當成現金算出來的）。但輸掉會損失 ${(ic.eNow-ic.eL).toFixed(1)} 的獎金價值，贏了只增加 ${(ic.eW-ic.eNow).toFixed(1)}，所以 ICM 所需勝率 = 損失 ÷（損失 + 收益）≈ ${need}%（氣泡因子 ${ic.bf.toFixed(2)}）。`};
};

  <table class="t"><tr><th>籌碼深度</th><th>名稱</th><th>策略重點</th></tr>
  <tr><td>40bb 以上</td><td>長碼</td><td>接近現金桌打法，可玩翻後</td></tr><tr><td>20–40bb</td><td>中碼</td><td>翻前加注更精簡，避免無謂的小底池</td></tr>
  <tr><td>10–20bb</td><td>短碼</td><td>開始「加注全下」或棄牌，翻後空間有限</td></tr><tr><td>10bb 以下</td><td>極短碼</td><td>幾乎只有「全下或棄牌」</td></tr></table>
  <h3>M 值</h3><p><b>M = 籌碼 ÷（小盲 + 大盲 + 前注）</b>，代表你還能撐幾輪盲注。例：籌碼 1200、盲注 50/100、無前注，M = 1200 ÷ 150 = 8，也就是 12bb。</p>
  <p>盲注升級後，同樣的籌碼會落到更淺的區間——不動的人會被盲注慢慢吃掉。</p>`,
  quiz:[Q('籌碼 3000、盲注 100/200，有效籌碼約是幾 bb？',['10bb','15bb','20bb','30bb'],1,'3000 ÷ 200 = 15bb。'),
        Q('籌碼 3000、盲注 100/200、無前注，M 值是？',['5','10','15','30'],1,'M = 3000 ÷（100 + 200）= 10。'),
        Q('15bb 通常屬於哪個區間？',['長碼','中碼','短碼','極短碼'],2,'10–20bb 是短碼區，開始偏向加注全下或棄牌。')]},
 {id:'8.3',t:'獎金結構與泡沫期',prac:[['打一場錦標賽（模擬比賽）','t-sim']],
  body:()=>`<p>錦標賽的獎金是<b>階梯狀</b>的：名次差一名，獎金可能差很多。</p>
  <table class="t"><tr><th>名次（9 人 SNG）</th><th>獎金</th><th>與下一名差距</th></tr><tr><td>第 1 名</td><td>450</td><td>比第 2 名多 180</td></tr><tr><td>第 2 名</td><td>270</td><td>比第 3 名多 90</td></tr><tr><td>第 3 名</td><td>180</td><td>比第 4 名多 180</td></tr><tr><td>第 4 名以後</td><td>0</td><td>—</td></tr></table>
  <h3>泡沫期（bubble）</h3><p>離獎金圈只差<b>一個人被淘汰</b>的階段。此時被淘汰的後果最重（從有獎變成沒獎），所以每個人都比平常保守，這會改變正確的打法（第 9 級會學）。</p>
  <p>另一個重點：<b>多拿一倍籌碼，並不會讓你的獎金期望變成兩倍</b>。這就是下一級 ICM 要處理的。</p>`,
  quiz:[Q('9 人 SNG（450 / 270 / 180），第 3 名淘汰拿到多少？',['0','90','180','270'],2,'前 3 名有獎，第 3 名是 180。'),
        Q('「泡沫期」指的是？',['比賽剛開始','離獎金圈只差一人被淘汰','只剩兩人','盲注最小的時候'],1,'再淘汰一人就全部進入獎金圈的階段。'),
        Q('在錦標賽中，籌碼增加一倍，獎金期望通常？',['剛好增加一倍','增加不到一倍','增加超過一倍','不會變'],1,'獎金期望對籌碼是遞減的（凹函數），所以不到一倍。')]}
]},
{t:'短碼與 ICM',goal:'會推或棄牌、理解 ICM，並在泡沫期正確決定要不要跟注全下',lessons:[
 {id:'9.1',t:'推或棄牌（Push / Fold）',prac:[['打一場錦標賽（模擬比賽）','t-sim']],
  body:()=>`<p>有效籌碼約 <b>10–15bb 以下</b>，通常只有兩個選擇：<b>全下</b>或<b>棄牌</b>。小加注容易被 3-bet 全下逼退，浪費籌碼。</p>
  <h3>全下為什麼賺錢？</h3><div class="res"><b>EV(全下) = 對手棄牌率 × 底池 +（1 − 棄牌率）×［勝率 ×（底池 + 對手跟注額）− 敗率 × 你的全下額］</b></div>
  <p>例：全下 8bb，底池 1.5bb，對手 50% 棄牌，被跟注時你有 50% 勝率：EV = 0.5×1.5 + 0.5×［0.5×(1.5+8) − 0.5×8］= 0.75 + 0.375 = <b>+1.125bb</b>。光是對手會棄牌就讓全下賺錢。</p>
  <h3>範圍怎麼調整？</h3><ul><li><b>位置越後、籌碼越淺 → 全下範圍越寬</b>。</li>
  <li>本練習器的近似值（10bb）：UTG 約 12%、CO 約 30%、BTN 約 45%、SB 約 55%；籌碼更淺（5bb）BTN 超過 80%。</li><li>在 SB 只需面對 BB 一人，範圍最寬。</li></ul>
  <div class="mut">這些是用手牌強弱排序做的近似，不是精確的納許均衡推或棄牌表；要精確數字請使用專門的 push/fold 求解器。</div>`,
  quiz:[Q('全下 8bb，底池 1.5bb，對手 50% 棄牌，被跟注時勝率 50%。全下的 EV 約為？',['0','+0.4bb','+1.1bb','−1bb'],2,'0.5×1.5 + 0.5×(0.5×9.5 − 0.5×8) = 1.125bb。'),
        Q('為什麼籌碼很淺時不建議小加注？',['規則不允許','容易被再加注全下逼退，白白損失籌碼','因為會變成現金桌','因為比較便宜'],1,'小加注後被全下就難以跟注，所以直接全下或棄牌更有效率。'),
        Q('同樣是 10bb，哪個位置的全下範圍通常最寬？',['UTG','HJ','CO','SB（只剩 BB）'],3,'SB 只需面對 BB 一人，全下範圍最寬。')]},
 {id:'9.2',t:'ICM：籌碼不等於獎金',prac:[['ICM 練習','t-icm']],
  body:()=>{
    const st=[5000,3000,2000],eq=icmEq(st,[50,30,20]),tot=10000;
    return `<p><b>ICM（Independent Chip Model）</b>用籌碼比例估算每個人拿到各名次的機率，再算出<b>獎金期望（$EV）</b>。</p>
    <h3>範例：3 人剩餘，獎金 50 / 30 / 20</h3>
    <table class="t"><tr><th>玩家</th><th>籌碼</th><th>籌碼佔比</th><th>若按比例分獎金</th><th>ICM 價值</th></tr>
    ${st.map((s,i)=>`<tr><td>${'ABC'[i]}</td><td>${s}</td><td>${(s/tot*100).toFixed(0)}%</td><td>${(s/tot*100).toFixed(1)}</td><td><b>${eq[i].toFixed(1)}</b></td></tr>`).join('')}</table>
    <p>A 擁有 50% 的籌碼，但 ICM 價值只有 <b>${eq[0].toFixed(1)}</b>；C 只有 20% 籌碼，ICM 價值卻有 <b>${eq[2].toFixed(1)}</b>。</p>
    <h3>核心結論</h3><ul><li>籌碼的價值是<b>遞減</b>的：贏到 1000 籌碼增加的獎金，小於輸掉 1000 籌碼損失的獎金。</li>
    <li>所以<b>輸的代價大於贏的好處</b>，跟注全下要更高的勝率才值得。</li><li>每個決策應看<b>獎金期望（$EV）</b>，而不是只看籌碼期望。</li></ul>
    <p>你可以用「ICM 練習」分頁的計算機，輸入任意籌碼與獎金來驗證。</p>`;
  },
  quiz:[G_('icm'),G_('icm'),Q('ICM 的核心結論是？',['籌碼越多越賺','輸掉籌碼的損失大於贏得同量籌碼的收益','只有第一名有價值','籌碼和獎金成正比'],1,'獎金期望對籌碼是凹函數，輸比贏更傷。')]},
 {id:'9.3',t:'泡沫期與氣泡因子',prac:[['ICM 練習','t-icm']],
  body:()=>`<p>在 ICM 下，跟注全下所需的勝率是：</p>
  <div class="res"><b>ICM 所需勝率 = 損失 ÷（損失 + 收益）</b>　（損失、收益都用「獎金期望」計算）</div>
  <p><b>氣泡因子（Bubble Factor）= 損失 ÷ 收益</b>。氣泡因子 1 代表跟現金桌一樣；2 代表輸的代價是贏的兩倍，所需勝率約 67%。</p>
  <h3>泡沫期的策略</h3><ul>
  <li><b>大籌碼</b>：對手害怕被淘汰，你可以更寬地全下施壓，也可以放心用寬範圍跟注小籌碼的全下。</li>
  <li><b>中籌碼</b>：最保守的一群，避免和大籌碼、甚至另一個中籌碼硬碰。</li>
  <li><b>短籌碼</b>：快被盲注吃掉，通常要尋找機會全下，不能一直等。</li></ul>
  <div class="mut">練習器的「模擬比賽 → 錦標賽」在面對全下時，會顯示籌碼期望所需勝率與 ICM 所需勝率，可直接對照。</div>`,
  quiz:[G_('icmneed'),Q('氣泡因子大於 1 代表？',['贏的好處大於輸的代價','輸的代價大於贏的好處','跟現金桌一樣','不能跟注'],1,'氣泡因子 = 損失 ÷ 收益，大於 1 表示輸得比贏得更痛。'),
        Q('泡沫期通常最保守的是哪種籌碼？',['大籌碼','中籌碼','極短籌碼','都一樣'],1,'中籌碼既怕被淘汰，又能被大籌碼施壓，最需要小心。')]},
 {id:'9.4',t:'面對全下：跟注的思考步驟',prac:[['ICM 練習','t-icm']],
  body:()=>`<p>面對對手全下時，可以依序問自己：</p>
  <ol><li><b>對手的範圍</b>：他在什麼位置？有效籌碼多深？淺碼 + 後位 = 範圍很寬。</li>
  <li><b>我的勝率</b>：我的手牌對那個範圍有多少勝率？（練習器用蒙地卡羅算給你）</li>
  <li><b>所需勝率</b>：只看籌碼是多少？考慮 ICM 是多少？</li>
  <li><b>比較</b>：勝率高於所需勝率就跟注，低於就棄牌。</li>
  <li><b>後果</b>：輸了會不會被淘汰？贏了能不能躍升名次？</li></ol>
  <p>常見錯誤：只看「底池賠率很好」就跟注，卻忘了輸掉的獎金代價更大。</p>`,
  quiz:[Q('面對全下，第一個要判斷的是？',['對手的長相','對手的範圍（位置與籌碼）','我的籌碼排名','底池有多大'],1,'先估計對手能全下哪些牌，才能算出勝率。'),
        Q('我的勝率對對手範圍是 38%，籌碼 EV 所需 33%、ICM 所需 45%，應該？',['跟注','棄牌','全下','兩者皆可'],1,'38% 低於 ICM 所需的 45%，應棄牌；只看籌碼會誤判。'),
        Q('「只看底池賠率」在錦標賽泡沫期的風險是？',['沒有風險','低估輸掉的獎金代價','高估對手範圍','算錯底池'],1,'籌碼賠率沒有考慮獎金期望的不對稱。')]}
]},
{t:'後期與名次博弈',goal:'理解決賽桌動態、單挑，以及名次博弈中的風險與均衡',lessons:[
 {id:'10.1',t:'決賽桌與大小籌碼互動',prac:[['打一場錦標賽（模擬比賽）','t-sim']],
  body:()=>`<p>接近獎金階梯時，每個人的決策都會互相影響：</p>
  <ul><li><b>大籌碼</b>是「施壓者」：能對中小籌碼持續全下或大加注，因為對方怕被淘汰。</li>
  <li><b>中籌碼</b>是「被擠壓者」：要避免輸給大籌碼，但也不能完全不動，否則被盲注吃掉。</li>
  <li><b>短籌碼</b>是「等待者或搏命者」：要看自己離下一個獎金階梯有多遠，以及盲注何時會吃掉自己。</li></ul>
  <h3>看階梯（Pay Jump）</h3><p>下一個名次的獎金差越大，越值得「等別人先被淘汰」；差越小，越值得提高籌碼去爭第一。</p>`,
  quiz:[Q('為什麼大籌碼在泡沫期能施壓？',['規則賦予特權','中小籌碼怕被淘汰，不敢跟注','大籌碼不用付盲注','大籌碼牌一定比較好'],1,'對手的氣泡因子高，被迫棄牌更多。'),
        Q('離下一個名次的獎金差距很大時，短籌碼通常傾向？',['立刻亂全下','在合理範圍內等別人先被淘汰','必定跟注','退出比賽'],1,'獎金階梯大時，保住名次更有價值。'),
        Q('中籌碼最常見的困境是？',['沒有牌','被大籌碼擠壓，又怕被盲注吃掉','無法加注','不能全下'],1,'兩邊都有壓力：怕輸給大籌碼，也不能太被動。')]},
 {id:'10.2',t:'單挑（Heads-up）策略',prac:[['打一場錦標賽（模擬比賽）','t-sim']],
  body:()=>`<p>剩最後兩人時：</p>
  <ul><li><b>位置</b>：按鈕位同時是小盲，<b>翻前先行動、翻後最後行動</b>；大盲翻前最後行動、翻後先行動。</li>
  <li><b>範圍很寬</b>：按鈕位開池可達 70–80% 的牌；大盲防守也很寬。只有兩個人，牌平均起來就變弱，所以「很多牌都值得打」。</li>
  <li><b>ICM 變簡單</b>：兩人時獎金 ＝ 第 2 名獎金 +（第 1 名 − 第 2 名）× 籌碼佔比，是<b>線性</b>的，所以此時籌碼 EV 和獎金 EV 一致（氣泡因子約等於 1）。</li></ul>
  <p>也因此，單挑時可以回到「用籌碼期望決策」，不必再為淘汰風險額外保守。</p>`,
  quiz:[Q('單挑時，按鈕位翻前的行動順序是？',['最後行動','最先行動','不行動','看籌碼'],1,'按鈕位同時是小盲，翻前先行動；翻後則最後行動。'),
        Q('為什麼單挑時範圍可以很寬？',['規則允許','只有一個對手，隨機兩張牌的平均強度相對更高','盲注很小','沒有位置'],1,'只需要贏一個人，很多牌都有足夠勝率。'),
        Q('單挑時 ICM 價值對籌碼是？',['凹函數（遞減）','線性','凸函數','無關'],1,'兩人時獎金期望 = 第 2 名獎金 + 籌碼佔比 ×（第 1 名 − 第 2 名），是線性的。')]},
 {id:'10.3',t:'名次博弈論',prac:[['ICM 練習','t-icm'],['打一場錦標賽（模擬比賽）','t-sim']],
  body:()=>`<p>把錦標賽看成一場<b>名次的博弈</b>：獎金固定，你的名次取決於所有人的決策。</p>
  <h3>1. 風險態度來自獎金結構</h3><p>因為獎金期望對籌碼是凹的，等於每個玩家在<b>風險趨避</b>（寧可穩定也不賭）。越接近獎金階梯，越明顯。</p>
  <h3>2. 均衡與剝削</h3><ul><li>兩人短碼的推或棄牌有已知的納許均衡；多人情況複雜得多，均衡不唯一，而且常常有人會被「剝削」。</li>
  <li>如果大家都過度保守，大籌碼把壓力轉成收益；如果大家都過度積極，保守的人反而能賺。</li></ul>
  <h3>3. ICM 的限制</h3><ul><li>假設每個人贏下每手牌的機率只由籌碼決定，<b>忽略位置、技術差距與未來盲注壓力</b>。</li>
  <li>強的玩家實際上能把籌碼轉成更多名次價值，所以 ICM 對技術較好的人可能略微「過度保守」。</li></ul>
  <h3>4. 如何使用</h3><p>把 ICM 當作<b>估算工具</b>：判斷大概該更緊還是更鬆，而不是精確答案。再用對手風格與位置微調。</p>`,
  quiz:[Q('獎金期望對籌碼是凹函數，意味著玩家傾向？',['風險愛好','風險趨避（保守）','不在乎','只看第一名'],1,'凹函數代表輸的代價大於贏的好處，所以偏向保守。'),
        Q('ICM 的主要限制是？',['不能計算','忽略位置、技術差距與盲注壓力','只能算兩人','只能算現金'],1,'ICM 只用籌碼比例估算，沒有考慮其他實戰因素。'),
        Q('多人錦標賽的均衡比起兩人推或棄牌？',['更簡單','更複雜，且不唯一','完全一樣','不存在'],1,'多人加上獎金結構，策略互動複雜很多。')]},
 {id:'10.4',t:'錦標賽決策清單與總整理',prac:[['打一場錦標賽（模擬比賽）','t-sim'],['手牌歷史','t-hist']],
  body:()=>`<p>每次做重要決策前，快速走一遍：</p>
  <ol><li><b>有效籌碼</b>幾 bb？（長碼、中碼、短碼、極短碼）</li><li><b>位置</b>：後面還有幾個人？我有沒有位置？</li>
  <li><b>名次與獎金</b>：還剩幾人？離獎金圈或下一個階梯多遠？</li>
  <li><b>對手籌碼與風格</b>：誰能淘汰我？誰怕被淘汰？</li><li><b>ICM 壓力</b>：氣泡因子大概多高？</li>
  <li><b>期望值</b>：勝率對所需勝率（含 ICM）。</li></ol>
  <h3>練習建議</h3><ul><li>先打幾場 6 人 SNG，再挑戰 9 人 SNG。</li><li>每場結束，開「手牌歷史」複盤你的短碼全下與泡沫期跟注。</li>
  <li>用「ICM 練習」分頁反覆練習泡沫期跟注，把「所需勝率」變成直覺。</li></ul>
  <div class="res warn">本練習器為教學工具，沒有真錢；範圍、獎金結構與 ICM 都是簡化設定，不保證獲利。</div>`,
  quiz:[Q('做錦標賽決策時，第一件要看的是？',['對手的暱稱','有效籌碼是幾 bb','今天運氣','桌面顏色'],1,'籌碼深度決定可用的策略類型。'),
        Q('泡沫期最需要額外考慮的是？',['發牌速度','ICM 壓力（輸掉的獎金代價）','牌桌音效','手牌花色'],1,'氣泡因子讓所需勝率比現金桌更高。'),
        Q('複盤時，最值得回頭看的是？',['每一手的輸贏','短碼全下與泡沫期的關鍵決策','只看贏的手牌','不用複盤'],1,'這些決策對名次與獎金影響最大。')]}
]}
);
const _pracList=pracList;
pracList=function(l){
  if(l<8)return _pracList(l);
  const sh=SIM.sngHist||[],ic=icmStat(),pct=(c,n)=>n?Math.round(c/n*100):0,P=[];
  const paid=x=>x.place<=(x.n===9?3:2);

};

function sheetA11y(){

document.addEventListener('keydown',e=>{
  if(typeof G==='undefined'||!G||!G.sheet)return;
  const sh=document.querySelector('#t-sim .sheet');if(!sh)return;
  if(e.key==='Escape'){e.preventDefault();closeSheet();return}
  if(e.key==='Tab'){
    const f=[...sh.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!f.length)return;const a=f[0],z=f[f.length-1],cur=document.activeElement;
    if(e.shiftKey&&(cur===a||cur===sh)){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&cur===z){e.preventDefault();a.focus()}
    else if(!sh.contains(cur)){e.preventDefault();a.focus()}
  }
});

let ROUTING=false,ROUTE_READY=false;

  try{if(location.hash!==h)(ROUTE_READY?history.pushState:history.replaceState).call(history,null,'',h)}catch(e){}
  try{localStorage.setItem('gtoLast',h)}catch(e){}
}

function openLesson(l,i){
  CV={lv:l,ls:i,qs:genQs(COURSE[l].lessons[i]),done:false};
  const was=ROUTING;ROUTING=true;show('t-course');ROUTING=was;
  renderCourse();window.scrollTo(0,0);pushRoute('#/lesson/'+l+'.'+i);
}

function applyRoute(h){
  h=typeof h==='string'?h:(location.hash||'');
  let m=/^#\/lesson\/(\d+)\.(\d+)$/.exec(h);
  if(m){const l=+m[1],i=+m[2];if(COURSE[l]&&COURSE[l].lessons[i]){ROUTING=true;try{openLesson(l,i)}finally{ROUTING=false}return true}}
  m=/^#\/(t-[a-z]+)$/.exec(h);
  if(m&&document.getElementById(m[1])){ROUTING=true;try{if(m[1]==='t-course'||m[1]==='t-adv')CV.lv=null;show(m[1])}finally{ROUTING=false}return true}
  return false;
}

/* ---- F-002、F-007：計算機（欄位標籤、逐欄錯誤訊息） ---- */
function parseCardsDetailed(str,label){
  const t=str.replace(/[\s,]+/g,'');
  if(!t)return {cards:[],err:null};
  if(t.length%2)return {err:`${label}：每張牌需要 2 個字元（例如 AhKd），目前輸入「${str.trim()}」長度不對。`};
  const out=[];
  for(let i=0;i<t.length;i+=2){
    const r=RANKS.indexOf(t[i].toUpperCase()),u=SUITS.indexOf(t[i+1].toLowerCase()),tok=t.substr(i,2);
    if(r<0)return {err:`${label}：第 ${i/2+1} 張「${tok}」的點數「${t[i]}」無效（可用 2-9、T、J、Q、K、A）。`};
    if(u<0)return {err:`${label}：第 ${i/2+1} 張「${tok}」的花色「${t[i+1]}」無效（可用 s♠ h♥ d♦ c♣）。`};
    const c=u*13+r;if(out.includes(c))return {err:`${label}：「${tok}」重複出現。`};out.push(c);
  }
  return {cards:out,err:null};
}

  <label for="c-r">對手範圍</label><input type="text" id="c-r" placeholder="留空＝隨機手牌" value="77+,ATs+,KQs,AJo+,KQo" aria-describedby="c-res">

      if(bad.length)return fail('c-r',`對手範圍：無法辨識 ${bad.map(x=>'「'+x+'」').join('、')}。語法例如 77+、A2s+、ATo+、KQs、55:0.5。`);

/* ============ 情境練習：短碼、長碼、尺度解讀 ============ */
SIM.depth=100;
function keepForSize(f){return f<=0.3?0.7:f<=0.4?0.62:f<=0.6?0.55:f<=0.8?0.48:f<=1.05?0.42:0.33}
function sizeRead(f){
  return f<=0.34?'小注：範圍較寬，含薄價值、保護與試探':f<=0.6?'中等尺度：標準的價值與詐唬混合':f<=0.85?'偏大：範圍偏極化（強牌或詐唬）':f<=1.1?'滿池：高度極化':'超池：極化到只剩很強的牌或純詐唬';
}
const _postAdvice=postAdvice;
postAdvice=function(i){
  const r=_postAdvice(i),p=G.players[i];
  if(G.curBet>p.bet&&G.lastFrac!==undefined&&G.lastFrac>0){
    const f=G.lastFrac;
    r.text+=`｜<b>尺度解讀</b>：對手下注約 ${Math.round(f*100)}% 底池 → ${sizeRead(f)}（所需勝率 ${Math.round(f/(1+2*f)*100)}%、最低防守 ${Math.round(100/(1+f))}%）`;
  }
  return r;
};

const SCN={mode:'A',sc:null,answered:false};
const scnStat=k=>{S.scn=S.scn||{};S.scn[k]=S.scn[k]||{n:0,c:0};return S.scn[k]};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[(Math.random()*a.length)|0];
const SCN_TITLE={A:'短碼：推或棄牌',B:'短碼：面對全下',C:'長碼：翻後下注',D:'尺度解讀：面對下注'};
function boardTexture(b){
  const suits={},ranks=b.map(c=>c%13).sort((x,y)=>x-y);b.forEach(c=>{const s=(c/13)|0;suits[s]=(suits[s]||0)+1});
  const paired=new Set(ranks).size<ranks.length,fl=Math.max(...Object.values(suits)),span=ranks[ranks.length-1]-ranks[0];
  const tags=[];if(paired)tags.push('配對面');
  if(fl>=3)tags.push('同花面（有三張同花）');else if(fl===2&&b.length===3)tags.push('兩張同花（有聽花）');
  if(span<=4&&new Set(ranks).size>=3)tags.push('連張面（順子聽牌多）');
  if(!tags.length)tags.push('乾燥面（聽牌少）');
  return tags.join('、');
}
function sampleCombo(map,used){
  const cs=expand(map).filter(x=>!used.has(x.a)&&!used.has(x.b));let u=Math.random()*cs.reduce((t,x)=>t+x.w,0),x=cs[cs.length-1];
  for(const y of cs){u-=y.w;if(u<=0){x=y;break}}return [x.a,x.b];
}
/* ---- A：短碼推或棄牌 ---- */
function scnGenA(){
  const pos=pick(['UTG','HJ','CO','BTN','SB','BTN','SB']),eff=rnd(6,16),pct=shovePct(pos,eff),m=pctMap(pct),bl=borderline(m);
  let l;if(Math.random()<0.55&&bl.length)l=pick(bl);else{const d=shuffled(52);l=handLabel(d[0],d[1])}
  const x=pick(expand(new Map([[l,1]])));
  return {type:'A',pos,eff,pct,m,hand:[x.a,x.b],label:l,f:m.get(l)||0};
}
/* ---- B：短碼面對全下（現金桌，只看籌碼期望） ---- */
function scnGenB(){
  const vp=pick(['UTG','HJ','CO','BTN','SB']),E=rnd(6,16),vpct=Math.round(shovePct(vp,E)),rg=expand(pctMap(vpct));
  const dead=vp==='SB'?0:0.5,pot0=E+1+dead,toCall=E-1,need=toCall/(pot0+toCall);
  let best=null;
  for(let k=0;k<14;k++){const d=shuffled(52),h=[d[0],d[1]],r=equity(h,[],rg,500);if(!r)continue;const diff=Math.abs(r.eq-need);if(!best||diff<best.diff)best={h,eq:r.eq,diff}}
  return {type:'B',vp,E,vpct,need,pot0,toCall,hand:best.h,eq:best.eq};
}
/* ---- C：長碼翻後下注 ---- */
function betActs(eq,street){
  if(eq>=.72)return {r:.85,c:.15,frac:.66};
  if(eq>=.58)return {r:.6,c:.4,frac:.5};
  if(eq>=.45)return {r:.25,c:.75,frac:.33};
  if(eq>=.25){const b=street<3?.3:.12;return {r:b,c:1-b,frac:.5}}
  return {r:.12,c:.88,frac:.66};
}
function scnGenC(){
  const depth=pick([40,60,100]),op=pick(['CO','BTN','UTG','HJ']);
  const heroMap=rangeFor(op,6),vMap=wmaps(FACE[FACEKEY['BB|'+p6(op)]]||GEN.g1).mC;
  const used=new Set(),hand=sampleCombo(heroMap,used);hand.forEach(c=>used.add(c));
  const d=shuffled(52).filter(c=>!used.has(c)),board=d.slice(0,3);
  const r=equity(hand,board,expand(vMap),1500),eq=r?r.eq:0.5,a=betActs(eq,1);
  return {type:'C',depth,op,hand,board,eq,acts:a,pot:5.5,spr:(depth-2.5)/5.5,tex:boardTexture(board)};
}
/* ---- D：尺度解讀 ---- */
function scnGenD(){
  const street=pick([1,1,2]),op=pick(['CO','BTN','HJ']),f=pick([.25,.33,.5,.75,1,1.5]);
  const used=new Set(),hand=sampleCombo(wmaps(FACE[FACEKEY['BB|'+p6(op)]]||GEN.g1).mC,used);hand.forEach(c=>used.add(c));
  const d=shuffled(52).filter(c=>!used.has(c)),board=d.slice(0,street===1?3:4);
  const pot=pick([6,8,10,12,16]),bet=Math.max(1,round2(pot*f)),ff=bet/pot;
  const base=expand(rangeFor(op,6)),rg=narrowBet(base,board,keepForSize(ff));
  const r=equity(hand,board,rg,1200),eq=r?r.eq:0.5,need=bet/(pot+2*bet),m=eq-need;
  let acts;
  if(eq>=.8)acts={r:.65,c:.35,f:0};else if(m>=.10)acts={r:.12,c:.88,f:0};else if(m>=.02)acts={r:0,c:1,f:0};
  else if(m>=-.03)acts={r:0,c:.5,f:.5};else if(eq>.28&&street<3)acts={r:.12,c:0,f:.88};else acts={r:0,c:0,f:1};
  return {type:'D',street,op,hand,board,pot,bet,ff,eq,need,mdf:pot/(pot+bet),acts,base,m};
}
